<!doctype html><html data-theme="light"><meta charset=utf-8>
<script>window.UEMS_ICON_SPRITE='/design-system-library/src/icons/icons.svg';</script>
<style>body{font-family:sans-serif;background:#fff;padding:16px}
.row{display:flex;align-items:center;gap:24px;margin-bottom:10px;border-bottom:1px solid #eee;padding:6px 0}
.lab{width:90px;font-size:12px;font-weight:600}
.fig{width:28px;height:28px;border:1px solid #ccc;display:flex;align-items:center;justify-content:center}
.fig img{width:20px;height:20px}
.cand{display:flex;gap:14px;align-items:center}
.cand figure{margin:0;text-align:center;font-size:9px;color:#555}
ds-icon{color:#15181e}</style>
<script type="module">import '/design-system-library/src/components/index.js';</script>
<body>
<div class="row"><div class="lab">UPDATE</div><div class="fig"><img src="/__figcmp/update.svg"></div>
 <div class="cand"><figure><ds-icon name="update" size="20"></ds-icon><br>update</figure><figure><ds-icon name="refresh" size="20"></ds-icon><br>refresh</figure><figure><ds-icon name="sync" size="20"></ds-icon><br>sync</figure><figure><ds-icon name="installing-updates" size="20"></ds-icon><br>installing-updates</figure><figure><ds-icon name="refresh-time" size="20"></ds-icon><br>refresh-time</figure></div></div>

<div class="row"><div class="lab">DARK THEME</div><div class="fig"><img src="/__figcmp/dark.svg"></div>
 <div class="cand"><figure><ds-icon name="light-bulb" size="20"></ds-icon><br>light-bulb</figure><figure><ds-icon name="palette" size="20"></ds-icon><br>palette</figure></div></div>

<div class="row"><div class="lab">REVIEW</div><div class="fig"><img src="/__figcmp/review.svg"></div>
 <div class="cand"><figure><ds-icon name="star" size="20"></ds-icon><br>star</figure><figure><ds-icon name="file-star" size="20"></ds-icon><br>file-star</figure></div></div>

<div class="row"><div class="lab">ROAD MAP</div><div class="fig"><img src="/__figcmp/roadmap.svg"></div>
 <div class="cand"><figure><ds-icon name="light-bulb" size="20"></ds-icon><br>light-bulb</figure><figure><ds-icon name="route" size="20"></ds-icon><br>route</figure><figure><ds-icon name="lightbulb-energy" size="20"></ds-icon><br>lightbulb-energy</figure></div></div>

<div class="row"><div class="lab">GET QUOTE</div><div class="fig"><img src="/__figcmp/quote.svg"></div>
 <div class="cand"><figure><ds-icon name="quote-down" size="20"></ds-icon><br>quote-down</figure><figure><ds-icon name="sticker" size="20"></ds-icon><br>sticker</figure></div></div>
<div id="done">ready</div>
</body></html>
