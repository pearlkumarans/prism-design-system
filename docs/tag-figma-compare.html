<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<title>tag ↔ figma compare</title>
<link rel="icon" type="image/png" href="assets/prism-logo.png">
<link rel="stylesheet" href="../design-system-library/src/tokens/index.css">
<link rel="stylesheet" href="../design-system-library/src/components/tag/tag.css">
<script>window.UEMS_ICON_SPRITE = '../design-system-library/src/icons/icons.svg';</script>
<script type="module" src="../design-system-library/src/icons/icon.js"></script>
<script type="module" src="../design-system-library/src/components/tag/tag.js"></script>
<style>body{background:#fff;padding:20px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;} pre{width:100%;font-size:11px;}</style>
</head>
<body>
  <ds-tag id="dflt" label="Tag"></ds-tag>
  <ds-tag id="s" size="small"  label="Tag"></ds-tag>
  <ds-tag id="m" size="medium" label="Tag"></ds-tag>
  <ds-tag id="l" size="large"  label="Tag"></ds-tag>
  <ds-tag id="m-st" size="medium" leading="status" status="success" label="Tag"></ds-tag>
  <ds-tag id="m-ic" size="medium" leading="icon" icon="tag" label="Tag"></ds-tag>
  <ds-tag id="l-ic" size="large"  leading="icon" icon="tag" label="Tag"></ds-tag>
  <ds-tag id="v-n" variant="neutral" size="medium" label="Tag"></ds-tag>
  <ds-tag id="v-p" variant="primary" size="medium" label="Tag"></ds-tag>
  <ds-tag id="v-s" variant="success" size="medium" label="Tag"></ds-tag>
  <ds-tag id="v-w" variant="warning" size="medium" label="Tag"></ds-tag>
  <ds-tag id="v-e" variant="error"   size="medium" label="Tag"></ds-tag>
  <ds-tag id="v-o" variant="outline" size="medium" label="Tag"></ds-tag>
  <ds-tag id="dis" variant="neutral" size="medium" disabled label="Tag"></ds-tag>
  <ds-tag id="dis-o" variant="outline" size="medium" disabled label="Tag"></ds-tag>
  <ds-tag id="noclose" size="medium" show-close="false" label="Tag"></ds-tag>
  <ds-tag id="kbd" size="medium" label="Zap"></ds-tag>
  <pre id="report">measuring…</pre>
<script type="module">
const hex = (rgb) => { const m = rgb.match(/\d+/g); return m ? '#'+m.slice(0,3).map(n=>(+n).toString(16).padStart(2,'0')).join('').toUpperCase() : rgb; };
await customElements.whenDefined('ds-tag');
await new Promise(r => setTimeout(r, 600));
const lines = []; let pass=0, fail=0;
const check = (id, what, got, want) => { const ok = String(got)===String(want); ok?pass++:fail++; lines.push(`${ok?'PASS':'FAIL'} ${id} ${what}: got=${got} want=${want}`); };
const root = id => document.getElementById(id).querySelector('.ds-tag');
// default = small + neutral
check('dflt','default-height',Math.round(root('dflt').getBoundingClientRect().height),16);
// sizes: height, paddings, gap, radius, font
for (const [id,h,ps,pe,rad,fs,lh] of [['s',16,'4px','4px','4px','10px','14px'],['m',20,'6px','4px','4px','12px','16px'],['l',24,'8px','4px','6px','14px','20px']]) {
  const el=root(id), cs=getComputedStyle(el);
  check(id,'height',Math.round(el.getBoundingClientRect().height),h);
  check(id,'pad-start',cs.paddingInlineStart,ps);
  check(id,'pad-end',cs.paddingInlineEnd,pe);
  check(id,'gap',cs.gap,'2px');
  check(id,'radius',cs.borderRadius,rad);
  check(id,'font',cs.fontSize+'/'+cs.lineHeight+'/'+cs.fontWeight,`${fs}/${lh}/500`);
}
// leading adjustments
check('m-st','status-pad-start',getComputedStyle(root('m-st')).paddingInlineStart,'4px');
check('m-ic','icon-pad-end',getComputedStyle(root('m-ic')).paddingInlineEnd,'6px');
check('l-ic','icon-pad-end',getComputedStyle(root('l-ic')).paddingInlineEnd,'8px');
// status dot
{ const dot=document.querySelector('#m-st .ds-tag__dot'); check('m-st','dot-fill',hex(getComputedStyle(dot).backgroundColor),'#0C8844');
  const box=document.querySelector('#m-st .ds-tag__dot-box'); check('m-st','dot-box',Math.round(box.getBoundingClientRect().width),14); }
// variant colors
for (const [id,bg,fg] of [['v-n','#F0F2F5','#15181E'],['v-p','#EAF0FC','#184091'],['v-s','#E7F3ED','#0A7138'],['v-w','#FFEEE5','#BC4200'],['v-e','#FDEBEB','#C1181B']]) {
  const cs=getComputedStyle(root(id));
  check(id,'bg',hex(cs.backgroundColor),bg);
  check(id,'fg',hex(cs.color),fg);
}
{ const cs=getComputedStyle(root('v-o'));
  check('v-o','bg-transparent',cs.backgroundColor==='rgba(0, 0, 0, 0)',true);
  check('v-o','border',hex(cs.borderTopColor)+'/'+cs.borderTopWidth,'#C3C9D6/1px'); }
// close button
for (const [id,rad] of [['s','2px'],['m','9999px'],['l','9999px']]) {
  const c=document.querySelector(`#${id} .ds-tag__close`), cs=getComputedStyle(c), r=c.getBoundingClientRect();
  check(id,'close-size',Math.round(r.width)+'x'+Math.round(r.height),'16x16');
  check(id,'close-radius',cs.borderRadius,rad);
  check(id,'close-color(icon-tertiary)',hex(cs.color),'#55607A');
}
check('s','close-tabindex',document.querySelector('#s .ds-tag__close').getAttribute('tabindex'),'-1');
check('s','tag-tabindex',root('s').getAttribute('tabindex'),'0');
// disabled
{ const cs=getComputedStyle(root('dis'));
  check('dis','opacity',cs.opacity,'0.5');
  check('dis','bg(disabled)',hex(cs.backgroundColor),'#E1E4EB');
  check('dis','fg(disabled)',hex(cs.color),'#8893AD');
  check('dis','no-tabindex',root('dis').getAttribute('tabindex')===null,true);
  check('dis','close-icon-disabled',hex(getComputedStyle(document.querySelector('#dis .ds-tag__close')).color),'#8893AD'); }
check('dis-o','border-disabled',hex(getComputedStyle(root('dis-o')).borderTopColor),'#E1E4EB');
// no close
check('noclose','close-absent',document.querySelector('#noclose .ds-tag__close')===null,true);
// keyboard removal
{ let fired=false;
  const el=document.getElementById('kbd');
  el.addEventListener('ds-tag-close',()=>{fired=true;});
  root('kbd').dispatchEvent(new KeyboardEvent('keydown',{key:'Backspace',bubbles:true}));
  await new Promise(r=>setTimeout(r,50));
  check('kbd','backspace-removes',fired && !document.getElementById('kbd'),true); }
lines.unshift(`RESULT: ${pass} pass / ${fail} fail`);
document.getElementById('report').textContent = lines.join('\n');
</script>
</body>
</html>
