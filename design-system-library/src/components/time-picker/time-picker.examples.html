<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ds-time-picker — examples</title>
  <script type="module">import '../../index.js';</script>
  <style>
    body { font-family: var(--font-family-sans); padding: 24px; background: var(--uems-background); color: var(--uems-text-primary); }
    section { margin-bottom: 32px; max-width: 720px; }
    h2 { font-size: var(--font-size-14); color: var(--uems-text-tertiary); font-weight: 600; margin: 0 0 8px; }
    .row { display: flex; gap: 32px; align-items: flex-end; flex-wrap: wrap; }
    .out { margin-top: 8px; font-family: var(--font-family-mono); font-size: 12px; color: var(--uems-text-secondary); }
  </style>
</head>
<body>
  <section>
    <h2>List (default) — 12h, 30-min step</h2>
    <ds-time-picker id="t1" label="Start time" label-position="top" value="09:30"></ds-time-picker>
    <div class="out" id="t1-out"></div>
  </section>

  <section>
    <h2>List — 24h, 15-min step, with Now</h2>
    <ds-time-picker id="t2" label="Cutoff" label-position="top" hour-cycle="24" step="15" show-now></ds-time-picker>
    <div class="out" id="t2-out"></div>
  </section>

  <section>
    <h2>List — bounds 09:00–17:00 (business hours)</h2>
    <ds-time-picker id="t3" label="Meeting" label-position="top" min="09:00" max="17:00" step="30"></ds-time-picker>
    <div class="out" id="t3-out"></div>
  </section>

  <section>
    <h2>Inline — 12h</h2>
    <ds-time-picker id="t4" variant="inline" label="Reminder" label-position="top" value="14:05"></ds-time-picker>
    <div class="out" id="t4-out"></div>
  </section>

  <section>
    <h2>Inline — 24h</h2>
    <ds-time-picker id="t5" variant="inline" label="Deploy at" label-position="top" hour-cycle="24" value="23:45"></ds-time-picker>
    <div class="out" id="t5-out"></div>
  </section>

  <section>
    <h2>Sizes (list)</h2>
    <div class="row">
      <ds-time-picker size="small"  label="Small"  label-position="top" value="08:00"></ds-time-picker>
      <ds-time-picker size="medium" label="Medium" label-position="top" value="08:00"></ds-time-picker>
      <ds-time-picker size="large"  label="Large"  label-position="top" value="08:00"></ds-time-picker>
    </div>
  </section>

  <section>
    <h2>States</h2>
    <div class="row">
      <ds-time-picker label="Error" label-position="top" validation-state="error" helper-text="Pick a valid time" value="25:00"></ds-time-picker>
      <ds-time-picker label="Disabled" label-position="top" disabled value="10:00"></ds-time-picker>
      <ds-time-picker variant="inline" label="Inline error" label-position="top" validation-state="error"></ds-time-picker>
    </div>
  </section>

  <section>
    <h2>Range (type="range") — pick start, then end</h2>
    <ds-time-picker id="t6" type="range" label="Meeting window" label-position="top" value="09:00/17:00" clearable></ds-time-picker>
    <div class="out" id="t6-out"></div>
  </section>

  <section>
    <h2>Presets + Now (list) &amp; range presets</h2>
    <div class="row">
      <ds-time-picker id="t7" label="With presets" label-position="top" show-now></ds-time-picker>
      <ds-time-picker id="t8" type="range" label="Range presets" label-position="top"></ds-time-picker>
    </div>
    <div class="out" id="t7-out"></div>
    <div class="out" id="t8-out"></div>
  </section>

  <section>
    <h2>Clearable (list + inline)</h2>
    <div class="row">
      <ds-time-picker id="t9" label="Clearable list" label-position="top" clearable value="13:15"></ds-time-picker>
      <ds-time-picker id="t10" variant="inline" label="Clearable inline" label-position="top" clearable value="08:45"></ds-time-picker>
    </div>
  </section>

  <script type="module">
    customElements.whenDefined('ds-time-picker').then(() => {
      document.getElementById('t7').presets = [
        { label: 'Start of day', value: '09:00' },
        { label: 'Lunch', value: '12:30' },
        { label: 'End of day', value: '18:00' },
      ];
      document.getElementById('t8').presets = [
        { label: 'Business hours', value: '09:00/17:00' },
        { label: 'Morning', value: '06:00/12:00' },
        { label: 'Afternoon', value: '12:00/18:00' },
      ];
    });
    ['t1','t2','t3','t4','t5','t6','t7','t8'].forEach((id) => {
      const el = document.getElementById(id);
      const out = document.getElementById(id + '-out');
      const show = () => { out.textContent = 'value=' + JSON.stringify(el.value); };
      el.addEventListener('ds-time-picker-change', show);
      customElements.whenDefined('ds-time-picker').then(show);
    });
  </script>
</body>
</html>
