<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles/index.css"><script type="module" src="../../index.js"></script><style>body{padding:24px;font-family:var(--font-family-sans);display:flex;flex-direction:column;gap:16px}</style></head>
<body><h1>Toggle</h1>
<div style="display:flex;gap:16px;align-items:center"><ds-toggle size="small"></ds-toggle><ds-toggle size="medium"></ds-toggle><ds-toggle size="large"></ds-toggle></div>
<div style="display:flex;gap:16px;align-items:center"><ds-toggle checked></ds-toggle><ds-toggle checked show-text></ds-toggle><ds-toggle disabled></ds-toggle><ds-toggle disabled checked></ds-toggle></div>

<h2 style="font-size:14px;color:var(--uems-text-secondary);margin-top:16px">With field label (default off)</h2>
<div style="display:flex;flex-direction:column;gap:14px;align-items:flex-start">
  <ds-toggle label="Enable notifications"></ds-toggle>
  <ds-toggle label="Auto-sync" checked></ds-toggle>
  <ds-toggle label="Two-factor authentication" size="small"></ds-toggle>
  <ds-toggle label="Beta features" size="large"></ds-toggle>
  <ds-toggle label="Locked setting" disabled></ds-toggle>
</div>
</body></html>
