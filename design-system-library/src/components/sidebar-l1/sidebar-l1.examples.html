<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sidebar L1 — examples</title>
  <link rel="stylesheet" href="../../styles/index.css" />
  <script type="module" src="../../index.js"></script>
  <style>
    body { margin: 0; font-family: var(--font-family-sans); display: flex; gap: 24px; padding: 24px; }
  </style>
</head>
<body>
  <ds-sidebar-l1 id="s1" show-collapse></ds-sidebar-l1>
  <ds-sidebar-l1 id="s2" collapsed show-collapse></ds-sidebar-l1>

  <script type="module">
    import '../../index.js';
    const items = [
      { id: 'dashboard',  label: 'Dashboard',  icon: 'add-widget',          active: true },
      { id: 'threats',    label: 'Threats',    icon: 'exclamation-triangle' },
      { id: 'patches',    label: 'Patches',    icon: 'file-shield' },
      { id: 'systems',    label: 'Systems',    icon: 'computer' },
      { id: 'deployment', label: 'Deployment', icon: 'data-flow-01' },
      { id: 'compliance', label: 'Compliance', icon: 'circle-tick' },
      { id: 'reports',    label: 'Reports',    icon: 'file-report' },
      { id: 'settings',   label: 'Settings',   icon: 'file-setting' },
    ];
    const bottom = [{ id: 'update', label: 'Update Now', icon: 'arrow-down-circle' }];
    [document.getElementById('s1'), document.getElementById('s2')].forEach((el) => {
      el.items = items;
      el.bottomItems = bottom;
    });
  </script>
</body>
</html>
