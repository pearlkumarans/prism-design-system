<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ds-field-helper — examples</title>
  <script type="module">import '../../index.js';</script>
  <style>
    body { font-family: var(--font-family-sans); padding: 24px; background: var(--uems-background); color: var(--uems-text-primary); }
    section { margin-bottom: 32px; }
    h2 { font-size: var(--font-size-14); color: var(--uems-text-tertiary); margin: 0 0 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    /* The helper row stretches to its field width — constrain to a field-sized
       column so the trailing counter pins to a realistic edge. */
    .field { width: 320px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <section>
    <h2>States</h2>
    <div class="field"><ds-field-helper state="default" text="Code sent to your phone"></ds-field-helper></div>
    <div class="field"><ds-field-helper state="error" text="That code is incorrect"></ds-field-helper></div>
    <div class="field"><ds-field-helper state="success" text="Verified successfully"></ds-field-helper></div>
    <div class="field"><ds-field-helper state="disabled" text="This field is unavailable"></ds-field-helper></div>
  </section>

  <section>
    <h2>Negative (spec alias of error)</h2>
    <div class="field"><ds-field-helper state="negative" text="Password is too short"></ds-field-helper></div>
  </section>

  <section>
    <h2>With character counter</h2>
    <div class="field"><ds-field-helper state="default" text="Describe the issue" counter="12/232"></ds-field-helper></div>
    <div class="field"><ds-field-helper state="error" text="Too long" counter="240/232"></ds-field-helper></div>
  </section>

  <section>
    <h2>Counter only</h2>
    <div class="field"><ds-field-helper counter="0/140"></ds-field-helper></div>
  </section>

  <section>
    <h2>Without icon</h2>
    <div class="field"><ds-field-helper state="default" text="Plain helper text, no leading icon" show-icon="false"></ds-field-helper></div>
    <div class="field"><ds-field-helper state="error" text="Error text without icon" show-icon="false"></ds-field-helper></div>
  </section>

  <section>
    <h2>Custom icon</h2>
    <div class="field"><ds-field-helper state="default" text="Heads up — this is important" icon="exclamation-circle"></ds-field-helper></div>
  </section>

  <section>
    <h2>Slotted text</h2>
    <div class="field"><ds-field-helper state="success">Provided via the default slot instead of the text attribute</ds-field-helper></div>
  </section>

  <section>
    <h2>RTL</h2>
    <div class="field"><ds-field-helper rtl state="error" text="هذا الرمز غير صحيح" counter="12/232"></ds-field-helper></div>
  </section>
</body>
</html>
