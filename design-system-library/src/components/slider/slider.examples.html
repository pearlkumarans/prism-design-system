<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles/index.css"><script type="module" src="../../index.js"></script><style>body{padding:24px;font-family:var(--font-family-sans);display:flex;flex-direction:column;gap:24px;max-width:360px}</style></head>
<body>
  <ds-slider label="Volume" value="50"></ds-slider>
  <ds-slider label="Quality" size="medium" value="3" min="1" max="5" step="1" show-min-max min-label="Low" max-label="High" helper="Affects processing time"></ds-slider>
