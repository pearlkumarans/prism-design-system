<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Inline Alert — examples</title>
  <link rel="stylesheet" href="../../styles/index.css" />
  <script type="module" src="../../index.js"></script>
  <style>
    body { padding: 24px; font-family: var(--font-family-sans); display: flex; flex-direction: column; gap: 12px; max-width: 560px; }
  </style>
</head>
<body>
  <h1>Inline Alert</h1>

  <ds-inline-alert type="info" title="Sync in progress" description="Your data is being synchronised. This may take a few minutes." show-dismiss></ds-inline-alert>
  <ds-inline-alert type="success" title="Changes saved" description="Your profile has been updated successfully." action="View profile"></ds-inline-alert>
  <ds-inline-alert type="warning" title="Storage almost full" description="You have used 90% of your available storage." action="Manage storage"></ds-inline-alert>
  <ds-inline-alert type="error" title="Upload failed" description="The file could not be uploaded due to a network error." action="Retry upload"></ds-inline-alert>
  <ds-inline-alert type="neutral" title="No results found" description="Try a different search term."></ds-inline-alert>

  <h2>Intense</h2>
  <ds-inline-alert style-variant="intense" type="info" title="Maintenance scheduled" description="System unavailable Sat 18:00 UTC." action="View status"></ds-inline-alert>
  <ds-inline-alert style-variant="intense" type="success" title="Deployment succeeded" description="Build #482 is live."></ds-inline-alert>
  <ds-inline-alert style-variant="intense" type="warning" title="Browser unsupported" description="Some features may be missing."></ds-inline-alert>
  <ds-inline-alert style-variant="intense" type="error" title="Action blocked" description="You don’t have permission to do this." show-dismiss></ds-inline-alert>
</body>
</html>
