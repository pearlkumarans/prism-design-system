<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ds-calendar — examples</title>
  <script type="module">import '../../index.js';</script>
  <style>
    body { font-family: var(--font-family-sans); padding: 24px; background: var(--uems-background); color: var(--uems-text-primary); }
    section { margin-bottom: 32px; }
    h2 { font-size: var(--font-size-14); color: var(--uems-text-tertiary); margin: 0 0 12px; font-weight: 600; }
    .out { font-family: var(--font-family-mono); font-size: 12px; color: var(--uems-text-secondary); margin-top: 8px; }
  </style>
</head>
<body>
  <section>
    <h2>Single date picker</h2>
    <ds-calendar id="single" type="single" value="2026-04-15"></ds-calendar>
    <div class="out" id="single-out"></div>
  </section>

  <section>
    <h2>Range picker (with footer)</h2>
    <ds-calendar id="range" type="range" value="2026-04-09/2026-04-22" show-footer></ds-calendar>
    <div class="out" id="range-out"></div>
  </section>

  <section>
    <h2>Single + footer</h2>
    <ds-calendar type="single" show-footer></ds-calendar>
  </section>

  <script>
    document.getElementById('single').addEventListener('ds-calendar-change', (e) => {
      document.getElementById('single-out').textContent = JSON.stringify(e.detail);
    });
    document.getElementById('range').addEventListener('ds-calendar-change', (e) => {
      document.getElementById('range-out').textContent = JSON.stringify(e.detail);
    });
  </script>
</body>
</html>
