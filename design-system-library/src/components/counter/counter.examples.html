<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ds-counter — examples</title>
  <script type="module">import '../../index.js';</script>
  <style>
    body { font-family: var(--font-family-sans); padding: 24px; background: var(--uems-background); color: var(--uems-text-primary); }
    section { margin-bottom: 24px; }
    h2 { font-size: var(--font-size-14); color: var(--uems-text-tertiary); font-weight: 600; margin: 0 0 8px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <section>
    <h2>Subtle × all states (medium)</h2>
    <div class="row">
      <ds-counter variant="subtle" state="default"     value="57"></ds-counter>
      <ds-counter variant="subtle" state="active"      value="57"></ds-counter>
      <ds-counter variant="subtle" state="critical"    value="57"></ds-counter>
      <ds-counter variant="subtle" state="moderate"    value="57"></ds-counter>
      <ds-counter variant="subtle" state="important"   value="57"></ds-counter>
      <ds-counter variant="subtle" state="success"     value="57"></ds-counter>
      <ds-counter variant="subtle" state="acknowledge" value="57"></ds-counter>
    </div>
  </section>

  <section>
    <h2>Intense × all states (medium)</h2>
    <div class="row">
      <ds-counter variant="intense" state="default"     value="57"></ds-counter>
      <ds-counter variant="intense" state="active"      value="57"></ds-counter>
      <ds-counter variant="intense" state="critical"    value="57"></ds-counter>
      <ds-counter variant="intense" state="moderate"    value="57"></ds-counter>
      <ds-counter variant="intense" state="important"   value="57"></ds-counter>
      <ds-counter variant="intense" state="success"     value="57"></ds-counter>
      <ds-counter variant="intense" state="acknowledge" value="57"></ds-counter>
    </div>
  </section>

  <section>
    <h2>Sizes</h2>
    <div class="row">
      <ds-counter variant="subtle"  state="active" size="small"  value="3"></ds-counter>
      <ds-counter variant="subtle"  state="active" size="medium" value="12"></ds-counter>
      <ds-counter variant="subtle"  state="active" size="large"  value="99+"></ds-counter>
      <ds-counter variant="intense" state="critical" size="small"  value="!"></ds-counter>
      <ds-counter variant="intense" state="critical" size="medium" value="9"></ds-counter>
      <ds-counter variant="intense" state="critical" size="large"  value="248"></ds-counter>
    </div>
  </section>
</body>
</html>
