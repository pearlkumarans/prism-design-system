<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ds-button — examples</title>
  <script type="module">import '../../index.js';</script>
  <style>
    body { font-family: var(--font-family-sans); padding: 24px; background: var(--uems-background); color: var(--uems-text-primary); }
    section { margin-bottom: 32px; }
    h2 { font-size: var(--font-size-14); color: var(--uems-text-tertiary); margin: 0 0 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <section>
    <h2>Variants × medium</h2>
    <div class="row">
      <ds-button variant="primary">Primary</ds-button>
      <ds-button variant="secondary">Secondary</ds-button>
      <ds-button variant="tertiary">Tertiary</ds-button>
      <ds-button variant="outline">Outline</ds-button>
      <ds-button variant="destructive">Destructive</ds-button>
      <ds-button variant="success">Success</ds-button>
      <ds-button variant="warning">Warning</ds-button>
      <ds-button variant="secondary-color">Secondary Color</ds-button>
    </div>
  </section>

  <section>
    <h2>Sizes × primary</h2>
    <div class="row">
      <ds-button variant="primary" size="large">Large</ds-button>
      <ds-button variant="primary" size="medium">Medium</ds-button>
      <ds-button variant="primary" size="small">Small</ds-button>
      <ds-button variant="primary" size="xsmall">Xsmall</ds-button>
    </div>
  </section>

  <section>
    <h2>With icons</h2>
    <div class="row">
      <ds-button variant="primary" prefix-icon="add">Add item</ds-button>
      <ds-button variant="secondary" suffix-icon="chevron-down">More</ds-button>
      <ds-button variant="outline" prefix-icon="download" suffix-icon="chevron-down">Export</ds-button>
      <ds-button variant="tertiary" prefix-icon="link">Open in new tab</ds-button>
    </div>
  </section>

  <section>
    <h2>States</h2>
    <div class="row">
      <ds-button variant="primary">Default</ds-button>
      <ds-button variant="primary" loading>Loading</ds-button>
      <ds-button variant="primary" disabled>Disabled</ds-button>
      <ds-button variant="destructive" disabled>Disabled destructive</ds-button>
    </div>
  </section>

  <section>
    <h2>RTL</h2>
    <div class="row">
      <ds-button rtl variant="primary" prefix-icon="add">إضافة</ds-button>
      <ds-button rtl variant="outline" suffix-icon="chevron-left">السابق</ds-button>
    </div>
  </section>
</body>
</html>
