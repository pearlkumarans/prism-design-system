<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sidebar L2 — examples</title>
  <link rel="stylesheet" href="../../styles/index.css" />
  <script type="module" src="../../index.js"></script>
  <style>
    body { margin: 0; font-family: var(--font-family-sans); display: flex; gap: 0; padding: 0; height: 100vh; }
  </style>
</head>
<body>
  <ds-sidebar-l1 id="l1"></ds-sidebar-l1>
  <ds-sidebar-l2 id="l2" variant="settings" title="Settings Home" show-back></ds-sidebar-l2>

  <script type="module">
    import '../../index.js';
    document.getElementById('l1').items = [
      { id: 'home',     label: 'Home',        icon: 'home', active: true },
      { id: 'devices',  label: 'Devices',     icon: 'laptop' },
      { id: 'insights', label: 'Insights',    icon: 'lightbulb-energy' },
      { id: 'alerts',   label: 'Alerts',      icon: 'exclamation-circle' },
      { id: 'sensors',  label: 'Sensors',     icon: 'wifi' },
      { id: 'flows',    label: 'Workflows',   icon: 'data-flow-01' },
      { id: 'deploy',   label: 'Deployments', icon: 'puzzle' },
      { id: 'dash',     label: 'Dashboards',  icon: 'add-widget' },
      { id: 'ext',      label: 'Extensions',  icon: 'file-extension' },
      { id: 'set',      label: 'Settings',    icon: 'file-setting' },
    ];
    document.getElementById('l2').groups = [
      { id: 'global', label: 'Global Settings', expanded: true, items: [
        { id: 'cg',  label: 'Custom Group' },
        { id: 'rb',  label: 'Rebranding' },
        { id: 'ssp', label: 'Self Service Portal Settin…' },
        { id: 'cm',  label: 'Credential Manager' },
        { id: 'cf',  label: 'Custom Field' },
        { id: 'cd',  label: 'Add Custom Data for Co…' },
        { id: 'dex', label: 'DEX Manager' },
      ] },
      { id: 'admin', label: 'User Administration', expanded: true, items: [
        { id: 'usr', label: 'Users' },
        { id: 'rol', label: 'Role' },
        { id: 'mob', label: 'Mobile App' },
        { id: 'sml', label: 'SAML Authentication' },
      ] },
      { id: 'agent', label: 'Agent', expanded: true, items: [
        { id: 'as',  label: 'Agent Settings' },
        { id: 'som', label: 'SoM Settings' },
        { id: 'aap', label: 'Azure Autopilot' },
        { id: 'ape', label: 'Apple Enrollment (ABM)' },
        { id: 'apns',label: 'APNS Certificate' },
      ] },
      { id: 'srv', label: 'Server Settings', expanded: true, items: [
        { id: 'nat', label: 'NAT Settings' },
        { id: 'pxy', label: 'Proxy Server' },
        { id: 'mail',label: 'Mail Server' },
      ] },
    ];
  </script>
</body>
</html>
