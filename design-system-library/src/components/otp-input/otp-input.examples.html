<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OTP Input — examples</title>
  <link rel="stylesheet" href="../../styles/index.css" />
  <script type="module" src="../../index.js"></script>
  <style>
    body { padding: 24px; font-family: var(--font-family-sans); display: flex; flex-direction: column; gap: 24px; }
    h3 { margin: 0; }
  </style>
</head>
<body>
  <h1>OTP Input</h1>

  <div><h3>4-digit · Small · Default</h3>
    <ds-otp-input length="4" size="small" label="Verification code" helper="Enter the 4-digit code"></ds-otp-input>
  </div>
  <div><h3>6-digit · Medium · Default</h3>
    <ds-otp-input length="6" size="medium" label="Verification code" helper="Code sent to your email"></ds-otp-input>
  </div>
  <div><h3>6-digit · Large · Error</h3>
    <ds-otp-input length="6" size="large" state="error" label="Verification code" helper="Incorrect code. Please try again."></ds-otp-input>
  </div>
  <div><h3>Disabled</h3>
    <ds-otp-input length="6" size="medium" state="disabled" label="Verification code" disabled></ds-otp-input>
  </div>
  <div><h3>RTL</h3>
    <ds-otp-input length="6" size="medium" rtl label="رمز التحقق" helper="تم إرسال الرمز"></ds-otp-input>
  </div>
</body>
</html>
