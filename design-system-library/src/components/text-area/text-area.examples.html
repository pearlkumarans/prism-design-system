<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles/index.css"><script type="module" src="../../index.js"></script><style>body{padding:24px;font-family:var(--font-family-sans);display:flex;flex-direction:column;gap:16px;max-width:680px}</style></head>
<body>
