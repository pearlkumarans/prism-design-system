<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ds-divider — examples</title>
  <script type="module">import '../../index.js';</script>
  <style>
    body { font-family: var(--font-family-sans); padding: 24px; background: var(--uems-background); color: var(--uems-text-primary); max-width: 600px; }
    section { margin-bottom: 32px; }
    h2 { font-size: var(--font-size-14); color: var(--uems-text-tertiary); font-weight: 600; margin: 0 0 8px; }
    .toolbar { display: inline-flex; align-items: center; gap: 8px; height: 32px; }
  </style>
</head>
<body>
  <section>
    <h2>Horizontal — full / inset / middle inset</h2>
    <ds-divider></ds-divider>
    <p>Section A</p>
    <ds-divider type="inset"></ds-divider>
    <p>Section B</p>
    <ds-divider type="middle-inset"></ds-divider>
    <p>Section C</p>
  </section>

  <section>
    <h2>Patterns</h2>
    <ds-divider pattern="solid"></ds-divider>
    <p>Solid</p>
    <ds-divider pattern="dashed"></ds-divider>
    <p>Dashed</p>
    <ds-divider pattern="dotted"></ds-divider>
    <p>Dotted</p>
  </section>

  <section>
    <h2>Thickness</h2>
    <ds-divider thickness="thin"></ds-divider>
    <p>Thin (1px)</p>
    <ds-divider thickness="medium"></ds-divider>
    <p>Medium (2px)</p>
  </section>

  <section>
    <h2>With text</h2>
    <ds-divider type="with-text" label="Or"></ds-divider>
    <ds-divider type="with-text" label="Today"></ds-divider>
    <ds-divider type="with-text" thickness="medium" label="Continue"></ds-divider>
  </section>

  <section>
    <h2>Vertical</h2>
    <div class="toolbar">
      <button>Bold</button>
      <button>Italic</button>
      <ds-divider orientation="vertical"></ds-divider>
      <button>Link</button>
      <button>Image</button>
      <ds-divider orientation="vertical" thickness="medium"></ds-divider>
      <button>Save</button>
    </div>
  </section>
</body>
</html>
