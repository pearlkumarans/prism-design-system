<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ds-module-rail — examples</title>
  <script type="module">import '../../index.js';</script>
  <style>
    body { font-family: var(--font-family-sans); padding: 24px; background: var(--uems-background); color: var(--uems-text-primary); }
    section { margin-bottom: 32px; }
    h2 { font-size: var(--font-size-14); color: var(--uems-text-tertiary); margin: 0 0 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .row { display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; }
    /* The rail expands to its container height; give each demo a bordered frame so
       the transparent rail and its overflow folding are visible. */
    .frame { height: 360px; border: 1px solid var(--uems-border-tertiary); border-radius: 12px; background: var(--uems-bg-base); display: flex; }
  </style>
</head>
<body>
  <section>
    <h2>Default (icon + label)</h2>
    <div class="row">
      <div class="frame"><ds-module-rail id="rail-default"></ds-module-rail></div>
    </div>
  </section>

  <section>
    <h2>Icons-only (labels hidden → hover tooltips)</h2>
    <div class="row">
      <div class="frame"><ds-module-rail id="rail-icons" icons-only></ds-module-rail></div>
    </div>
  </section>

  <section>
    <h2>Overflow (short frame → bottom "more" flyout)</h2>
    <div class="row">
      <div class="frame" style="height:240px;"><ds-module-rail id="rail-overflow"></ds-module-rail></div>
    </div>
  </section>

  <section>
    <h2>RTL</h2>
    <div class="row" dir="rtl">
      <div class="frame"><ds-module-rail id="rail-rtl" rtl></ds-module-rail></div>
    </div>
  </section>

  <script>
    const items = [
      { id: 'home',    label: 'Home',        icon: 'home', active: true },
      { id: 'inv',     label: 'Inventory',   icon: 'layers' },
      { id: 'patch',   label: 'Patch Mgmt',  icon: 'shield-check' },
      { id: 'config',  label: 'Configurations', icon: 'settings' },
      { id: 'sw',      label: 'Software',    icon: 'package' },
      { id: 'reports', label: 'Reports',     icon: 'bar-chart' },
      { id: 'mdm',     label: 'MDM',         icon: 'smartphone' },
      { id: 'tools',   label: 'Tools',       icon: 'tool' },
    ];
    const clone = () => items.map((i) => ({ ...i }));
    document.getElementById('rail-default').items  = clone();
    document.getElementById('rail-icons').items    = clone();
    document.getElementById('rail-overflow').items = clone();
    document.getElementById('rail-rtl').items      = clone();

    document.addEventListener('ds-module-rail-select', (e) => {
      console.log('selected', e.detail.id, e.detail.item);
    });
  </script>
</body>
</html>
