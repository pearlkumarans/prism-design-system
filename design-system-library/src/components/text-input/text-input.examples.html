<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles/index.css"><script type="module" src="../../index.js"></script><style>body{padding:24px;font-family:var(--font-family-sans);display:flex;flex-direction:column;gap:16px;max-width:600px}</style></head>
<body>
  <ds-text-input label="Email" placeholder="you@example.com" required helper="We'll never share your email."></ds-text-input>
  <ds-text-input label="Price" placeholder="0.00" prefix-text="$" suffix-text="USD"></ds-text-input>
  <ds-text-input label="Search" prefix-icon="search" show-clear placeholder="Search…" label-position="top"></ds-text-input>
  <ds-text-input label="Username" state="error" helper="Username already taken." value="admin"></ds-text-input>
  <ds-text-input label="Verified" state="success" helper="Looks good." value="alice@example.com"></ds-text-input>
  <ds-text-input label="Locked" state="disabled" value="cannot edit"></ds-text-input>
</body></html>
