<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Rich Text Editor — examples</title>
  <link rel="stylesheet" href="../../styles/index.css" />
  <script type="module" src="../../index.js"></script>
  <style>body{padding:24px;display:flex;flex-direction:column;gap:32px;font-family:var(--font-family-sans)}</style>
</head>
<body>
  <h1>Rich Text Editor</h1>
  <ds-rich-text-editor label="Description" placeholder="Start typing..." helper="Type $ to add variables"></ds-rich-text-editor>
  <ds-rich-text-editor label="Notes" toolbar="hidden" placeholder="Plain notes" show-helper-row="false"></ds-rich-text-editor>
  <ds-rich-text-editor label="Announcement body" state="error" helper="Announcement body is required."></ds-rich-text-editor>
  <ds-rich-text-editor label="Body" state="disabled"></ds-rich-text-editor>
</body>
</html>
