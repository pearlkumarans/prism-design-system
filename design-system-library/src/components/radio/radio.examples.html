<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ds-radio — examples</title>
  <script type="module">import '../../index.js';</script>
  <style>
    body { font-family: var(--font-family-sans); padding: 24px; background: var(--uems-background); color: var(--uems-text-primary); }
    section { margin-bottom: 32px; }
    h2 { font-size: var(--font-size-14); color: var(--uems-text-tertiary); margin: 0 0 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .col { display: flex; gap: 12px; flex-direction: column; align-items: flex-start; }
  </style>
</head>
<body>
  <section>
    <h2>Sizes × selected</h2>
    <div class="row">
      <ds-radio name="size-demo" value="s" size="s" label="Small (16)" checked></ds-radio>
      <ds-radio name="size-demo" value="m" size="m" label="Medium (20)"></ds-radio>
      <ds-radio name="size-demo" value="l" size="l" label="Large (24)"></ds-radio>
      <ds-radio name="size-demo" value="mobile" size="mobile" label="Mobile (20, 44px row)"></ds-radio>
    </div>
  </section>

  <section>
    <h2>Selected vs unselected</h2>
    <div class="row">
      <ds-radio name="state-demo" value="on" label="Selected" checked></ds-radio>
      <ds-radio name="state-demo" value="off" label="Unselected"></ds-radio>
    </div>
  </section>

  <section>
    <h2>States</h2>
    <div class="row">
      <ds-radio name="states" value="default" label="Default"></ds-radio>
      <ds-radio name="states" value="checked" label="Checked" checked></ds-radio>
      <ds-radio name="states-d" value="disabled" label="Disabled" disabled></ds-radio>
      <ds-radio name="states-d" value="disabled-checked" label="Disabled checked" checked disabled></ds-radio>
    </div>
  </section>

  <section>
    <h2>Error</h2>
    <div class="row">
      <ds-radio name="err" value="err" label="Error unselected" error></ds-radio>
      <ds-radio name="err" value="err-checked" label="Error selected" error checked></ds-radio>
    </div>
  </section>

  <section>
    <h2>With help icon</h2>
    <div class="row">
      <ds-radio name="help" value="help" label="Has trailing info icon" show-help-icon></ds-radio>
      <ds-radio name="help" value="help2" label="Selected + help" show-help-icon checked></ds-radio>
    </div>
  </section>

  <section>
    <h2>Radio group (same name)</h2>
    <div class="col">
      <ds-radio name="plan" value="basic" label="Basic" checked></ds-radio>
      <ds-radio name="plan" value="pro" label="Pro"></ds-radio>
      <ds-radio name="plan" value="enterprise" label="Enterprise"></ds-radio>
    </div>
  </section>

  <section>
    <h2>Default-slotted label</h2>
    <div class="row">
      <ds-radio name="slotted" value="a">Label from text content</ds-radio>
    </div>
  </section>

  <section>
    <h2>RTL</h2>
    <div class="col">
      <ds-radio rtl name="rtl-grp" value="rtl1" label="خيار واحد" checked></ds-radio>
      <ds-radio rtl name="rtl-grp" value="rtl2" label="خيار اثنان"></ds-radio>
    </div>
  </section>
</body>
</html>
