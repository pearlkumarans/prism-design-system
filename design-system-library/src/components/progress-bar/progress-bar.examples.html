<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Progress Bar — examples</title>
  <link rel="stylesheet" href="../../styles/index.css" />
  <script type="module" src="../../index.js"></script>
  <style>body{padding:24px;display:flex;flex-direction:column;gap:16px;max-width:480px;font-family:var(--font-family-sans)}</style>
</head>
<body>
  <h1>Progress Bar</h1>
  <ds-progress-bar label="Uploading" value="25"></ds-progress-bar>
  <ds-progress-bar label="Analysis complete" variant="success" value="100" value-label="Done"></ds-progress-bar>
  <ds-progress-bar label="Storage used" variant="warning" value="82" size="medium"></ds-progress-bar>
  <ds-progress-bar label="Sync failed" variant="error" value="43" value-label="Failed at 43%"></ds-progress-bar>
  <ds-progress-bar label="Processing…" variant="indeterminate" size="medium"></ds-progress-bar>
  <ds-progress-bar label="Onboarding" value="3" max="8" value-label="Step 3 of 8" size="large"></ds-progress-bar>
  <ds-progress-bar label="Quota" value="50" disabled></ds-progress-bar>
</body>
</html>
