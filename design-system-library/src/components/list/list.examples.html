<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>List — examples</title>
  <link rel="stylesheet" href="../../styles/index.css" />
  <script type="module" src="../../index.js"></script>
  <style>
    body { padding: 24px; font-family: var(--font-family-sans); display: grid; grid-template-columns: repeat(2, 1fr); gap: 32px; max-width: 980px; }
    h2 { margin: 0 0 8px; font-size: 14px; }
    .col { display: flex; flex-direction: column; gap: 12px; }
  </style>
</head>
<body>
  <div class="col">
    <h2>Unordered — Small</h2>
    <ds-list id="ul-s" size="small"></ds-list>
  </div>
  <div class="col">
    <h2>Ordered — Medium</h2>
    <ds-list id="ol-m" size="medium" ordered></ds-list>
  </div>

  <div class="col">
    <h2>Unordered — Large with levels</h2>
    <ds-list id="ul-l" size="large"></ds-list>
  </div>
  <div class="col">
    <h2>Ordered — Levels with letter at L3</h2>
    <ds-list id="ol-lvl" ordered size="medium"></ds-list>
  </div>

  <script type="module">
    document.getElementById('ul-s').items = [
      'List item text',
      'List item text',
      'List item text',
    ];
    document.getElementById('ol-m').items = [
      'Step one',
      'Step two',
      'Step three',
    ];
    document.getElementById('ul-l').items = [
      'Top-level item',
      { text: 'Sub-level item', level: 2 },
      { text: 'Deepest item', level: 3 },
      'Back to top',
    ];
    document.getElementById('ol-lvl').items = [
      'First',
      { text: 'Sub of first', level: 2 },
      { text: 'Even deeper', level: 3 },
      'Second',
    ];
  </script>
</body>
</html>
