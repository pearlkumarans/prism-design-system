<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../styles/index.css">
  <script>window.UEMS_ICON_SPRITE = '../../icons/icons.svg';</script>
  <script type="module" src="../../index.js"></script>
  <style>
    body { padding: 32px; font-family: var(--font-family-sans); display: grid; gap: 28px; max-width: 760px; background: #F8FAFE; }
    h2 { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #5F6C89; text-transform: uppercase; margin: 0; }
    .row { display: grid; gap: 12px; }
  </style>
</head>
<body>

  <section class="row">
    <h2>Sizes</h2>
    <ds-search-field size="small"  placeholder="Search…"></ds-search-field>
    <ds-search-field size="medium" placeholder="Search…"></ds-search-field>
    <ds-search-field size="large"  placeholder="Search…"></ds-search-field>
  </section>

  <section class="row">
    <h2>With shortcut hint (⌘K)</h2>
    <ds-search-field size="small"  placeholder="Search…" show-shortcut></ds-search-field>
    <ds-search-field size="medium" placeholder="Search globally" show-shortcut></ds-search-field>
    <ds-search-field size="large"  placeholder="Search everywhere" show-shortcut shortcut-label="Ctrl K"></ds-search-field>
  </section>

  <section class="row">
    <h2>States</h2>
    <ds-search-field size="medium" placeholder="Default state"></ds-search-field>
    <ds-search-field size="medium" placeholder="Filled state" value="Endpoint"></ds-search-field>
    <ds-search-field size="medium" placeholder="Loading state" value="Endpoint" loading></ds-search-field>
    <ds-search-field size="medium" placeholder="Disabled state" disabled></ds-search-field>
    <ds-search-field size="medium" placeholder="Error state" value="!@#$" error></ds-search-field>
  </section>

  <section class="row">
    <h2>RTL</h2>
    <ds-search-field size="medium" placeholder="ابحث…" show-shortcut rtl></ds-search-field>
    <ds-search-field size="medium" value="نتيجة" rtl></ds-search-field>
  </section>

  <script>
    document.addEventListener('ds-search-field-input',  (e) => console.log('input',  e.detail.value));
    document.addEventListener('ds-search-field-submit', (e) => console.log('submit', e.detail.value));
    document.addEventListener('ds-search-field-clear',  () => console.log('cleared'));
  </script>
</body>
</html>
