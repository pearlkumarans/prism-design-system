<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles/index.css"><script type="module" src="../../index.js"></script><style>
  body{padding:24px;font-family:var(--font-family-sans);display:flex;flex-direction:column;gap:32px;max-width:760px}
  h4{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--uems-text-secondary)}
</style></head>
<body>

  <div>
    <h4>Expanded · Alerts tab (default)</h4>
    <ds-message-box tab="alerts" alerts-count="12" information-count="3">
      <ds-inline-alert slot="alerts" type="warning" style-variant="subtle" accent-bar
        description="This is a description of the alert message that provides additional context for the user."
        action="Action" action-position="inline"></ds-inline-alert>
      <ds-inline-alert slot="alerts" type="warning" style-variant="subtle" accent-bar
        title="Unsupported operating systems detected" show-title
        description="Support for operating systems older than Windows 7 / Windows Server 2008 R2 and macOS 11 has ended. Agents on these systems will be removed automatically."
        action="View affected devices" action-position="inline"></ds-inline-alert>
      <ds-inline-alert slot="alerts" type="warning" style-variant="subtle" accent-bar
        description="This is a description of the alert message that provides additional context for the user."></ds-inline-alert>
      <ds-inline-alert slot="alerts" type="warning" style-variant="subtle" accent-bar
        description="Fourth alert — only reachable by scrolling past the 3-row cap."
        action="Action" action-position="inline"></ds-inline-alert>

      <ds-inline-alert slot="information" type="info" style-variant="subtle" accent-bar
        description="This is a description of the alert message that provides additional context for the user."
        action="Action" action-position="inline"></ds-inline-alert>
      <ds-inline-alert slot="information" type="info" style-variant="subtle" accent-bar
        description="This is a description of the alert message that provides additional context for the user."
        action="Action" action-position="inline"></ds-inline-alert>
    </ds-message-box>
  </div>

  <div>
    <h4>Overflow — caps at 3 rows, scrolls beyond</h4>
    <ds-message-box tab="alerts" alerts-count="6" information-count="3">
      <ds-inline-alert slot="alerts" type="warning" style-variant="subtle" accent-bar description="Alert one — this should be visible." action="Action" action-position="inline"></ds-inline-alert>
      <ds-inline-alert slot="alerts" type="warning" style-variant="subtle" accent-bar description="Alert two — this should be visible."></ds-inline-alert>
      <ds-inline-alert slot="alerts" type="warning" style-variant="subtle" accent-bar description="Alert three — this should be visible."></ds-inline-alert>
      <ds-inline-alert slot="alerts" type="warning" style-variant="subtle" accent-bar description="Alert four — only via scroll." action="Action" action-position="inline"></ds-inline-alert>
      <ds-inline-alert slot="alerts" type="warning" style-variant="subtle" accent-bar description="Alert five — only via scroll."></ds-inline-alert>
      <ds-inline-alert slot="alerts" type="warning" style-variant="subtle" accent-bar description="Alert six — only via scroll."></ds-inline-alert>
    </ds-message-box>
  </div>

  <div>
    <h4>Collapsed (no active tab)</h4>
    <ds-message-box tab="alerts" expanded="false" alerts-count="12" information-count="3">
      <ds-inline-alert slot="alerts" type="warning" style-variant="subtle" accent-bar
        description="Hidden until expanded."></ds-inline-alert>
    </ds-message-box>
  </div>

  <div>
    <h4>Information tab active</h4>
    <ds-message-box tab="information" alerts-count="12" information-count="3">
      <ds-inline-alert slot="alerts" type="warning" style-variant="subtle" accent-bar
        description="An alert row."></ds-inline-alert>
      <ds-inline-alert slot="information" type="info" style-variant="subtle" accent-bar
        description="This is a description of the alert message that provides additional context for the user."
        action="Action" action-position="inline"></ds-inline-alert>
      <ds-inline-alert slot="information" type="info" style-variant="subtle" accent-bar
        description="This is a description of the alert message that provides additional context for the user."
        action="Action" action-position="inline"></ds-inline-alert>
      <ds-inline-alert slot="information" type="info" style-variant="subtle" accent-bar
        description="This is a description of the alert message that provides additional context for the user."
        action="Action" action-position="inline"></ds-inline-alert>
    </ds-message-box>
  </div>

  <div>
    <h4>RTL</h4>
    <ds-message-box tab="alerts" rtl alerts-count="12" information-count="3">
      <ds-inline-alert slot="alerts" type="warning" style-variant="subtle" accent-bar
        description="هذا وصف لرسالة التنبيه يوفر سياقًا إضافيًا للمستخدم." action="إجراء" action-position="inline"></ds-inline-alert>
      <ds-inline-alert slot="alerts" type="warning" style-variant="subtle" accent-bar
        description="هذا وصف لرسالة التنبيه يوفر سياقًا إضافيًا للمستخدم."></ds-inline-alert>
      <ds-inline-alert slot="information" type="info" style-variant="subtle" accent-bar
        description="هذا وصف لرسالة المعلومات."></ds-inline-alert>
    </ds-message-box>
  </div>

</body></html>
