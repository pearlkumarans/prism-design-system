<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles/index.css"><script type="module" src="../../index.js"></script><style>
  body{padding:24px;font-family:var(--font-family-sans);display:flex;flex-direction:column;gap:24px}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  h4{margin:0;font-size:12px;font-weight:600;color:var(--uems-text-secondary)}
</style></head>
<body>
  <div>
    <h4>Primary (default)</h4>
    <div class="row">
      <ds-split-button size="large"   label="Save" icon="add"></ds-split-button>
      <ds-split-button size="medium"  label="Save" icon="add"></ds-split-button>
      <ds-split-button size="small"   label="Save" icon="add"></ds-split-button>
      <ds-split-button size="xsmall"  label="Save" icon="add"></ds-split-button>
      <ds-split-button label="Disabled" icon="add" disabled></ds-split-button>
    </div>
  </div>

  <div>
    <h4>Outline</h4>
    <div class="row">
      <ds-split-button variant="outline" size="large"   label="Save" icon="add"></ds-split-button>
      <ds-split-button variant="outline" size="medium"  label="Save" icon="add"></ds-split-button>
      <ds-split-button variant="outline" size="small"   label="Save" icon="add"></ds-split-button>
      <ds-split-button variant="outline" size="xsmall"  label="Save" icon="add"></ds-split-button>
      <ds-split-button variant="outline" label="Disabled" icon="add" disabled></ds-split-button>
    </div>
  </div>
</body></html>
