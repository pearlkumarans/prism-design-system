<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ds-tab-bar-horizontal — examples</title>
  <script type="module">import '../../index.js';</script>
  <style>
    body { font-family: var(--font-family-sans); padding: 24px; background: var(--uems-background); color: var(--uems-text-primary); }
    section { margin-bottom: 32px; }
    h2 { font-size: var(--font-size-14); color: var(--uems-text-tertiary); margin: 0 0 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .narrow { max-width: 420px; }
  </style>
</head>
<body>
  <section>
    <h2>Underline (default) × active second tab</h2>
    <div class="row">
      <ds-tab-bar-horizontal id="ex-underline" type="underline" active-id="activity" aria-label="Page sections"></ds-tab-bar-horizontal>
    </div>
  </section>

  <section>
    <h2>Fill</h2>
    <div class="row">
      <ds-tab-bar-horizontal id="ex-fill" type="fill" active-id="overview" aria-label="View mode"></ds-tab-bar-horizontal>
    </div>
  </section>

  <section>
    <h2>With icons + badge + disabled tab</h2>
    <div class="row">
      <ds-tab-bar-horizontal id="ex-icons" type="underline" active-id="overview" aria-label="Account sections"></ds-tab-bar-horizontal>
    </div>
  </section>

  <section>
    <h2>Overflow (scrollable / pager)</h2>
    <div class="row narrow">
      <ds-tab-bar-horizontal id="ex-overflow" type="underline" active-id="t1" aria-label="Many sections"></ds-tab-bar-horizontal>
    </div>
  </section>

  <section>
    <h2>RTL</h2>
    <div class="row">
      <ds-tab-bar-horizontal id="ex-rtl" type="underline" rtl active-id="activity" aria-label="أقسام الصفحة"></ds-tab-bar-horizontal>
    </div>
  </section>

  <script type="module">
    const sectionItems = [
      { id: 'overview', label: 'Overview' },
      { id: 'activity', label: 'Activity' },
      { id: 'members',  label: 'Members' },
      { id: 'settings', label: 'Settings' },
    ];

    document.getElementById('ex-underline').items = sectionItems;

    document.getElementById('ex-fill').items = [
      { id: 'overview', label: 'List' },
      { id: 'grid',     label: 'Grid' },
      { id: 'board',    label: 'Board' },
    ];

    document.getElementById('ex-icons').items = [
      { id: 'overview', label: 'Overview', icon: 'home' },
      { id: 'activity', label: 'Activity', icon: 'activity', badge: '12' },
      { id: 'members',  label: 'Members',  icon: 'mail-user' },
      { id: 'settings', label: 'Settings', icon: 'file-setting', disabled: true },
    ];

    document.getElementById('ex-overflow').items = Array.from({ length: 10 }, (_, i) => ({
      id: `t${i + 1}`, label: `Section ${i + 1}`,
    }));

    document.getElementById('ex-rtl').items = [
      { id: 'overview', label: 'Overview', labelRtl: 'نظرة عامة', icon: 'home' },
      { id: 'activity', label: 'Activity', labelRtl: 'النشاط', icon: 'activity', badge: '12' },
      { id: 'members',  label: 'Members',  labelRtl: 'الأعضاء', icon: 'mail-user' },
    ];
  </script>
</body>
</html>
