<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Dropdown Menu — examples</title>
  <link rel="stylesheet" href="../../styles/index.css" />
  <script type="module" src="../../index.js"></script>
  <style>
    body { padding: 24px; font-family: var(--font-family-sans); display: flex; gap: 32px; flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
    h3 { margin: 0; }
  </style>
</head>
<body>
  <h1 style="flex-basis:100%">Dropdown Menu</h1>

  <div class="col">
    <h3>Single select</h3>
    <ds-dropdown-menu id="m1" type="single" open></ds-dropdown-menu>
  </div>

  <div class="col">
    <h3>Multi select</h3>
    <ds-dropdown-menu id="m2" type="multi" header-text="Filter by status" open></ds-dropdown-menu>
  </div>

  <div class="col">
    <h3>With sections</h3>
    <ds-dropdown-menu id="m3" type="sections" open></ds-dropdown-menu>
  </div>

  <div class="col">
    <h3>Nested (action)</h3>
    <p style="font-size:12px;color:var(--uems-text-tertiary);max-width:26ch">
      Hover or focus <strong>Export</strong>, then press <kbd>→</kbd>. <kbd>←</kbd> or
      <kbd>Esc</kbd> steps back one level.
    </p>
    <ds-dropdown-menu id="m4" type="action" show-title title="Actions" open></ds-dropdown-menu>
  </div>

  <script type="module">
    import '../../index.js';
    const m1 = document.getElementById('m1');
    m1.items = [
      { label: 'Edit', value: 'edit', icon: 'edit' },
      { label: 'Duplicate', value: 'duplicate', icon: 'add' },
      { label: 'Archive', value: 'archive', icon: 'file-shield' },
      { label: 'Delete', value: 'delete', icon: 'delete' },
    ];

    const m2 = document.getElementById('m2');
    m2.items = [
      { label: 'Active', value: 'active', selected: true },
      { label: 'Pending', value: 'pending' },
      { label: 'Archived', value: 'archived' },
      { label: 'Deleted', value: 'deleted', disabled: true },
    ];

    const m3 = document.getElementById('m3');
    m3.items = [
      { type: 'heading', label: 'Recent' },
      { label: 'Dashboard',  value: 'dash',  icon: 'add-widget' },
      { label: 'Reports',    value: 'rep',   icon: 'chart-emptystate' },
      { type: 'divider' },
      { type: 'heading', label: 'Account' },
      { label: 'Settings',   value: 'set',   icon: 'config' },
      { label: 'Sign out',   value: 'out',   icon: 'close' },
    ];

    /* Nested cascade — `subItems` on a row. The chevron, the flyout and its
       keyboard wiring all come for free; the leaf select re-fires here with
       `parent` so you can tell which branch. Flyouts carry no title row. */
    const m4 = document.getElementById('m4');
    m4.items = [
      { label: 'Deploy now', value: 'deploy', icon: 'rocket' },
      { label: 'Export', value: 'export', icon: 'download', subItems: [
        { label: 'CSV', value: 'csv' },
        { label: 'PDF', value: 'pdf', subItems: [
          { label: 'Portrait',  value: 'portrait' },
          { label: 'Landscape', value: 'landscape' },
        ] },
      ] },
      { type: 'divider' },
      { label: 'Delete', value: 'delete', icon: 'delete', danger: true },
    ];
    m4.addEventListener('ds-dropdown-select', (e) => {
      const { value, parent } = e.detail;
      console.log(parent ? `selected "${value}" under "${parent.label}"` : `selected "${value}"`);
    });
  </script>
</body>
</html>
