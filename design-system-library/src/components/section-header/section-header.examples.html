<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles/index.css"><script type="module" src="../../index.js"></script><style>body{padding:24px;font-family:var(--font-family-sans);display:flex;flex-direction:column;gap:24px;max-width:640px}</style></head>
<body>
  <!-- Default: title only -->
  <ds-section-header title="Recent Activity"></ds-section-header>

  <!-- With Description: description stacked under the title -->
  <ds-section-header title="Team Members" style-variant="with-description"
    description="People with access to this workspace."></ds-section-header>

  <!-- With Description + action -->
  <ds-section-header title="Devices" style-variant="with-description"
    description="All registered endpoints" action-label="View all"></ds-section-header>

  <!-- With Border: title + rule + action on row 1, description on a full-width 2nd row -->
  <ds-section-header title="Connected Devices" style-variant="with-border"
    description="All registered endpoints across your organisation"
    action-label="View All"></ds-section-header>

  <!-- With Border, large -->
  <ds-section-header title="Overview" size="large" style-variant="with-border"
    description="A summary of everything in this workspace."></ds-section-header>

  <!-- Sizes -->
  <ds-section-header title="Small heading" size="small" action-label="View"></ds-section-header>
  <ds-section-header title="Large heading" size="large" action-label="Manage"></ds-section-header>

  <!-- Full-width dividers -->
  <ds-section-header title="Filters" divider="bottom"></ds-section-header>
  <ds-section-header title="Section" divider="both" action-label="Edit"></ds-section-header>

  <!-- RTL -->
  <ds-section-header title="الأجهزة" style-variant="with-border" rtl
    description="جميع نقاط النهاية المسجلة" action-label="عرض الكل"></ds-section-header>

  <!-- Custom action via slot -->
  <ds-section-header title="Reports">
    <button slot="action">Export</button>
  </ds-section-header>
</body></html>
