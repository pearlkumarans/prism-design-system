<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ds-badge — examples</title>
  <script type="module">import '../../index.js';</script>
  <style>
    body { font-family: var(--font-family-sans); padding: 24px; background: var(--uems-background); color: var(--uems-text-primary); }
    section { margin-bottom: 32px; }
    h2 { font-size: var(--font-size-16); font-weight: 600; margin: 0 0 12px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    table { border-collapse: collapse; }
    th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--uems-border-tertiary); }
    th { font-weight: 600; font-size: 12px; color: var(--uems-text-secondary); }
  </style>
</head>
<body>
  <section>
    <h2>Subtle × all states × pill</h2>
    <div class="row">
      <ds-badge variant="subtle" state="default"     label="Default"></ds-badge>
      <ds-badge variant="subtle" state="active"      label="Active"></ds-badge>
      <ds-badge variant="subtle" state="critical"    label="Critical"></ds-badge>
      <ds-badge variant="subtle" state="moderate"    label="Moderate"></ds-badge>
      <ds-badge variant="subtle" state="important"   label="Important"></ds-badge>
      <ds-badge variant="subtle" state="success"     label="Success"></ds-badge>
      <ds-badge variant="subtle" state="acknowledge" label="Acknowledge"></ds-badge>
    </div>
  </section>

  <section>
    <h2>Intense × all states × pill</h2>
    <div class="row">
      <ds-badge variant="intense" state="default"     label="Default"></ds-badge>
      <ds-badge variant="intense" state="active"      label="Active"></ds-badge>
      <ds-badge variant="intense" state="critical"    label="Critical"></ds-badge>
      <ds-badge variant="intense" state="moderate"    label="Moderate"></ds-badge>
      <ds-badge variant="intense" state="important"   label="Important"></ds-badge>
      <ds-badge variant="intense" state="success"     label="Success"></ds-badge>
      <ds-badge variant="intense" state="acknowledge" label="Acknowledge"></ds-badge>
    </div>
  </section>

  <section>
    <h2>Sizes</h2>
    <div class="row">
      <ds-badge size="small"  variant="subtle" state="success" label="Small"></ds-badge>
      <ds-badge size="medium" variant="subtle" state="success" label="Medium"></ds-badge>
      <ds-badge size="large"  variant="subtle" state="success" label="Large"></ds-badge>
    </div>
  </section>

  <section>
    <h2>Shapes</h2>
    <div class="row">
      <ds-badge shape="pill"    variant="intense" state="active" label="Pill"></ds-badge>
      <ds-badge shape="rounded" variant="intense" state="active" label="Rounded"></ds-badge>
    </div>
  </section>

  <section>
    <h2>With icons</h2>
    <div class="row">
      <ds-badge variant="subtle"  state="success"  icon="circle-tick" label="Done"></ds-badge>
      <ds-badge variant="subtle"  state="critical" icon="exclamation-circle" label="Error"></ds-badge>
      <ds-badge variant="subtle"  state="moderate" icon="info-circle" label="Notice"></ds-badge>
      <ds-badge variant="intense" state="active"   icon="zap" label="Live"></ds-badge>
    </div>
  </section>

  <section>
    <h2>RTL</h2>
    <div class="row">
      <ds-badge rtl variant="subtle" state="success" icon="check" label="مكتمل"></ds-badge>
      <ds-badge rtl variant="intense" state="critical" icon="close" label="فشل"></ds-badge>
    </div>
  </section>
</body>
</html>
