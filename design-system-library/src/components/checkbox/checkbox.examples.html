<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ds-checkbox — examples</title>
  <script type="module">import '../../index.js';</script>
  <style>
    body { font-family: var(--font-family-sans); padding: 24px; background: var(--uems-background); color: var(--uems-text-primary); }
    section { margin-bottom: 24px; }
    h2 { font-size: var(--font-size-14); color: var(--uems-text-tertiary); font-weight: 600; margin: 0 0 8px; }
    .row { display: flex; gap: 24px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <section>
    <h2>Sizes</h2>
    <div class="row">
      <ds-checkbox size="small"  label="Small unchecked"></ds-checkbox>
      <ds-checkbox size="small"  label="Small checked" checked></ds-checkbox>
      <ds-checkbox size="medium" label="Medium unchecked"></ds-checkbox>
      <ds-checkbox size="medium" label="Medium checked" checked></ds-checkbox>
    </div>
  </section>

  <section>
    <h2>States</h2>
    <div class="row">
      <ds-checkbox label="Default"></ds-checkbox>
      <ds-checkbox label="Checked" checked></ds-checkbox>
      <ds-checkbox label="Indeterminate" indeterminate></ds-checkbox>
      <ds-checkbox label="Error" error></ds-checkbox>
      <ds-checkbox label="Error checked" error checked></ds-checkbox>
      <ds-checkbox label="Disabled" disabled></ds-checkbox>
      <ds-checkbox label="Disabled checked" disabled checked></ds-checkbox>
    </div>
  </section>

  <section>
    <h2>RTL</h2>
    <div class="row">
      <ds-checkbox rtl label="مربع الاختيار" checked></ds-checkbox>
      <ds-checkbox rtl label="مربع الاختيار"></ds-checkbox>
    </div>
  </section>
</body>
</html>
