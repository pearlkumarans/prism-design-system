<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Icon Button — examples</title>
  <link rel="stylesheet" href="../../styles/index.css" />
  <script type="module" src="../../index.js"></script>
  <style>
    body { padding: 24px; font-family: var(--font-family-sans); }
    section { margin-bottom: 24px; }
    .row { display: flex; gap: 12px; align-items: center; }
    h3 { margin: 16px 0 8px; }
  </style>
</head>
<body>
  <h1>Icon Button</h1>

  <section>
    <h3>Types — square, large</h3>
    <div class="row">
      <ds-icon-button shape="square" type="primary"        size="large" icon="add"   label="Add"></ds-icon-button>
      <ds-icon-button shape="square" type="secondary"      size="large" icon="edit"  label="Edit"></ds-icon-button>
      <ds-icon-button shape="square" type="tertiary"       size="large" icon="info"  label="Info"></ds-icon-button>
      <ds-icon-button shape="square" type="outline"        size="large" icon="filter" label="Filter"></ds-icon-button>
      <ds-icon-button shape="square" type="danger"         size="large" icon="delete" label="Delete"></ds-icon-button>
      <ds-icon-button shape="square" type="tertiary-grey"  size="large" icon="close" label="Close"></ds-icon-button>
    </div>
  </section>

  <section>
    <h3>Sizes — circle, primary</h3>
    <div class="row">
      <ds-icon-button shape="circle" type="primary" size="xl"     icon="add" label="Add"></ds-icon-button>
      <ds-icon-button shape="circle" type="primary" size="large"  icon="add" label="Add"></ds-icon-button>
      <ds-icon-button shape="circle" type="primary" size="small"  icon="add" label="Add"></ds-icon-button>
      <ds-icon-button shape="circle" type="primary" size="xsmall" icon="add" label="Add"></ds-icon-button>
    </div>
  </section>

  <section>
    <h3>Disabled</h3>
    <div class="row">
      <ds-icon-button type="primary" icon="add"   label="Add"    disabled></ds-icon-button>
      <ds-icon-button type="outline" icon="delete" label="Delete" disabled></ds-icon-button>
      <ds-icon-button type="danger"  icon="close" label="Close"  disabled></ds-icon-button>
    </div>
  </section>
</body>
</html>
