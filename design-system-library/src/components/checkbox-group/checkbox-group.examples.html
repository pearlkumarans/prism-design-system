<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ds-checkbox-group — examples</title>
  <script type="module">import '../../index.js';</script>
  <style>
    body { font-family: var(--font-family-sans); padding: 24px; background: var(--uems-background); color: var(--uems-text-primary); }
    section { margin-bottom: 32px; }
    h2 { font-size: var(--font-size-14); color: var(--uems-text-tertiary); font-weight: 600; margin: 0 0 12px; }
  </style>
</head>
<body>
  <section>
    <h2>Left layout · default (web)</h2>
    <ds-checkbox-group label="Notify me about" help-text="You can change this any time." value="comments">
      <ds-checkbox value="comments"  label="Comments"></ds-checkbox>
      <ds-checkbox value="mentions"  label="Mentions"></ds-checkbox>
      <ds-checkbox value="reminders" label="Reminders"></ds-checkbox>
    </ds-checkbox-group>
  </section>

  <section>
    <h2>Top layout — long labels</h2>
    <ds-checkbox-group label="Compliance frameworks" label-position="top">
      <ds-checkbox value="iso27001" label="ISO 27001 — Information Security Management"></ds-checkbox>
      <ds-checkbox value="soc2"     label="SOC 2 Type II — Security & Availability"></ds-checkbox>
      <ds-checkbox value="gdpr"     label="GDPR — General Data Protection Regulation"></ds-checkbox>
    </ds-checkbox-group>
  </section>

  <section>
    <h2>Error state</h2>
    <ds-checkbox-group label="Required permissions" state="error" help-text="You must grant at least one permission to continue.">
      <ds-checkbox value="read"   label="Read"></ds-checkbox>
      <ds-checkbox value="write"  label="Write"></ds-checkbox>
      <ds-checkbox value="delete" label="Delete"></ds-checkbox>
    </ds-checkbox-group>
  </section>

  <section>
    <h2>With counter</h2>
    <ds-checkbox-group label="Skills" show-counter counter="2/5" help-text="Select up to 5 skills." value="design,frontend">
      <ds-checkbox value="design"   label="Design"></ds-checkbox>
      <ds-checkbox value="frontend" label="Frontend"></ds-checkbox>
      <ds-checkbox value="backend"  label="Backend"></ds-checkbox>
      <ds-checkbox value="data"     label="Data"></ds-checkbox>
      <ds-checkbox value="devops"   label="DevOps"></ds-checkbox>
    </ds-checkbox-group>
  </section>

  <section>
    <h2>Disabled</h2>
    <ds-checkbox-group label="Locked group" state="disabled" help-text="Permissions inherited from parent.">
      <ds-checkbox value="a" label="Option A" checked></ds-checkbox>
      <ds-checkbox value="b" label="Option B"></ds-checkbox>
    </ds-checkbox-group>
  </section>

  <section>
    <h2>Small size</h2>
    <ds-checkbox-group label="Filters" size="small" value="active,pending">
      <ds-checkbox value="active"   label="Active"></ds-checkbox>
      <ds-checkbox value="pending"  label="Pending"></ds-checkbox>
      <ds-checkbox value="archived" label="Archived"></ds-checkbox>
    </ds-checkbox-group>
  </section>

  <section>
    <h2>RTL</h2>
    <ds-checkbox-group rtl label="الإشعارات" value="تعليقات">
      <ds-checkbox value="تعليقات" label="تعليقات"></ds-checkbox>
      <ds-checkbox value="إشارات"   label="إشارات"></ds-checkbox>
      <ds-checkbox value="تذكيرات"  label="تذكيرات"></ds-checkbox>
    </ds-checkbox-group>
  </section>
</body>
</html>
