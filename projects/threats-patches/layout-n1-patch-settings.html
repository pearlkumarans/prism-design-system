<!DOCTYPE html>
<!-- N-1 Patch Settings · DUAL-MODE file (projects/threats-patches/).
     Archetype: list view with OS tab switcher (Windows / Debian / Red Hat) + a
     vertical sub-nav that drives one shared data table. Only the Red Hat flow is
     built out (Schedules → Snapshots → Map snapshot → Mapped systems report,
     entitlement-aware); Windows & Debian are empty-state placeholders.
     Open directly -> standalone harness (bottom) mounts it.
     Fetched by Shell.html -> injectDrawer('../projects/threats-patches/layout-n1-patch-settings','content'). -->
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="../../" />
  <link rel="stylesheet" href="design-system-library/src/styles/index.css" />
  <link rel="stylesheet" href="Layout/layout-base.css" />
  <script type="module">import './design-system-library/src/components/index.js';</script>
  <script>
    window.UEMS_ICON_SPRITE = 'design-system-library/src/icons/icons.svg';
    window.UEMS_ILLUSTRATION_SPRITE = 'design-system-library/src/icons/illustrations.svg';
    window.UEMS_LOGO_BASE = 'design-system-library/src/icons/logos';
    (function () { var t = 'light'; try { t = localStorage.getItem('uems-theme') || 'light'; } catch (_) {} document.documentElement.setAttribute('data-theme', t); })();
  </script>
  <style>
    html, body { height: 100%; margin: 0; font-family: var(--font-family-sans); background: var(--uems-bg-primary); }
    .sa-host { display: flex; flex-direction: column; height: 100vh; }
  </style>
</head>
<body>

<template id="drawer-fragment">
<style>
  /* View-specific styles — every selector scoped to #n1-pop so it can't leak. */
  #n1-pop .lay__scroll { display: flex; flex-direction: column; gap: var(--spacing-16, 16px); }

  /* Only the active OS panel shows. Red Hat fills; placeholders center. */
  #n1-pop .n1-panel { display: none; min-height: 0; }
  #n1-pop .n1-panel.is-active { display: flex; flex-direction: column; gap: var(--spacing-12, 12px); flex: 1 1 auto; }
  #n1-pop .n1-placeholder { align-items: center; justify-content: center; }

  /* Red Hat: vertical section nav (fixed 200px) beside the content column. */
  #n1-pop .n1-rh-grid { display: flex; align-items: stretch; flex: 1 1 auto; min-height: 0; }
  /* Left rail with a trailing divider + fill tabs — matches the L06 tabbed-form
     vertical sub-nav pattern (Layout/views/layout-tabbed-form.html → .lay__nav). */
  #n1-pop .n1-rh-rail {
    flex: none;
    width: 220px;
    padding: var(--spacing-4, 4px) var(--spacing-8, 8px) var(--spacing-12, 12px);
    overflow: auto;
    border-inline-end: 1px solid var(--uems-border-tertiary);
  }
  #n1-pop .n1-rh-content { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: var(--spacing-12, 12px); padding-inline-start: var(--spacing-20, 20px); }
  @media (max-width: 900px) {
    #n1-pop .n1-rh-grid { flex-direction: column; }
    #n1-pop .n1-rh-rail { width: 100%; border-inline-end: none; border-block-end: 1px solid var(--uems-border-tertiary); }
    #n1-pop .n1-rh-content { padding-inline-start: 0; padding-block-start: var(--spacing-12, 12px); }
  }

  /* ---- Create-schedule modal (scoped to the modal id, since ds-modal portals to <body>) ---- */
  #n1-sched-modal .n1-fld { display: grid; grid-template-columns: 160px minmax(0, 1fr); column-gap: var(--spacing-20, 20px); align-items: start; }
  #n1-sched-modal .n1-fld + .n1-fld { margin-top: var(--spacing-16, 16px); }
  #n1-sched-modal .n1-fld[hidden] { display: none; }
  #n1-sched-modal .n1-fld__label { font-size: var(--font-size-13); font-weight: var(--font-weight-semibold, 600); color: var(--uems-text-primary); padding-top: 7px; }
  #n1-sched-modal .n1-fld__label .req { color: var(--uems-text-error); }
  #n1-sched-modal .n1-fld__hint { margin-top: var(--spacing-4, 4px); font-size: var(--font-size-13); color: var(--uems-text-tertiary); }
  #n1-sched-modal .n1-fld__control { min-width: 0; }
  /* Inline radio rows (Frequency, Perform this on). */
  #n1-sched-modal ds-radio-group .ds-radio-group__items { display: flex; flex-direction: row; flex-wrap: wrap; gap: var(--spacing-20, 20px); align-items: center; }
  /* Start-at: time input + trailing format hint. */
  #n1-sched-modal .n1-startat { display: flex; align-items: center; gap: var(--spacing-12, 12px); }
  #n1-sched-modal .n1-startat ds-text-input { width: 200px; }
  #n1-sched-modal .n1-startat__suffix { font-size: var(--font-size-13); color: var(--uems-text-tertiary); white-space: nowrap; }
  /* Monthly week/day selects under the radio. */
  #n1-sched-modal .n1-week-selects { display: flex; gap: var(--spacing-12, 12px); margin-top: var(--spacing-8, 8px); max-width: 460px; }
  #n1-sched-modal .n1-week-selects[hidden] { display: none; }
  #n1-sched-modal .n1-week-selects ds-input-select { flex: 1; }
  #n1-sched-modal .n1-selectall { margin-top: var(--spacing-8, 8px); }

  /* Action bar above the table — carries the contextual note only; the primary
     actions (Create schedule / Map snapshot) live in the page-header split button. */
  #n1-pop .n1-actionbar { display: flex; align-items: center; gap: var(--spacing-12, 12px); flex-shrink: 0; min-height: 32px; }
  #n1-pop .n1-actionbar[hidden] { display: none; }
  #n1-pop .n1-actionbar__note { color: var(--uems-text-tertiary); font-size: var(--font-size-13); }

  /* Inline chips inside cells (version, mapped groups). */
  #n1-pop .n1-chips { display: inline-flex; gap: var(--spacing-4, 4px); align-items: center; flex-wrap: nowrap; overflow: hidden; }
  #n1-pop .n1-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #n1-pop .n1-name__sub { color: var(--uems-text-tertiary); }
  #n1-pop .n1-cell-actions { display: inline-flex; gap: var(--spacing-4, 4px); align-items: center; justify-content: flex-end; }

</style>

<div id="n1-pop" class="lay-root" hidden>
  <div class="lay">
    <ds-page-header id="n1-ph" structure="with-tabs" icon="layers"
      title="N-1 patch settings"
      show-description show-actions
      collapse-on-scroll scroll-target=".lay__scroll">
      <!-- Rich description: sentence + inline "Learn more" link at the end. -->
      <span slot="description"><span id="n1-desc-text">Stage patch deployments on a pinned N-1 repository snapshot instead of always-latest.</span> <ds-text-link id="n1-learn-more" size="medium" label="Learn more"
        href="https://www.manageengine.com/products/desktop-central/how-to/patch-management/n-1-patching-in-redhat-linux.html"
        target="_blank"></ds-text-link></span>
      <!-- Primary actions: main = Create schedule, menu option = Map snapshot. -->
      <ds-split-button slot="actions" id="n1-actions" variant="primary" size="medium" icon="add" label="Create schedule"></ds-split-button>
    </ds-page-header>

    <div class="lay__scroll">
      <!-- Windows placeholder -->
      <section id="n1-panel-windows" class="n1-panel n1-placeholder">
        <ds-empty-state id="n1-empty-windows" type="centered" size="md"
          illustration="add-patch"></ds-empty-state>
      </section>

      <!-- Debian placeholder -->
      <section id="n1-panel-debian" class="n1-panel n1-placeholder">
        <ds-empty-state id="n1-empty-debian" type="centered" size="md"
          illustration="add-patch"></ds-empty-state>
      </section>

      <!-- Red Hat — full N-1 flow -->
      <section id="n1-panel-redhat" class="n1-panel is-active">
        <ds-inline-alert id="n1-entitlement-alert" type="critical" show-icon hidden></ds-inline-alert>

        <div class="n1-rh-grid">
          <nav class="n1-rh-rail">
            <ds-tab-bar-vertical id="n1-rh-nav" type="fill"
              active-id="schedules" aria-label="Red Hat N-1 sections"></ds-tab-bar-vertical>
          </nav>

          <div class="n1-rh-content">
            <div class="n1-actionbar" id="n1-actionbar" hidden>
              <span class="n1-actionbar__note" id="n1-actionbar-note"></span>
            </div>
            <ds-data-table id="n1-rh-table" fit-viewport sticky-header show-toolbar="false"
              selection-mode="none" show-footer rows-per-page="25"></ds-data-table>
          </div>
        </div>
      </section>

      <!-- Create schedule — full scheduler (frequency-driven, progressive disclosure).
           Styles are scoped to #n1-sched-modal (NOT #n1-pop) because ds-modal portals
           its content to <body> on open. -->
      <ds-modal id="n1-sched-modal" size="lg" title="Create snapshot schedule"
        description="Capture a repository snapshot on a schedule so groups can be pinned to a stable N-1 state.">
        <div slot="body">
          <div class="n1-fld">
            <span class="n1-fld__label"><span id="n1-lbl-name"></span> <span class="req">*</span></span>
            <div class="n1-fld__control">
              <ds-text-input id="n1-sched-name" label-position="none" placeholder=""></ds-text-input>
            </div>
          </div>
          <div class="n1-fld">
            <span class="n1-fld__label"><span id="n1-lbl-version"></span> <span class="req">*</span></span>
            <div class="n1-fld__control">
              <ds-input-select id="n1-sched-version" label-position="none" placeholder=""></ds-input-select>
            </div>
          </div>
          <div class="n1-fld">
            <span class="n1-fld__label"><span id="n1-lbl-freq"></span> <span class="req">*</span></span>
            <div class="n1-fld__control">
              <ds-radio-group id="n1-sched-freq" name="n1-freq" label-position="none"></ds-radio-group>
            </div>
          </div>
          <!-- Start date (Once only) -->
          <div class="n1-fld" id="n1-fld-date" hidden>
            <span class="n1-fld__label"><span id="n1-lbl-date"></span> <span class="req">*</span></span>
            <div class="n1-fld__control">
              <ds-text-input id="n1-sched-date" label-position="none" placeholder="YYYY-MM-DD"></ds-text-input>
            </div>
          </div>
          <!-- Start at (time) — all frequencies except Execute Now -->
          <div class="n1-fld" id="n1-fld-startat">
            <span class="n1-fld__label"><span id="n1-lbl-startat"></span> <span class="req">*</span></span>
            <div class="n1-fld__control">
              <div class="n1-startat">
                <ds-text-input id="n1-sched-time" label-position="none" placeholder="HH:mm"></ds-text-input>
                <span class="n1-startat__suffix" id="n1-startat-suffix"></span>
              </div>
              <div class="n1-fld__hint" id="n1-startat-hint"></div>
            </div>
          </div>
          <!-- On these days (Weekly only) -->
          <div class="n1-fld" id="n1-fld-weekdays" hidden>
            <span class="n1-fld__label"><span id="n1-lbl-weekdays"></span> <span class="req">*</span></span>
            <div class="n1-fld__control">
              <ds-button-group id="n1-weekday-grid" selection-mode="multi" variant="attached" layout="grid" columns="7" size="small"></ds-button-group>
            </div>
          </div>
          <!-- Perform this on (Monthly only) -->
          <div class="n1-fld" id="n1-fld-performon" hidden>
            <span class="n1-fld__label"><span id="n1-lbl-performon"></span></span>
            <div class="n1-fld__control">
              <ds-radio-group id="n1-sched-performon" name="n1-performon" label-position="none"></ds-radio-group>
              <div class="n1-week-selects" id="n1-week-selects">
                <ds-input-select id="n1-sched-ordinal" label-position="none"></ds-input-select>
                <ds-input-select id="n1-sched-weekday" label-position="none"></ds-input-select>
              </div>
              <div class="n1-week-selects" id="n1-day-select" hidden>
                <ds-input-select id="n1-sched-dom" label-position="none"></ds-input-select>
              </div>
            </div>
          </div>
          <!-- Repeat (months, Monthly only) -->
          <div class="n1-fld" id="n1-fld-repeat" hidden>
            <span class="n1-fld__label"><span id="n1-lbl-repeat"></span> <span class="req">*</span></span>
            <div class="n1-fld__control">
              <ds-button-group id="n1-month-grid" selection-mode="multi" variant="attached" layout="grid" columns="6" size="small"></ds-button-group>
              <div class="n1-selectall"><ds-text-link id="n1-months-selectall" href="#" size="small"></ds-text-link></div>
            </div>
          </div>
          <ds-inline-alert id="n1-sched-hint" type="info" show-icon style="margin-top:var(--spacing-16,16px)"></ds-inline-alert>
        </div>
        <ds-button slot="footer" variant="outline" data-cancel></ds-button>
        <ds-button slot="footer" variant="primary" data-save></ds-button>
      </ds-modal>

      <!-- Map snapshot -->
      <ds-modal id="n1-map-modal" size="md" title="Map snapshot to group"
        description="Pin a custom group to a snapshot. Each agent validates applicability locally before it applies.">
        <div slot="body">
          <ds-input-select id="n1-map-group" label="Custom group" full-width
            placeholder="Select group"></ds-input-select>
          <ds-input-select id="n1-map-snapshot" label="Snapshot" full-width
            placeholder="Select snapshot" style="margin-top:var(--spacing-14,14px)"></ds-input-select>
          <ds-inline-alert id="n1-map-hint" type="info" show-icon
            style="margin-top:var(--spacing-14,14px)"></ds-inline-alert>
        </div>
        <ds-button slot="footer" variant="outline" data-cancel>Cancel</ds-button>
        <ds-button slot="footer" variant="primary" data-save>Map snapshot</ds-button>
      </ds-modal>
    </div>
  </div>
</div>

  function setupSchedForm(sm) {

    const freq = sm.querySelector('#n1-sched-freq');
    freq && freq.addEventListener('ds-radio-group-change', (e) => { schedState.freq = (e.detail && e.detail.value) || 'monthly'; applyFreqVisibility(sm); });
    const po = sm.querySelector('#n1-sched-performon');

      schedState.months = new Set(e.detail.values); updateSelectAll(sm);

    wg && wg.addEventListener('ds-button-group-change', (e) => { schedState.weekdays = new Set(e.detail.values); });

      const allOn = schedState.months.size === MONTHS.length;

    const fq = sm.querySelector('#n1-sched-freq'); if (fq) fq.options = freqOptions();
    const po = sm.querySelector('#n1-sched-performon'); if (po) po.options = performOnOptions();
    const ord = sm.querySelector('#n1-sched-ordinal'); if (ord) { ord.options = ordinalOptions(); ord.value = ord.value || 'first'; }
    const wsel = sm.querySelector('#n1-sched-weekday'); if (wsel) { wsel.options = weekdaySelOptions(); wsel.value = wsel.value || 'sun'; }
    const dom = sm.querySelector('#n1-sched-dom'); if (dom) { dom.options = domOptions(); dom.value = dom.value || '1'; }
    // Month grid (fixed Jan–Dec) + weekday grid (translatable) via ds-button-group.
    const mg = sm.querySelector('#n1-month-grid');
    if (mg) { mg.items = MONTHS.map((m) => ({ value: m, label: m })); mg.values = [...schedState.months]; }
    const wg = sm.querySelector('#n1-weekday-grid');
    if (wg) { wg.items = WEEKDAYS.map((w) => ({ value: w, label: t('wd.' + w) })); wg.values = [...schedState.weekdays]; }
    updateSelectAll(sm);
    const hn = sm.querySelector('#n1-sched-hint'); if (hn) hn.setAttribute('description', t('m.sched.hint'));
    const bc = sm.querySelector('[data-cancel]'); if (bc) bc.setAttribute('label', t('m.cancel'));
    const bs = sm.querySelector('[data-save]'); if (bs) bs.setAttribute('label', t('m.sched.create'));
    applyFreqVisibility(sm); applyPerformOn(sm);
  }

  /* ---- Strings (re-run on lang change) ------------------------------------- */
  function applyStrings() {
    const ph = $('n1-ph');
    if (ph) {
      ph.setAttribute('title', t('title'));
      // OS switcher lives in the page-header tabs (Windows / Debian / Red Hat).
      // Keep the current selection active across language changes.
      ph.tabs = [
        { id: 'windows', label: t('os.windows'), active: state.os === 'windows' },
        { id: 'debian', label: t('os.debian'), active: state.os === 'debian' },
        { id: 'redhat', label: t('os.redhat'), active: state.os === 'redhat' },
      ];
    }
    // Rich description lives in the header's `description` slot: sentence + inline link.
    const dtxt = $('n1-desc-text'); if (dtxt) dtxt.textContent = t('desc');
    const lm = $('n1-learn-more'); if (lm) lm.setAttribute('label', t('learn'));
    // Header split button: main = Create schedule, menu option = Map snapshot.
    const sb = $('n1-actions');
    if (sb) {
      sb.setAttribute('label', t('act.createSchedule'));
      sb.menuItems = [{ label: t('act.mapSnapshot'), value: 'map', icon: 'link' }];
    }
    const nav = $('n1-rh-nav');
    if (nav) nav.items = [
      { id: 'schedules', label: t('nav.schedules'), icon: 'calendar' },
      { id: 'snapshots', label: t('nav.snapshots'), icon: 'camera' },
      { id: 'map', label: t('nav.map'), icon: 'link' },
      { id: 'report', label: t('nav.report'), icon: 'layers' },
    ];
    // Entitlement alert (ELS expired in this dataset).
    const ent = $('n1-entitlement-alert');
    if (ent) { ent.setAttribute('title', t('ent.title')); ent.setAttribute('description', t('ent.desc')); ent.hidden = false; }
    // Placeholders.
    const ew = $('n1-empty-windows'); if (ew) { ew.setAttribute('title', t('ph.win.title')); ew.setAttribute('description', t('ph.win.desc')); }
    const ed = $('n1-empty-debian'); if (ed) { ed.setAttribute('title', t('ph.deb.title')); ed.setAttribute('description', t('ph.deb.desc')); }
    // Modals (portal to <body> once opened; set titles/labels on the cached hosts).
    const sm = $('n1-sched-modal');
    if (sm) applySchedStrings(sm);
    const mm = $('n1-map-modal');
    if (mm) {
      mm.setAttribute('title', t('m.map.title')); mm.setAttribute('description', t('m.map.desc'));
      const gp = mm.querySelector('#n1-map-group'); if (gp) { gp.setAttribute('label', t('m.map.group')); gp.options = GROUPS.map((g) => ({ label: g, value: g })); }
      const sp = mm.querySelector('#n1-map-snapshot'); if (sp) { sp.setAttribute('label', t('m.map.snapshot')); sp.options = SNAPSHOTS.map((s) => ({ label: s.name, value: s.id })); }
      const hn = mm.querySelector('#n1-map-hint'); if (hn) hn.setAttribute('description', t('m.map.hint'));
      const bc = mm.querySelector('[data-cancel]'); if (bc) bc.setAttribute('label', t('m.cancel'));
      const bs = mm.querySelector('[data-save]'); if (bs) bs.setAttribute('label', t('m.map.map'));
    }
    if (state.os === 'redhat') renderSubTab();
  }

  /* ---- Wiring -------------------------------------------------------------- */
  let _wired = false;
  function wire() {
    if (_wired) return; _wired = true;
    const ph = $('n1-ph'), nav = $('n1-rh-nav'), table = $('n1-rh-table');
    ph && ph.addEventListener('ds-page-header-tab', (e) => showOs(e.detail && e.detail.tab && e.detail.tab.id));
    nav && nav.addEventListener('ds-tab-change', (e) => { state.sub = (e.detail && e.detail.id) || 'schedules'; renderSubTab(); });

    // Header split button → Create schedule (main) / Map snapshot (menu option).
    const sb = $('n1-actions');
    if (sb) {
      sb.addEventListener('ds-split-button-main', () => openSchedModal());
      sb.addEventListener('ds-split-button-menu-select', () => openMapModal());
    }

    // Row actions (delegated).
    table && table.addEventListener('click', (e) => {
      const el = e.target.closest && e.target.closest('[data-act]');
      if (!el) return;
      const act = el.getAttribute('data-act');
      if (act === 'delete') globalThis.dsToast?.error?.({ title: t('t.deleted'), style: 'subtle' });
      else if (act === 'remove') globalThis.dsToast?.error?.({ title: t('t.removed'), style: 'subtle' });
      else if (act === 'edit') { openSchedModal(); }
      else if (act === 'map') { openMapModal(el.getAttribute('data-id')); }
    });

    // Create-schedule modal — build the frequency form + wire the buttons.
    const sm = $('n1-sched-modal');
    if (sm) {
      setupSchedForm(sm);
      sm.querySelector('[data-cancel]').addEventListener('click', () => sm.close());
      sm.querySelector('[data-save]').addEventListener('click', () => { sm.close(); globalThis.dsToast?.success?.({ title: t('t.created'), description: t('t.createdD'), style: 'subtle' }); });
    }
    // Map modal.
    const mm = $('n1-map-modal');
    if (mm) {
      mm.querySelector('[data-cancel]').addEventListener('click', () => mm.close());
      mm.querySelector('[data-save]').addEventListener('click', () => { mm.close(); globalThis.dsToast?.success?.({ title: t('t.mapped'), description: t('t.mappedD'), style: 'subtle' }); });
    }
  }
  function openSchedModal() { const m = $('n1-sched-modal'); if (m) m.open(); }
  function openMapModal(snapId) {
    const m = $('n1-map-modal'); if (!m) return;
    if (snapId) { const sp = m.querySelector('#n1-map-snapshot'); if (sp) sp.value = snapId; }
    m.open();
  }

  function show() { root.hidden = false; applyStrings(); wire(); showOs(state.os); }
  function hide() { root.hidden = true; }
  if (window.ShellCtx && window.ShellCtx.onLangChange) window.ShellCtx.onLangChange(() => { if (!root.hidden) applyStrings(); });
  window.ShellDrawers = window.ShellDrawers || {};
  window.ShellDrawers['threats-patches-n1-patch-settings'] = { show, hide };
})();
</script>
</template>

<script>
/* == STANDALONE HARNESS — runs ONLY when opened directly. == */
(function () {
  const host = document.createElement('div'); host.className = 'sa-host'; document.body.appendChild(host);
  window.ShellDrawers = window.ShellDrawers || {};
  const frag = document.getElementById('drawer-fragment').content.cloneNode(true);
  frag.querySelectorAll('style').forEach((s) => document.head.appendChild(s));
  const scripts = [...frag.querySelectorAll('script')]; scripts.forEach((s) => s.remove());
  host.appendChild(frag);
  scripts.forEach((o) => { const s = document.createElement('script'); if (o.type) s.type = o.type; s.textContent = o.textContent; document.body.appendChild(s); });
  const open = () => window.ShellDrawers['threats-patches-n1-patch-settings'] && window.ShellDrawers['threats-patches-n1-patch-settings'].show();
  requestAnimationFrame(() => requestAnimationFrame(open));
})();
</script>
</body>
</html>
