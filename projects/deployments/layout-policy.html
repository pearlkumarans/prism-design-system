<!DOCTYPE html>
<!--
  Deployments · Policy (L1) — two tabs:
    1) Create policy — OS-scoped tile grid (Windows / Mac / Linux) grouped by
       category (Profiles · User Experience · MDM Profiles · Security ·
       Software · Updates · Patches · Automation).
       Tiles reveal scope icons (user / computer) on hover.
       Click a tile → detail form (only 4 wired for now: Install/Uninstall
       Software, File Folder Operation, Install/Uninstall Patches, Custom Script).
    2) Policies — table of all created policies (empty state until any exist).
-->
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="../../" />
  <title>Deployments · Policy — Prism (standalone)</title>
  <link rel="stylesheet" href="design-system-library/src/styles/index.css" />
  <link rel="stylesheet" href="Layout/layout-base.css" />
  <script type="module">import './design-system-library/src/components/index.js';</script>
  <script>
    window.UEMS_ICON_SPRITE = 'design-system-library/src/icons/icons.svg';
    window.UEMS_ILLUSTRATION_SPRITE = 'design-system-library/src/icons/illustrations.svg';
    window.UEMS_LOGO_BASE = 'design-system-library/src/icons/logos';
    (function () { var t = 'light'; try { t = localStorage.getItem('uems-theme') || 'light'; } catch (_) {} document.documentElement.setAttribute('data-theme', t); })();
  </script>
  <style>html, body { height: 100%; margin: 0; font-family: var(--font-family-sans); background: var(--uems-bg-primary); } .sa-host { display: flex; flex-direction: column; height: 100vh; }</style>
</head>
<body>

<template id="drawer-fragment">
<style>
/* == Deployments · Policy — scoped to #dep-policy-pop ================== */

#dep-policy-pop .pol-toolbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 16px 0 4px;
}
#dep-policy-pop .pol-toolbar ds-search-field { flex: 1 1 320px; max-width: 420px; }
#dep-policy-pop .pol-toolbar .pol-toolbar-spacer { flex: 1; }
/* OS toggle row — pill-style segmented control on the left, module filter
   trailing on the right. */
#dep-policy-pop .pol-os-row {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 0 12px;
}
#dep-policy-pop .pol-os-row ds-tab-bar-horizontal { flex: 0 0 auto; }
#dep-policy-pop .pol-os-row .pol-os-spacer { flex: 1 1 auto; }
#dep-policy-pop .pol-os-row ds-search-field { flex: 0 0 auto; min-width: 260px; max-width: 320px; }
#dep-policy-pop .pol-os-row ds-input-select { min-width: 220px; flex: 0 0 auto; }
/* ds-input-select renders an empty helper row that adds ~20px height —
   hide it so the module filter's height matches the search field + tabs. */
#dep-policy-pop .pol-os-row ds-input-select .ds-input-select__helper { display: none; }

#dep-policy-pop .pol-group { padding: 4px 0 20px; }
#dep-policy-pop .pol-group-head {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 0 12px;
}
#dep-policy-pop .pol-group-head h3 {
  margin: 0;
  font-size: var(--font-size-14);
  font-weight: var(--font-weight-semibold);
  color: var(--uems-text-primary);
}
#dep-policy-pop .pol-group-head .pol-group-count {
  font-size: var(--font-size-12); color: var(--uems-text-secondary);
}
#dep-policy-pop .pol-group-head ds-badge { margin-inline-start: 4px; }

/* Tile grid — 4 per row, reflows narrower to 3 / 2 / 1. */
#dep-policy-pop .pol-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}
@media (max-width: 1180px) { #dep-policy-pop .pol-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 820px)  { #dep-policy-pop .pol-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px)  { #dep-policy-pop .pol-grid { grid-template-columns: 1fr; } }

/* Individual policy tile — icon + label; scope glyphs revealed on hover. */
/* Tile — matches Figma spec (node 1198:16284, Component 267):
     · Default: white bg, transparent border, chips hidden.
     · Hover:   grey bg + border-tertiary outline, chips revealed. */
#dep-policy-pop .pol-tile {
  position: relative;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: var(--uems-bg-primary);
  cursor: pointer;
  text-align: start;
  transition:
    border-color 140ms var(--ease-standard, ease),
    background-color 140ms var(--ease-standard, ease);
  min-width: 0;
}
#dep-policy-pop .pol-tile:hover {
  border-color: var(--uems-border-tertiary);
  background: var(--uems-bg-primary-hover);
}
#dep-policy-pop .pol-tile:focus-visible {
  outline: 2px solid var(--uems-border-accent);
  outline-offset: 2px;
}
/* Icon + label group: 8px gap, 20px printer-style icon, 14px medium label. */
#dep-policy-pop .pol-tile-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; flex: none;
  color: var(--uems-icon-secondary);
}
#dep-policy-pop .pol-tile-icon > ds-icon { display: inline-flex; }
#dep-policy-pop .pol-tile-label {
  min-width: 0;
  color: var(--uems-text-primary);
  font-size: 14px;
  font-weight: var(--font-weight-medium, 500);
  line-height: 20px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  flex: 1 1 auto;
  text-align: start;
}
/* Scope chips — Figma Component 266 spec:
     · default = 24×24 outer with a 16-px icon inset by 4px padding, radius 4,
       background = --uems-bg-primary-hover (matches tile hover bg).
     · Hidden by default; revealed when the parent tile is hovered/focused.
     · Per-chip hover fills with --uems-bg-info-solid (#2C66DD) + white icon
       and shows the "User Configurations" / "Device Configurations" tooltip. */
#dep-policy-pop .pol-tile-scope {
  display: inline-flex; align-items: center; gap: 4px;
  flex: none;
  margin-inline-start: 12px;    /* Figma: 20px gap between label group and chips (8 gap + 12 margin) */
  opacity: 0;
  visibility: hidden;
  transition:
    opacity 140ms var(--ease-standard, ease),
    visibility 0s linear 140ms;
}
#dep-policy-pop .pol-tile:hover .pol-tile-scope,
#dep-policy-pop .pol-tile:focus-visible .pol-tile-scope,
#dep-policy-pop .pol-tile-scope:focus-within {
  opacity: 1;
  visibility: visible;
  transition:
    opacity 140ms var(--ease-standard, ease),
    visibility 0s linear 0s;
}
#dep-policy-pop .pol-tile-scope .pol-scope-chip {
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px;
  padding: 4px;
  border: 0;
  border-radius: 4px;
  background: var(--uems-bg-primary-hover);
  color: var(--uems-icon-secondary);
  flex: none;
  box-sizing: border-box;
  cursor: pointer;
  transition:
    background-color 140ms var(--ease-standard, ease),
    color 140ms var(--ease-standard, ease);
}
/* Per-chip hover — matches the theme's primary button color (green in EC's
   fern theme, blue in cobalt-branded products), with a white icon. */
#dep-policy-pop .pol-tile-scope ds-tooltip:hover .pol-scope-chip,
#dep-policy-pop .pol-tile-scope .pol-scope-chip:hover,
#dep-policy-pop .pol-tile-scope .pol-scope-chip:focus-visible {
  background: var(--uems-bg-button-primary);
  color: var(--uems-icon-white);
}

@media (prefers-reduced-motion: reduce) {
  #dep-policy-pop .pol-tile-scope,
  #dep-policy-pop .pol-scope-chip { transition: none; }
}

/* MDM group heading tags the group so it reads as MDM-only. */
#dep-policy-pop .pol-mdm h3 { color: var(--uems-text-accent-primary); }

/* Policies-tab table content. */
#dep-policy-pop .pol-empty { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
#dep-policy-pop .pol-table-wrap { padding-top: 12px; }
</style>

<div id="dep-policy-pop" class="lay-root" hidden>
  <div class="lay">

    <ds-page-header id="pol-ph" icon="shield" structure="default"
      title="Add Policy"
      description="Pick a policy type to create. Bundle many into a workflow for advanced rollouts.">
    </ds-page-header>

    <div class="lay__scroll">

      <div id="pol-create">
        <div class="pol-os-row">
          <ds-tab-bar-horizontal id="pol-os" type="fill" active-id="windows"></ds-tab-bar-horizontal>
          <span class="pol-os-spacer"></span>
          <ds-search-field id="pol-search" placeholder="Search policy types" size="medium"></ds-search-field>
          <ds-input-select id="pol-module" size="medium"
            placeholder="Filter by module"
            value="all"></ds-input-select>
        </div>

        <div id="pol-groups"></div>
      </div>

    </div>
  </div>
</div>

<script>
/* == Deployments · Policy view logic =================================== */
(function () {
  const root = document.getElementById('dep-policy-pop');
  if (!root || root.__polInit) return; root.__polInit = true;
  const $ = (id) => root.querySelector('#' + id);
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  /* ---- OS scope tabs --------------------------------------------------- */
  const osTabs = $('pol-os');
  osTabs.items = [
    { id: 'windows', label: 'Windows' },
    { id: 'mac',     label: 'Mac' },
    { id: 'linux',   label: 'Linux' },
  ];
  osTabs.addEventListener('ds-tab-change', (e) => {
    const os = (e.detail && e.detail.id) || 'windows';
    renderGroups(os);
  });

  /* ---- Policy catalogue by platform + group ----------------------------
     Every tile carries a `module` field so the module filter can slice the
     catalogue across every group in one pass:
       general · software · osd · patches · browsers · device-control ·
       application-control · dex · mdm · malware · endpoint-dlp · tools ·
       bitlocker · admin-settings · user-related. */
  const t = (id, label, icon, scope, module, route) => ({ id, label, icon, scope, module, route });
  const CATALOGUE = {
    windows: [
      { key: 'profiles', label: 'Profiles', tiles: [
        t('alerts',                  'Alerts',                    'notification',      'user',    'general'),
        t('certificate-distribution','Certificate Distribution',  'certificate',       'both',    'admin-settings'),
        t('common-folder-redirection','Common Folder Redirection','folder-backup',     'computer','user-related'),
        t('custom-script',           'Custom Script',             'code',              'both',    'tools',            'deployments-policy-custom-script'),
        t('display',                 'Display',                   'computer',          'both',    'general'),
        t('drive-mapping',           'Drive Mapping',             'hard-disk',         'user',    'user-related'),
        t('environment-variable',    'Environment Variable',      'code',              'both',    'admin-settings'),
        t('file-folder-operation',   'File Folder Operation',     'file-folder',       'both',    'admin-settings',   'deployments-policy-file-folder-operation'),
        t('firewall',                'Firewall',                  'firewall',          'computer','admin-settings'),
        t('folder-backup',           'Folder Backup',             'folder-backup',     'computer','user-related'),
        t('folder-redirection',      'Folder Redirection',        'folder-backup',     'user',    'user-related'),
        t('fonts',                   'Fonts',                     'edit',              'computer','general'),
        t('general',                 'General',                   'settings',          'computer','general'),
        t('group-management',        'Group Management',          'users',             'computer','user-related'),
        t('ip-printer',              'IP Printer',                'printer',           'both',    'admin-settings'),
        t('launch-application',      'Launch Application',        'play',              'both',    'software'),
        t('legal-notice',            'Legal Notice',              'file-report',       'computer','admin-settings'),
        t('ms-office',               'MS Office',                 'file-report',       'user',    'software'),
        t('ms-outlook',              'MS Outlook',                'mail',              'user',    'software'),
        t('message-box',             'Message Box',               'message-chat-square','both',   'general'),
        t('outlook-exchange-profile','Outlook Exchange Profile',  'mail',              'user',    'software'),
        t('path',                    'Path',                      'code',              'both',    'admin-settings'),
        t('permission-management',   'Permission Management',     'lock',              'both',    'admin-settings'),
        t('power-management',        'Power Management',          'zap',               'both',    'admin-settings'),
        t('registry',                'Registry',                  'code',              'both',    'admin-settings'),
        t('scheduler',               'Scheduler',                 'calendar',          'computer','tools'),
        t('secure-usb',              'Secure USB',                'lock',              'both',    'device-control'),
        t('security-policies',       'Security Policies',         'shield',            'both',    'admin-settings'),
        t('services',                'Services',                  'settings',          'computer','tools'),
        t('shared-network-printer',  'Shared Network Printer',    'printer',           'user',    'admin-settings'),
        t('shortcut',                'Shortcut',                  'upload',            'both',    'user-related'),
        t('user-management',         'User Management',           'user',              'computer','user-related'),
        t('wifi',                    'WiFi',                      'globe',             'both',    'general'),
      ] },
      { key: 'user-experience', label: 'User Experience', tiles: [
        t('announcement',            'Announcement',              'announcement',      'both',    'general'),
        t('restart',                 'Restart',                   'refresh-time',      'computer','general'),
      ] },
      { key: 'mdm-profiles', label: 'MDM Profiles', mdm: true, tiles: [
        t('passcode',                'Passcode',                  'lock',              'computer','mdm'),
        t('hello-for-business',      'Hello for Business',        'user',              'computer','mdm'),
        t('restrictions',            'Restrictions',              'shield',            'computer','mdm'),
        t('wifi',                    'Wi-Fi',                     'globe',             'computer','mdm'),
        t('vpn',                     'VPN',                       'globe',             'computer','mdm'),
        t('kiosk',                   'Kiosk',                     'home',              'computer','mdm'),
        t('email',                   'Email',                     'mail',              'computer','mdm'),
        t('exchange-activesync',     'Exchange ActiveSync',       'mail',              'computer','mdm'),
        t('scep',                    'SCEP',                      'certificate',       'computer','mdm'),
        t('certificate',             'Certificate',               'certificate',       'computer','mdm'),
        t('defender',                'Defender',                  'shield',            'computer','malware'),
        t('exploit-guard',           'Exploit Guard',             'shield',            'computer','malware'),
        t('application-guard',       'Application Guard',         'shield',            'computer','application-control'),
        t('device-guard',            'Device Guard',              'shield',            'computer','device-control'),
        t('shared-pc',               'Shared PC',                 'users',             'computer','mdm'),
        t('custom-configuration',    'Custom Configuration',      'code',              'computer','mdm'),
      ] },
      { key: 'security', label: 'Security', tiles: [
        t('bitlocker',               'BitLocker',                 'encryption-lock',   'computer','bitlocker'),
        t('app-control',             'App Control',               'shield',            'computer','application-control'),
        t('device-control',          'Device Control',            'shield',            'computer','device-control'),
        t('endpoint-dlp',            'Endpoint DLP',              'file-shield',       'computer','endpoint-dlp'),
        t('browser',                 'Browser',                   'globe',             'user',    'browsers'),
      ] },
      { key: 'software', label: 'Software', tiles: [
        t('install-uninstall-windows-software', 'Install/Uninstall Windows Software', 'download', 'both', 'software', 'deployments-policy-install-uninstall-software'),
      ] },
      { key: 'updates', label: 'Updates', tiles: [
        t('os-updates',              'OS Updates',                'refresh',           'computer','patches'),
        t('third-party-apps-update', 'Third Party Apps Update',   'refresh',           'computer','patches'),
      ] },
      { key: 'patches', label: 'Patches', tiles: [
        t('install-uninstall-windows-patch', 'Install/Uninstall Windows Patch', 'patch', 'computer', 'patches', 'deployments-policy-install-uninstall-patches'),
      ] },
      { key: 'automation', label: 'Automation', tiles: [
        t('scripts',                 'Scripts',                   'code',              'both',    'tools',            'deployments-policy-custom-script'),
      ] },
      { key: 'baseline', label: 'Baseline', tiles: [
        t('cis',                     'CIS',                       'shield',            'computer','admin-settings'),
      ] },
    ],
    mac: [
      /* Mac profiles — expanded catalogue per new spec.
         Everything is computer-only unless noted otherwise. */
      { key: 'profiles', label: 'Profiles', tiles: [
        t('activation-lock',         'Activation Lock',           'lock',              'computer','admin-settings'),
        t('ad-asset-binding',        'AD Asset Binding',          'globe',             'computer','admin-settings'),
        t('airprint',                'AirPrint',                  'printer',           'computer','admin-settings'),
        t('app-notifications',       'App Notifications',         'notification',      'computer','general'),
        t('background-service-mgmt', 'Background Service Mgmt',   'settings',          'computer','tools'),
        t('custom-configuration',    'Custom Configuration',      'code',              'computer','admin-settings'),
        t('custom-script',           'Custom Script',             'code',              'both',    'tools',            'deployments-policy-custom-script'),
        t('dock-settings',           'Dock Settings',             'settings',          'computer','general'),
        t('energy-saver',            'Energy Saver',              'zap',               'computer','admin-settings'),
        t('extensible-sso',          'Extensible SSO',            'lock',              'computer','admin-settings'),
        t('file-folder-operation',   'File Folder Operation',     'file-folder',       'computer','admin-settings',   'deployments-policy-file-folder-operation'),
        t('firewall',                'Firewall',                  'firewall',          'computer','admin-settings'),
        t('fonts',                   'Fonts',                     'edit',              'computer','general'),
        t('gatekeeper',              'Gatekeeper',                'shield',            'computer','malware'),
        t('global-http-proxy',       'Global HTTP Proxy',         'globe',             'computer','admin-settings'),
        t('install-patch',           'Install Patch',             'patch',             'computer','patches',          'deployments-policy-install-uninstall-patches'),
        t('install-uninstall-software','Install/Uninstall Software','download',        'computer','software',         'deployments-policy-install-uninstall-software'),
        t('login-items',             'Login Items',               'play',              'computer','user-related'),
        t('login-window',            'Login Window',              'user',              'computer','user-related'),
        t('message-box',             'Message Box',               'message-chat-square','both',   'general'),
        t('network-shares',          'Network Shares',            'folder-backup',     'user',    'user-related'),
        t('passcode',                'Passcode',                  'lock',              'computer','admin-settings'),
        t('per-app-vpn',             'Per-App VPN',               'globe',             'computer','admin-settings'),
        t('pppc',                    'PPPC',                      'lock',              'computer','admin-settings'),
        t('restrictions',            'Restrictions',              'shield',            'computer','admin-settings'),
        t('system-extensions',       'System Extensions',         'code',              'computer','tools'),
        t('system-preferences',      'System Preferences',        'settings',          'computer','admin-settings'),
        t('user-management',         'User Management',           'user',              'computer','user-related'),
        t('vpn',                     'VPN',                       'globe',             'computer','admin-settings'),
        t('web-content-filter',      'Web Content Filter',        'globe',             'computer','browsers'),
        t('web-shortcuts',           'Web Shortcuts',             'globe',             'user',    'browsers'),
        t('wallpaper',               'Wallpaper',                 'edit',              'user',    'general'),
        t('wifi',                    'WiFi',                      'globe',             'computer','admin-settings'),
      ] },
      { key: 'mdm-profiles', label: 'MDM Profiles', mdm: true, tiles: [
        t('passcode',                'Passcode',                  'lock',              'computer','mdm'),
        t('restrictions',            'Restrictions',              'shield',            'computer','mdm'),
        t('wifi',                    'Wi-Fi',                     'globe',             'computer','mdm'),
        t('vpn',                     'VPN',                       'globe',             'computer','mdm'),
        t('certificate',             'Certificate',               'certificate',       'computer','mdm'),
        t('exchange-activesync',     'Exchange ActiveSync',       'mail',              'computer','mdm'),
      ] },
      { key: 'security', label: 'Security', tiles: [
        t('filevault',               'FileVault',                 'encryption-lock',   'computer','bitlocker'),
        t('app-control',             'App Control',               'shield',            'computer','application-control'),
        t('device-control',          'Device Control',            'shield',            'computer','device-control'),
        t('endpoint-dlp',            'Endpoint DLP',              'file-shield',       'computer','endpoint-dlp'),
        t('browser',                 'Browser',                   'globe',             'computer','browsers'),
      ] },
      { key: 'updates', label: 'Updates', tiles: [
        t('os-updates',              'OS Updates',                'refresh',           'computer','patches'),
      ] },
    ],
    linux: [
      /* Linux profiles — minimal set per new spec (all computer-only). */
      { key: 'profiles', label: 'Profiles', tiles: [
        t('custom-script',           'Custom Script',             'code',              'computer','tools',            'deployments-policy-custom-script'),
        t('install-patch',           'Install Patch',             'patch',             'computer','patches',          'deployments-policy-install-uninstall-patches'),
        t('install-uninstall-software','Install/Uninstall Software','download',        'computer','software',         'deployments-policy-install-uninstall-software'),
        t('message-box',             'Message Box',               'message-chat-square','computer','general'),
      ] },
    ],
  };

  /* ---- Module filter — canonical values + display labels --------------- */
  const MODULES = [
    { value: 'all',                 label: 'All modules' },
    { value: 'general',             label: 'General' },
    { value: 'software',            label: 'Software' },
    { value: 'osd',                 label: 'OSD' },
    { value: 'patches',             label: 'Patches' },
    { value: 'browsers',            label: 'Browsers' },
    { value: 'device-control',      label: 'Device Control' },
    { value: 'application-control', label: 'Application Control' },
    { value: 'dex',                 label: 'DEX' },
    { value: 'mdm',                 label: 'MDM' },
    { value: 'malware',             label: 'Malware' },
    { value: 'endpoint-dlp',        label: 'Endpoint DLP' },
    { value: 'tools',               label: 'Tools' },
    { value: 'bitlocker',           label: 'BitLocker' },
    { value: 'admin-settings',      label: 'Admin settings' },
    { value: 'user-related',        label: 'User related' },
  ];
  $('pol-module').options = MODULES;

  /* ---- Render helpers --------------------------------------------------
     Scope glyphs are ALWAYS visible on the tile (not hover-only) so admins
     read the applicable scope — user / computer / both — at a glance. */
  const scopeGlyphs = (scope) => {
    const parts = [];
    if (scope === 'user' || scope === 'both')
      parts.push('<ds-tooltip text="User Configurations" show-icon="false" position="up-center"><button type="button" class="pol-scope-chip pol-scope-chip--user" data-scope="user" aria-label="Open user configuration"><ds-icon name="user" size="16"></ds-icon></button></ds-tooltip>');
    if (scope === 'computer' || scope === 'both')
      parts.push('<ds-tooltip text="Device Configurations" show-icon="false" position="up-center"><button type="button" class="pol-scope-chip pol-scope-chip--computer" data-scope="computer" aria-label="Open device configuration"><ds-icon name="computer" size="16"></ds-icon></button></ds-tooltip>');
    return parts.join('');
  };

  /* Policy card — the card itself is NOT interactive. Only the scope chips
     (user / computer) are focusable + clickable. Hover on the card reveals
     the applicable chips; clicking a chip opens the matching variant of the
     detail form (User or Computer). */
  const tileHTML = (tile) =>
    `<div class="pol-tile" data-tile-id="${esc(tile.id)}" data-tile-route="${esc(tile.route || '')}" aria-label="${esc(tile.label)}">
       <span class="pol-tile-icon"><ds-icon name="${esc(tile.icon)}" size="18"></ds-icon></span>
       <span class="pol-tile-label">${esc(tile.label)}</span>
       <span class="pol-tile-scope">${scopeGlyphs(tile.scope)}</span>
     </div>`;

  const filterTiles = (tiles) => {
    const q = currentQuery && currentQuery.toLowerCase();
    return tiles.filter((tile) => {
      if (q && !tile.label.toLowerCase().includes(q)) return false;
      if (currentModule !== 'all' && tile.module !== currentModule) return false;
      return true;
    });
  };

  let currentOS = 'windows';
  let currentQuery = '';
  let currentModule = 'all';
  function renderGroups(os) {
    if (os) currentOS = os;
    const groups = CATALOGUE[currentOS] || [];
    const host = $('pol-groups');
    const html = groups.map((g) => {
      const tiles = filterTiles(g.tiles);
      if (!tiles.length) return '';
      return (
        `<section class="pol-group ${g.mdm ? 'pol-mdm' : ''}">
           <div class="pol-group-head">
             <h3>${esc(g.label)}</h3>
             ${g.mdm ? '<ds-badge variant="subtle" state="accent" shape="rounded" size="small">MDM</ds-badge>' : ''}
             <span class="pol-group-count">· ${tiles.length}</span>
           </div>
           <div class="pol-grid">${tiles.map(tileHTML).join('')}</div>
         </section>`
      );
    }).join('');
    host.innerHTML = html || '<div class="pol-empty"><ds-empty-state show-illustration="false" title="No policy types match" description="Clear the search or pick a different module to see more results." show-primary="false" show-secondary="false"></ds-empty-state></div>';
  }

  /* ---- Chip click → route to the scope-matching detail form ------------
     The Policy card itself is NOT clickable (per PM). Only the user /
     device scope chips fire an action. The chosen scope is handed to the
     detail form via `window.__policyPendingScope` so the form can render
     its user variant (Frequency: Logon, Run As accordion) or its computer
     variant (Frequency: Startup, no Run As). */
  $('pol-groups').addEventListener('click', (e) => {
    const chip = e.target.closest && e.target.closest('.pol-scope-chip');
    if (!chip) return;                                    /* clicks elsewhere on the card = no-op */
    const tile = chip.closest('.pol-tile');
    const scope = chip.dataset.scope;
    const route = tile && tile.dataset.tileRoute;
    if (!route) {
      const label = tile && tile.querySelector('.pol-tile-label').textContent.trim();
      if (globalThis.dsToast) {
        globalThis.dsToast.info({
          title: (label || 'Policy') + ' — ' + (scope === 'user' ? 'user' : 'device') + ' variant',
          description: 'Detail form for this policy type is coming next.',
          style: 'subtle',
        });
      }
      return;
    }
    window.__policyPendingScope = scope;
    if (window.openContentView) window.openContentView(route);
  });

  /* ---- Search ---------------------------------------------------------- */
  $('pol-search').addEventListener('ds-search-field-input', (e) => {
    currentQuery = (e.detail && e.detail.value) || '';
    renderGroups();
  });

  /* ---- Module filter --------------------------------------------------- */
  $('pol-module').addEventListener('ds-input-select-change', (e) => {
    currentModule = (e.detail && e.detail.value) || 'all';
    renderGroups();
  });

  /* Initial paint. */
  renderGroups('windows');

  /* Pending-OS handoff — the All Policies split-button sets
     `window.__addPolicyPendingOS` to windows / mac / linux before it opens
     this view. Consume the flag on show() so the OS toggle jumps straight
     to the caller's pick. */
  function applyPendingOS() {
    const pending = window.__addPolicyPendingOS;
    if (!pending) return;
    delete window.__addPolicyPendingOS;
    if (!CATALOGUE[pending]) return;
    $('pol-os').setAttribute('active-id', pending);
    renderGroups(pending);
  }

  function show() { root.hidden = false; applyPendingOS(); }
  function hide() { root.hidden = true; }
  window.ShellDrawers = window.ShellDrawers || {};
  window.ShellDrawers['deployments-policy'] = { show, hide };
})();
</script>
</template>

<script>
(function () {
  const host = document.createElement('div'); host.className = 'sa-host'; document.body.appendChild(host);
  window.ShellDrawers = window.ShellDrawers || {};
  const frag = document.getElementById('drawer-fragment').content.cloneNode(true);
  frag.querySelectorAll('style').forEach((s) => document.head.appendChild(s));
  const scripts = [...frag.querySelectorAll('script')]; scripts.forEach((s) => s.remove());
  host.appendChild(frag);
  scripts.forEach((o) => { const s = document.createElement('script'); if (o.type) s.type = o.type; s.textContent = o.textContent; document.body.appendChild(s); });
  requestAnimationFrame(() => requestAnimationFrame(() => window.ShellDrawers['deployments-policy'].show()));
})();
</script>
</body>
</html>
