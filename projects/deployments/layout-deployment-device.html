<!DOCTYPE html>
<!--
  Deployments · Deployment Detail · Device Drill-Down — per-device
  execution summary + per-stage table + slide-in Execution Timeline
  panel (opens from header CTA and any row click).
-->
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="../../" />
  <title>Device execution — Prism (standalone)</title>
  <link rel="stylesheet" href="design-system-library/src/styles/index.css" />
  <link rel="stylesheet" href="Layout/layout-base.css" />
  <script type="module">import './design-system-library/src/components/index.js';</script>
  <script>
    window.UEMS_ICON_SPRITE = 'design-system-library/src/icons/icons.svg';
    window.UEMS_ILLUSTRATION_SPRITE = 'design-system-library/src/icons/illustrations.svg';
    window.UEMS_LOGO_BASE = 'design-system-library/src/icons/logos';
    (function () { var t = 'light'; try { t = localStorage.getItem('uems-theme') || 'light'; } catch (_) {} document.documentElement.setAttribute('data-theme', t); })();
  </script>
  <style>html, body { height: 100%; margin: 0; font-family: var(--font-family-sans); background: var(--uems-bg-primary); } .sa-host { display: flex; flex-direction: column; height: 100vh; }</style>
</head>
<body>
<template id="drawer-fragment">
<style>
#dep-device-pop .dev-cards { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; padding: 20px 0; }
@media (max-width: 900px) { #dep-device-pop .dev-cards { grid-template-columns: 1fr; } }
#dep-device-pop .dev-donut-card,
#dep-device-pop .dev-table-card {
  padding: 20px; border: 1px solid var(--uems-border-tertiary);
  border-radius: 12px; background: var(--uems-bg-primary);
}
#dep-device-pop .dev-donut-card h4,
#dep-device-pop .dev-table-card h4 { margin: 0 0 12px; font-size: 14px; font-weight: 600; color: var(--uems-text-primary); }
#dep-device-pop .dev-donut { position: relative; width: 140px; height: 140px; margin: 0 auto; }
#dep-device-pop .dev-donut .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#dep-device-pop .dev-donut .total { font-size: 22px; font-weight: 700; color: var(--uems-text-primary); }
#dep-device-pop .dev-donut .label { font-size: 11px; color: var(--uems-text-secondary); }
#dep-device-pop .dev-legend { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--uems-text-secondary); }
#dep-device-pop .dev-legend .lg { display: inline-flex; align-items: center; gap: 6px; }
#dep-device-pop .dev-legend .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
#dep-device-pop .dev-legend .v { color: var(--uems-text-primary); font-weight: 500; margin-inline-start: auto; }

/* Timeline slide-in panel. */
#dep-device-pop .tl-scrim {
  position: absolute; inset: 0;
  background: rgba(15, 23, 42, 0.32);
  opacity: 0; visibility: hidden;
  transition: opacity 220ms var(--ease-standard, ease), visibility 0s linear 220ms;
  z-index: 90;
}
#dep-device-pop .tl-scrim[data-open="true"] { opacity: 1; visibility: visible; transition: opacity 220ms var(--ease-standard, ease), visibility 0s linear 0s; }
#dep-device-pop .tl-panel {
  position: absolute; top: 0; right: 0; bottom: 0;
  width: 460px; max-width: 92vw;
  background: var(--uems-bg-primary);
  border-inline-start: 1px solid var(--uems-border-tertiary);
  box-shadow: -8px 0 24px rgba(15, 23, 42, 0.12);
  transform: translateX(100%);
  transition: transform 260ms var(--ease-standard, ease);
  display: flex; flex-direction: column;
  z-index: 100;
}
#dep-device-pop .tl-panel[data-open="true"] { transform: translateX(0); }
#dep-device-pop .tl-head { padding: 16px 20px; border-bottom: 1px solid var(--uems-border-tertiary); display: flex; align-items: flex-start; gap: 12px; }
#dep-device-pop .tl-head-title { font-size: 15px; font-weight: 700; color: var(--uems-text-primary); display: inline-flex; align-items: center; gap: 8px; }
#dep-device-pop .tl-head-meta  { margin-top: 4px; font-size: 12px; color: var(--uems-text-secondary); }
#dep-device-pop .tl-close {
  border: 0; background: transparent; padding: 0; width: 32px; height: 32px; border-radius: 6px;
  cursor: pointer; color: var(--uems-icon-error); flex: none;
  display: inline-flex; align-items: center; justify-content: center;
}
#dep-device-pop .tl-close:hover { background: var(--uems-bg-secondary-hover); }
#dep-device-pop .tl-body { flex: 1 1 auto; overflow: auto; padding: 20px; }
#dep-device-pop .tl-node { position: relative; padding-inline-start: 32px; padding-bottom: 20px; }
#dep-device-pop .tl-node:not(:last-child)::before {
  content: ''; position: absolute; left: 9px; top: 20px; bottom: 0; width: 2px; background: var(--uems-border-tertiary);
}
#dep-device-pop .tl-dot { position: absolute; left: 3px; top: 4px; width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 0 3px var(--uems-bg-primary); }
#dep-device-pop .tl-dot.g { background: var(--uems-bg-success-solid, #16a34a); }
#dep-device-pop .tl-dot.r { background: var(--uems-bg-error-solid, #dc2626); }
#dep-device-pop .tl-dot.o { background: var(--uems-bg-info-solid, #2563eb); animation: dp-pulse 1.4s ease-in-out infinite; }
#dep-device-pop .tl-dot.n { background: var(--uems-bg-secondary-solid, #94a3b8); }
@keyframes dp-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }
#dep-device-pop .tl-title { font-size: 13px; font-weight: 600; color: var(--uems-text-primary); }
#dep-device-pop .tl-out {
  margin-top: 8px; padding: 10px 12px; border-radius: 6px;
  background: var(--uems-bg-secondary-subtle);
  font-size: 12px; color: var(--uems-text-secondary);
  white-space: pre-wrap;
}
#dep-device-pop .tl-out.mono { font-family: ui-monospace, 'SF Mono', Consolas, monospace; color: var(--uems-text-primary); }
</style>

<div id="dep-device-pop" class="lay-root" hidden>
  <div class="lay">

    <ds-page-header id="dv-ph" icon="computer" structure="full"
      show-description show-breadcrumbs show-summary
      collapse-on-scroll scroll-target=".lay__scroll">
      <ds-button slot="actions" id="dv-open-timeline" variant="primary" size="small" prefix-icon="clock">View execution timeline</ds-button>
    </ds-page-header>

    <div class="lay__scroll">
      <div class="dev-cards">
        <!-- Donut -->
        <div class="dev-donut-card">
          <h4>Execution status</h4>
          <div class="dev-donut">
            <svg viewBox="0 0 42 42" width="100%" height="100%" style="transform: rotate(-90deg);"><g id="dv-donut-svg"></g></svg>
            <div class="center"><div class="total" id="dv-total">5</div><div class="label">stages</div></div>
          </div>
          <div class="dev-legend" id="dv-legend"></div>
        </div>

        <!-- Per-stage table -->
        <div class="dev-table-card">
          <h4>Per-stage status</h4>
          <ds-data-table id="dv-table" selection-mode="none" row-height="comfortable" show-footer="false" sticky-header></ds-data-table>
        </div>
      </div>
    </div>

    <!-- Slide-in timeline -->
    <div class="tl-scrim" id="dv-scrim"></div>
    <aside class="tl-panel" id="dv-panel" aria-hidden="true" aria-label="Execution timeline">
      <div class="tl-head">
        <div style="flex: 1 1 auto; min-width: 0;">
          <div class="tl-head-title"><span id="dv-panel-name">VIR-LT-0245</span>
            <span id="dv-panel-badge"></span>
          </div>
          <div class="tl-head-meta" id="dv-panel-meta">Started Jul 21, 8:02 AM · Duration 13 min 41 s</div>
        </div>
        <button type="button" class="tl-close" id="dv-panel-close" aria-label="Close timeline"><ds-icon name="cancel" size="18"></ds-icon></button>
      </div>
      <div class="tl-body" id="dv-panel-body"></div>
    </aside>

  </div>
</div>

<script>
(function () {
  const root = document.getElementById('dep-device-pop');
  if (!root || root.__init) return; root.__init = true;
  const $ = (id) => root.querySelector('#' + id);
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  const STATUS_STATE = {
    'Succeeded': 'success', 'Failed': 'critical', 'Yet to Apply': 'warning',
    'In Progress': 'info', 'Retry In Progress': 'info',
  };
  const badge = (s) => `<ds-badge variant="subtle" state="${STATUS_STATE[s] || 'default'}" shape="rounded" size="medium">${esc(s)}</ds-badge>`;

  const DONUT_COLORS = { g: 'var(--uems-bg-success-solid, #16a34a)', r: 'var(--uems-bg-error-solid, #dc2626)', n: 'var(--uems-bg-warning-solid, #f59e0b)' };

  const STAGES = [
    { n: 1, name: 'Okta Verify — Install',        type: 'Software', status: 'Succeeded',   retry: '—',                 remarks: 'Installed 9.4 x64 silently',                                    at: 'Jul 21, 8:02 AM' },
    { n: 2, name: 'CrowdStrike Falcon — Install', type: 'Software', status: 'Succeeded',   retry: '—',                 remarks: 'Sensor registered with cloud',                                  at: 'Jul 21, 8:09 AM' },
    { n: 3, name: 'Zscaler VPN Profile',          type: 'Profile',  status: 'Failed',      retry: 'Retry In Progress', remarks: 'Error 0x87D1: profile install blocked by pending reboot',        at: 'Jul 21, 8:15 AM' },
    { n: 4, name: 'Domain Join — corp.acme.com',  type: 'Profile',  status: 'Yet to Apply',retry: '—',                 remarks: 'Waiting — upstream stage failed',                                at: '--' },
    { n: 5, name: 'BitLocker — OS drive, TPM',    type: 'Security', status: 'Yet to Apply',retry: '—',                 remarks: 'Waiting — upstream stage failed',                                at: '--' },
  ];
  const TIMELINE = [
    { d: 'g', t: 'Announcement (pre)',               out: 'Users saw a message: "IT is installing your onboarding profile — allow 15 min."' },
    { d: 'g', t: '1. Okta Verify — Install',         out: 'msiexec exit 0 / Detected: 9.4.0 x64', mono: true },
    { d: 'g', t: '2. CrowdStrike Falcon — Install',  out: 'Sensor installed · CID registered', mono: true },
    { d: 'r', t: '3. Zscaler VPN Profile',           out: 'Error 0x87D1: profile install blocked\nCause: pending reboot from Falcon sensor\nOn failure = Stop → downstream stages held\nRetry: attempt 2 of 2 scheduled after reboot', mono: true },
    { d: 'n', t: '4. Domain Join — corp.acme.com',   out: 'Waiting for stage 3 to succeed' },
    { d: 'n', t: '5. BitLocker — OS drive, TPM',     out: 'Waiting for stage 3 to succeed' },
  ];

  /* ---- Header ---------------------------------------------------------- */
  const ph = $('dv-ph');
  ph.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    const label = (a.textContent || '').trim();
    if (label === 'Deployments' && window.openContentView) { e.preventDefault(); window.openContentView('deployments-list'); }
    else if (window.__deploymentDetailId && window.openContentView && label !== 'Deployments' && !a.classList.contains('current')) {
      /* mid crumb → back to detail */
      e.preventDefault(); window.openContentView('deployments-detail');
    }
  });

  /* ---- Donut ---------------------------------------------------------- */
  function paintDonut(succ, fail, waiting) {
    const total = succ + fail + waiting;
    let off = 0;
    const parts = [];
    const seg = (val, color) => {
      if (val <= 0) return;
      const pct = (val / total) * 100;
      parts.push(`<circle cx="21" cy="21" r="15.9155" fill="transparent" stroke="${color}" stroke-width="6" stroke-dasharray="${pct.toFixed(3)} ${(100 - pct).toFixed(3)}" stroke-dashoffset="${(-off).toFixed(3)}"/>`);
      off += pct;
    };
    seg(succ,    DONUT_COLORS.g);
    seg(fail,    DONUT_COLORS.r);
    seg(waiting, DONUT_COLORS.n);
    $('dv-donut-svg').innerHTML = parts.join('');
    $('dv-total').textContent = String(total);
    $('dv-legend').innerHTML =
      `<span class="lg"><span class="sw" style="background:${DONUT_COLORS.g}"></span>Succeeded <span class="v">${succ}</span></span>` +
      `<span class="lg"><span class="sw" style="background:${DONUT_COLORS.r}"></span>Failed <span class="v">${fail}</span></span>` +
      `<span class="lg"><span class="sw" style="background:${DONUT_COLORS.n}"></span>Yet to Apply <span class="v">${waiting}</span></span>`;
  }

  /* ---- Table ---------------------------------------------------------- */
  const tbl = $('dv-table');
  tbl.columns = [
    { id: 'name',    header: 'Configuration Name', accessor: 'name' },
    { id: 'type',    header: 'Type',    accessor: 'type' },
    { id: 'status',  header: 'Status',  render: (r) => badge(r.status) },
    { id: 'retry',   header: 'Retry Status', render: (r) => r.retry === '—' ? '<span style="color:var(--uems-text-tertiary)">—</span>' : badge(r.retry) },
    { id: 'remarks', header: 'Remarks', accessor: 'remarks' },
    { id: 'at',      header: 'Executed At', accessor: 'at' },
  ];
  tbl.rows = STAGES;
  tbl.addEventListener('click', (e) => {
    const tr = e.target.closest && e.target.closest('tr');
    if (!tr) return;
    openPanel();
  });

  /* ---- Panel ---------------------------------------------------------- */
  function renderTimeline() {
    const parts = TIMELINE.map((n) =>
      `<div class="tl-node">
         <span class="tl-dot ${n.d}"></span>
         <div class="tl-title">${esc(n.t)}</div>
         <div class="tl-out ${n.mono ? 'mono' : ''}">${esc(n.out)}</div>
       </div>`).join('');
    $('dv-panel-body').innerHTML = parts;
    $('dv-panel-badge').innerHTML = badge('Failed');
  }
  function openPanel() {
    $('dv-scrim').setAttribute('data-open', 'true');
    $('dv-panel').setAttribute('data-open', 'true');
    $('dv-panel').setAttribute('aria-hidden', 'false');
    renderTimeline();
  }
  function closePanel() {
    $('dv-scrim').setAttribute('data-open', 'false');
    $('dv-panel').setAttribute('data-open', 'false');
    $('dv-panel').setAttribute('aria-hidden', 'true');
  }
  $('dv-open-timeline').addEventListener('click', openPanel);
  $('dv-panel-close').addEventListener('click', closePanel);
  $('dv-scrim').addEventListener('click', closePanel);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePanel(); });

  /* ---- Wire up header + data ------------------------------------------ */
  function render() {
    const name = window.__deploymentDeviceName || 'VIR-LT-0245';
    ph.setAttribute('title', name);
    ph.setAttribute('description', 'corp.acme.com · Chennai DC · Logged on: nithya.k · Last contact Jul 21, 9:14 AM');
    ph.breadcrumbs = [
      { label: 'Deployments', href: '#' },
      { label: 'Onboarding — July batch', href: '#' },
      { label: name },
    ];
    ph.summary = [
      { label: 'Status',        value: 'Failed', status: 'critical' },
      { label: 'Domain',        value: 'corp.acme.com' },
      { label: 'Remote Office', value: 'Chennai DC' },
      { label: 'Last contact',  value: 'Jul 21, 9:14 AM' },
    ];
    paintDonut(2, 1, 2);
  }

  function show() { root.hidden = false; render(); closePanel(); }
  function hide() { root.hidden = true; }
  window.ShellDrawers = window.ShellDrawers || {};
  window.ShellDrawers['deployments-device-execution'] = { show, hide };
})();
</script>
</template>
<script>
(function () {
  const host = document.createElement('div'); host.className = 'sa-host'; document.body.appendChild(host);
  window.ShellDrawers = window.ShellDrawers || {};
  const frag = document.getElementById('drawer-fragment').content.cloneNode(true);
  frag.querySelectorAll('style').forEach((s) => document.head.appendChild(s));
  const scripts = [...frag.querySelectorAll('script')]; scripts.forEach((s) => s.remove());
  host.appendChild(frag);
  scripts.forEach((o) => { const s = document.createElement('script'); if (o.type) s.type = o.type; s.textContent = o.textContent; document.body.appendChild(s); });
  requestAnimationFrame(() => requestAnimationFrame(() => window.ShellDrawers['deployments-device-execution'].show()));
})();
</script>
</body>
</html>
