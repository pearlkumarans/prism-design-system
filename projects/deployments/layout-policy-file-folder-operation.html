<!DOCTYPE html>
<!-- Deployments · Policy · File Folder Operation (User) — sectioned form. -->
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="../../" />
  <title>File Folder Operation — Prism (standalone)</title>
  <link rel="stylesheet" href="design-system-library/src/styles/index.css" />
  <link rel="stylesheet" href="Layout/layout-base.css" />
  <script type="module">import './design-system-library/src/components/index.js';</script>
  <script>
    window.UEMS_ICON_SPRITE = 'design-system-library/src/icons/icons.svg';
    window.UEMS_ILLUSTRATION_SPRITE = 'design-system-library/src/icons/illustrations.svg';
    window.UEMS_LOGO_BASE = 'design-system-library/src/icons/logos';
    (function () { var t = 'light'; try { t = localStorage.getItem('uems-theme') || 'light'; } catch (_) {} document.documentElement.setAttribute('data-theme', t); })();
  </script>
  <style>html, body { height: 100%; margin: 0; font-family: var(--font-family-sans); background: var(--uems-bg-primary); } .sa-host { display: flex; flex-direction: column; height: 100vh; }</style>
</head>
<body>

<template id="drawer-fragment">
<style>
#pol-ff-pop .lay__section { padding: 20px 0 4px; }
#pol-ff-pop .lay__fields { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; }
#pol-ff-pop .lay__field { max-width: 900px; padding-bottom: 20px; }
#pol-ff-pop .lay__field:has(ds-field-helper) { padding-bottom: 0; }
#pol-ff-pop .lay__control-only { padding-inline-start: 288px; }
#pol-ff-pop #ff-action .ds-radio-group__items,
#pol-ff-pop #ff-type .ds-radio-group__items,
#pol-ff-pop #ff-action-type .ds-radio-group__items { display: flex; flex-direction: row; gap: 32px; flex-wrap: wrap; }
#pol-ff-pop .ff-list-wrap { padding-top: 12px; }
#pol-ff-pop .ff-list-wrap ds-data-table { width: 100%; max-width: 1000px; }
#pol-ff-pop .ff-add-more { padding: 20px 0 40px; text-align: center; }
</style>

<div id="pol-ff-pop" class="lay-root" hidden>
  <div class="lay">

    <ds-page-header id="ff-ph" icon="file-folder" structure="default"
      title="File folder operation (User)"
      description="Copy, rename, move or delete files on managed user accounts."
      show-description show-breadcrumbs>
    </ds-page-header>

    <div class="lay__scroll">

      <!-- Section 1: Name -->
      <div class="lay__section">
        <ds-section-header style-variant="with-border" size="large"
          title="Name and description"
          description="Name this policy and add an optional description."></ds-section-header>
        <div class="lay__fields">
          <div class="lay__field">
            <ds-text-input id="ff-name" size="medium" required
              label="Name" label-position="left"
              placeholder="MyConfiguration51825"
              value="MyConfiguration51825"
              show-counter counter="20/100"></ds-text-input>
          </div>
          <div class="lay__field">
            <div class="lay__control-only">
              <ds-text-link href="#" size="medium" prefix-icon="plus">Add description</ds-text-link>
            </div>
          </div>
        </div>
      </div>

      <!-- Section 2: Configure File Folder Operation -->
      <div class="lay__section">
        <ds-section-header style-variant="with-border" size="large"
          title="Configure file folder operation"
          description="Choose the action, pick the file source and set the destination path on the endpoint."></ds-section-header>

        <div class="ff-list-wrap">
          <ds-section-header size="medium" title="List of files/folders &amp; actions"></ds-section-header>
          <ds-data-table id="ff-list" selection-mode="none" row-height="comfortable" show-footer="false" sticky-header></ds-data-table>
        </div>

        <div class="lay__fields" style="padding-top: 20px;">
          <div class="lay__field">
            <ds-radio-group id="ff-action" label="Select action" label-position="left" value="copy"></ds-radio-group>
          </div>
          <div class="lay__field">
            <ds-radio-group id="ff-type" label="Select type" label-position="left" value="http"></ds-radio-group>
          </div>
          <div class="lay__field">
            <ds-radio-group id="ff-action-type" label="Select action type" label-position="left" value="files"></ds-radio-group>
          </div>
          <div class="lay__field">
            <ds-file-upload id="ff-files" required
              label="Files" label-position="left"
              placeholder="Choose files (or) drop here"
              helper-text="Maximum file size limit is 12 GB."></ds-file-upload>
          </div>
          <div class="lay__field">
            <ds-text-input id="ff-dest" size="medium" required
              label="Destination folder" label-position="left"
              placeholder="c:\EndpointCentral"
              helper-text="Example: c:\EndpointCentral"></ds-text-input>
          </div>
        </div>

        <div class="ff-add-more">
          <ds-button variant="secondary" prefix-icon="plus">Add more file/folders</ds-button>
        </div>
      </div>

    </div>

    <ds-form-footer id="ff-footer" show-left="false">
      <ds-button data-act="cancel"     variant="outline">Cancel</ds-button>
      <ds-button data-act="save-draft" variant="secondary">Save as Draft</ds-button>
      <ds-button data-act="add"        variant="primary">Add Policy</ds-button>
    </ds-form-footer>
  </div>
</div>

<script>
(function () {
  const root = document.getElementById('pol-ff-pop');
  if (!root || root.__init) return; root.__init = true;
  const $ = (id) => root.querySelector('#' + id);
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  const ph = $('ff-ph');
  ph.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    const label = (a.textContent || '').trim();
    if (label === 'Policies'   && window.openContentView) { e.preventDefault(); window.openContentView('deployments-policy-list'); }
    else if (label === 'Add Policy' && window.openContentView) { e.preventDefault(); window.openContentView('deployments-policy'); }
  });
  ph.breadcrumbs = [
    { label: 'Policies',   href: '#' },
    { label: 'Add Policy', href: '#' },
    { label: 'File folder operation (User)' },
  ];

  $('ff-action').options = [
    { value: 'copy',   label: 'Copy', selected: true },
    { value: 'rename', label: 'Rename' },
    { value: 'move',   label: 'Move' },
    { value: 'delete', label: 'Delete' },
  ];
  $('ff-type').options = [
    { value: 'http',  label: 'Copy using HTTP', selected: true },
    { value: 'share', label: 'Copy using network share / Copy with local computer' },
  ];
  $('ff-action-type').options = [
    { value: 'files',   label: 'Files', selected: true },
    { value: 'archive', label: 'File as archive' },
  ];

  const tbl = $('ff-list');
  tbl.columns = [
    { id: 'source',    header: 'Source',      accessor: 'source' },
    { id: 'dest',      header: 'Destination', accessor: 'dest' },
    { id: 'operation', header: 'Operation',   render: (r) =>
      `<ds-badge variant="subtle" state="info" shape="rounded" size="medium">${esc(r.operation)}</ds-badge>` },
    { id: 'actions', header: '', align: 'end', render: () =>
      `<button type="button" aria-label="Row actions"
        style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:0;background:transparent;border-radius:var(--radius-sm);cursor:pointer;color:var(--uems-icon-secondary)">
        <ds-icon name="more-vertical" size="16"></ds-icon>
      </button>` },
  ];
  tbl.rows = [
    { id: 1, source: 'automation.log', dest: '$allusersmusic', operation: 'Files' },
  ];

  $('ff-footer').addEventListener('click', (e) => {
    const btn = e.target.closest && e.target.closest('[data-act]');
    if (!btn) return;
    const id = btn.dataset.act;
    if (id === 'cancel') { if (window.openContentView) window.openContentView('deployments-policy'); return; }
    const name = ($('ff-name').value || '').trim() || 'Untitled policy';
    if (window.savePolicyAndOpen) window.savePolicyAndOpen({
      name,
      type: 'File Folder Operation',
      platform: 'Windows',
      scope: 'user',
      status: id === 'save-draft' ? 'Draft' : 'Ready to Execute',
    });
  });

  function show() { root.hidden = false; }
  function hide() { root.hidden = true; }
  window.ShellDrawers = window.ShellDrawers || {};
  window.ShellDrawers['deployments-policy-file-folder-operation'] = { show, hide };
})();
</script>
</template>

<script>
(function () {
  const host = document.createElement('div'); host.className = 'sa-host'; document.body.appendChild(host);
  window.ShellDrawers = window.ShellDrawers || {};
  const frag = document.getElementById('drawer-fragment').content.cloneNode(true);
  frag.querySelectorAll('style').forEach((s) => document.head.appendChild(s));
  const scripts = [...frag.querySelectorAll('script')]; scripts.forEach((s) => s.remove());
  host.appendChild(frag);
  scripts.forEach((o) => { const s = document.createElement('script'); if (o.type) s.type = o.type; s.textContent = o.textContent; document.body.appendChild(s); });
  requestAnimationFrame(() => requestAnimationFrame(() => window.ShellDrawers['deployments-policy-file-folder-operation'].show()));
})();
</script>
</body>
</html>
