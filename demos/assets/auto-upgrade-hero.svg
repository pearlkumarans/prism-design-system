<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" role="img" aria-label="A 3D server stack upgrading itself">
  <defs>
    <linearGradient id="au-bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#090D22"/>
      <stop offset="0.55" stop-color="#111844"/>
      <stop offset="1" stop-color="#1A1A50"/>
    </linearGradient>
    <radialGradient id="au-glow" cx="50%" cy="50%" r="48%">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="au-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38517F"/>
      <stop offset="1" stop-color="#182746"/>
    </linearGradient>
    <linearGradient id="au-cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="au-arrow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>
    <linearGradient id="au-check" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="au-halo" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="au-soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- ground + concentrated glow -->
  <rect width="400" height="180" fill="url(#au-bg)"/>
  <rect width="400" height="180" fill="url(#au-glow)"/>
  <g fill="#C7D2FE">
    <circle cx="44" cy="30" r="1.2" opacity="0.4"/><circle cx="360" cy="38" r="1.2" opacity="0.4"/>
    <circle cx="70" cy="126" r="1" opacity="0.3"/><circle cx="332" cy="124" r="1" opacity="0.3"/>
  </g>

  <!-- pedestal -->
  <ellipse cx="200" cy="158" rx="96" ry="12" fill="#000000" opacity="0.4"/>
  <ellipse cx="200" cy="156" rx="62" ry="7" fill="#38BDF8" opacity="0.28"/>

  <!-- halo so the stack pops -->
  <rect x="146" y="40" width="128" height="112" rx="14" fill="#38BDF8" opacity="0.34" filter="url(#au-halo)"/>

  <!-- ISOMETRIC SERVER STACK: front + lit top + shadowed right faces -->
  <!-- top block -->
  <g stroke="#5A76A4" stroke-width="1" stroke-linejoin="round">
    <polygon points="246,44 266,32 266,64 246,76" fill="#14203C"/>
    <polygon points="150,44 170,32 266,32 246,44" fill="#4C69A0"/>
    <rect x="150" y="44" width="96" height="32" fill="url(#au-front)"/>
    <rect x="150" y="44" width="96" height="3.5" fill="#6E8CBC" opacity="0.7"/>
    <rect x="160" y="54" width="58" height="7" rx="3.5" fill="#0A1330"/>
    <rect x="160" y="54" width="38" height="7" rx="3.5" fill="url(#au-cyan)"/>
    <circle cx="233" cy="57.5" r="3.2" fill="#38BDF8"/>
  </g>
  <!-- middle block -->
  <g stroke="#3A5075" stroke-width="1" stroke-linejoin="round">
    <polygon points="246,78 266,66 266,98 246,110" fill="#101A32"/>
    <rect x="150" y="78" width="96" height="32" fill="url(#au-front)" opacity="0.94"/>
    <rect x="150" y="78" width="96" height="3.5" fill="#5E7BAC" opacity="0.6"/>
    <rect x="160" y="90" width="11" height="7" rx="1.5" fill="#0A1330"/><rect x="175" y="90" width="11" height="7" rx="1.5" fill="#0A1330"/><rect x="190" y="90" width="11" height="7" rx="1.5" fill="#0A1330"/>
    <circle cx="233" cy="93.5" r="3.2" fill="#34D399"/>
  </g>
  <!-- bottom block -->
  <g stroke="#3A5075" stroke-width="1" stroke-linejoin="round">
    <polygon points="246,112 266,100 266,132 246,144" fill="#0D1730"/>
    <rect x="150" y="112" width="96" height="32" fill="url(#au-front)" opacity="0.88"/>
    <rect x="150" y="112" width="96" height="3.5" fill="#5E7BAC" opacity="0.5"/>
    <rect x="160" y="124" width="11" height="7" rx="1.5" fill="#0A1330"/><rect x="175" y="124" width="11" height="7" rx="1.5" fill="#0A1330"/><rect x="190" y="124" width="11" height="7" rx="1.5" fill="#0A1330"/>
    <circle cx="233" cy="127.5" r="3.2" fill="#60A5FA"/>
  </g>

  <!-- upgrade arrow lifting off the top (glow + solid) -->
  <g transform="translate(200,26)">
    <path d="M0 -18 L14 2 L6 2 L6 16 L-6 16 L-6 2 L-14 2 Z" fill="#38BDF8" opacity="0.55" filter="url(#au-soft)"/>
    <path d="M0 -18 L14 2 L6 2 L6 16 L-6 16 L-6 2 L-14 2 Z" fill="url(#au-arrow)"/>
  </g>

  <!-- verified badge on the front, lower-right -->
  <g transform="translate(232,132)">
    <circle r="13" fill="url(#au-check)"/>
    <path d="M -5.5 0.5 L -1.5 4.5 L 6 -4" fill="none" stroke="#06251B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#FBBF24"><path d="M300 58 l1.5 3.6 3.6 1.5 -3.6 1.5 -1.5 3.6 -1.5 -3.6 -3.6 -1.5 3.6 -1.5 z" opacity="0.85"/></g>
</svg>
