<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Prism · Ember POC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Design-system tokens + component styles — the same source stylesheet the
         vanilla shell uses, VENDORED into public/vendor/ds by scripts/vendor-assets.mjs
         (Phase C: no dev proxy). Its @imports resolve within the vendored tree. -->
    <link rel="stylesheet" href="/vendor/ds/styles/index.css" />

    <!-- Register all ds-* custom elements from the vendored library source. A native
         module script — relative imports resolve within /vendor/ds, same origin. -->
    <script type="module" src="/vendor/ds/components/index.js"></script>

    <!-- The app's framework-agnostic data layer (window.PrismAPI). Mock by default;
         set proxy/baseUrl to go live. The api service wraps this. -->
    <script src="/Layout/data/prism-api.js"></script>

    <!-- Sprite locations, read by <ds-icon>/<ds-illustration> at runtime — served
         from the vendored tree, same origin as everything else. -->
    <script>
      window.UEMS_ICON_SPRITE = '/vendor/ds/icons/icons.svg';
      window.UEMS_ILLUSTRATION_SPRITE = '/vendor/ds/icons/illustrations.svg';
      window.UEMS_LOGO_BASE = '/vendor/ds/icons/logos';
      // Set the initial theme BEFORE first paint. The design system's color tokens
      // are scoped to [data-theme=…]; with no attribute they fall back to white.
      // (Same boot step every vanilla-shell page does. The theme service takes over
      // for runtime changes.)
      (function () {
        var t = 'light';
        try { t = localStorage.getItem('uems-theme') || 'light'; } catch (_) {}
        document.documentElement.setAttribute('data-theme', t);
        // POC default: run PrismAPI in MOCK mode (no backend wired here). Only sets
        // the default when the user hasn't chosen a proxy/baseUrl — going live is
        // still just setting uems-api-proxy or uems-api-base. Must run before prism-api.js.
        try {
          if (localStorage.getItem('uems-api-proxy') === null && localStorage.getItem('uems-api-base') === null) {
            localStorage.setItem('uems-api-proxy', '');
          }
        } catch (_) {}
      })();
    </script>

    {{content-for "head"}}
    <link rel="stylesheet" href="{{rootURL}}assets/vendor.css" />
    <link rel="stylesheet" href="{{rootURL}}assets/prism-webapp.css" />
    {{content-for "head-footer"}}
  </head>
  <body>
    {{content-for "body"}}

    <script src="{{rootURL}}assets/vendor.js"></script>
    <script src="{{rootURL}}assets/prism-webapp.js"></script>

    {{content-for "body-footer"}}
  </body>
</html>
