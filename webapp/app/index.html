<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>ManageEngine Endpoint Central</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Design-system tokens + component styles — the same source stylesheet the
         vanilla shell uses, VENDORED into public/vendor/ds by scripts/vendor-assets.mjs
         (Phase C: no dev proxy). Its @imports resolve within the vendored tree. -->
    <link rel="stylesheet" href="/vendor/ds/styles/index.css" />

    <!-- The .lay/.lay__scroll scaffold that every LEGACY view (injected via
         ContentOutlet) relies on. The vanilla shell loads this in its <head>;
         the webapp must too, or injected views lose their frame + 20px content
         inset and render edge-to-edge. Vendored from Layout/layout-base.css. -->
    <link rel="stylesheet" href="/Layout/layout-base.css" />

    <!-- ds-drawer ships its CSS separately (NOT in the global index.css bundle),
         exactly as Shell.html loads it. Without this the Help / Accessibility /
         Updates drawers (ds-drawer) render unstyled — full-width, in document
         flow — instead of as a right-docked slide-over. -->
    <link rel="stylesheet" href="/vendor/ds/components/drawer/drawer.css" />

    <!-- Self-hosted "Personalize → Font" families (Lato/Roboto/Inter/Poppins),
         generated by scripts/vendor-fonts.mjs. The vanilla shell hotlinks Google
         Fonts; we serve them locally so the build stays self-contained. Default
         font is still "Zoho Puvi" → system fallback; these only apply when the
         user picks one in Personalize. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <!-- Register all ds-* custom elements from the vendored library source. A native
         module script — relative imports resolve within /vendor/ds, same origin. -->
    <script type="module" src="/vendor/ds/components/index.js"></script>

    <!-- Boot defaults PrismAPI reads at load — MUST run BEFORE prism-api.js:
         mock mode (empty proxy + base) and the login gate ON. Users override by
         setting uems-api-proxy / uems-api-base (go live) or uems-require-login='false'. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('uems-api-proxy') === null && localStorage.getItem('uems-api-base') === null) localStorage.setItem('uems-api-proxy', '');
          if (localStorage.getItem('uems-require-login') === null) localStorage.setItem('uems-require-login', 'true');
        } catch (_) {}
      })();
    </script>

    <!-- The app's framework-agnostic data layer (window.PrismAPI). Mock by default;
         set proxy/baseUrl to go live. The api service wraps this. -->
    <script src="/Layout/data/prism-api.js"></script>

    <!-- Sprite locations, read by <ds-icon>/<ds-illustration> at runtime — served
         from the vendored tree, same origin as everything else. -->
    <script>
      window.UEMS_ICON_SPRITE = '/vendor/ds/icons/icons.svg';
      window.UEMS_ILLUSTRATION_SPRITE = '/vendor/ds/icons/illustrations.svg';
      window.UEMS_LOGO_BASE = '/vendor/ds/icons/logos';
      // Set the initial theme BEFORE first paint. The design system's color tokens
      // are scoped to [data-theme=…]; with no attribute they fall back to white.
      // (Same boot step every vanilla-shell page does. The theme service takes over
      // for runtime changes.)
      (function () {
        var t = 'light';
        try { t = localStorage.getItem('uems-theme') || 'light'; } catch (_) {}
        document.documentElement.setAttribute('data-theme', t);
        // (PrismAPI's mock + login-gate defaults are set earlier, before prism-api.js.)
      })();
    </script>

    {{content-for "head"}}
    <link rel="stylesheet" href="{{rootURL}}assets/vendor.css" />
    <link rel="stylesheet" href="{{rootURL}}assets/prism-webapp.css" />
    {{content-for "head-footer"}}
  </head>
  <body>
    {{content-for "body"}}

    <script src="{{rootURL}}assets/vendor.js"></script>
    <script src="{{rootURL}}assets/prism-webapp.js"></script>

    {{content-for "body-footer"}}
  </body>
</html>
