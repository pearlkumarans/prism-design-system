<!DOCTYPE html>
<!--
  Support PAGE — DUAL-MODE file (lives in Layout/views/, like the drawers).
  • Open directly in a browser  → the standalone harness (bottom) mounts + shows it.
  • Fetched by Shell.html        → injectDrawer() extracts ONLY <template id="drawer-fragment">.
  Unlike the slide-over drawers, this is a full CONTENT page: it fills the
  shell-area (hides L1/L2/ds-content) when the "Support" module is selected.
-->
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="../" />
  <title>Support — Prism (standalone)</title>
  <link rel="stylesheet" href="../design-system-library/src/styles/index.css" />
  <link rel="stylesheet" href="../design-system-library/src/components/drawer/drawer.css" />
  <script type="module">import '../design-system-library/src/components/index.js';</script>
  <script>
    window.UEMS_ICON_SPRITE = '../design-system-library/src/icons/icons.svg';
    window.UEMS_ILLUSTRATION_SPRITE = '../design-system-library/src/icons/illustrations.svg';
    window.UEMS_LOGO_BASE = '../design-system-library/src/icons/logos';
    (function () { var t = 'light'; try { t = localStorage.getItem('uems-theme') || 'light'; } catch (_) {} document.documentElement.setAttribute('data-theme', t); })();
  </script>
  <style>
    html, body { height: 100%; margin: 0; font-family: var(--font-family-sans); background: var(--uems-bg-base); }
    .sa-host { position: relative; display: flex; flex: 1; min-height: 0; height: 100vh; }
  </style>
</head>
<body>

<template id="drawer-fragment">
<style>
  /* ── Support page (fills the shell-area; opened by the "Support" module) ── */
  #support-pop { display: none; flex: 1; min-width: 0; flex-direction: column; background: var(--uems-bg-secondary-subtle); border-radius: 16px; overflow-y: auto; }
  .shell-area.support-open #support-pop { display: flex; }
  .shell-area.support-open > ds-content,
  .shell-area.support-open > ds-sidebar-l1,
  .shell-area.support-open > ds-sidebar-l2 { display: none !important; }

  .sup-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; padding: 20px; align-items: start; }
  @media (max-width: 1180px) { .sup-wrap { grid-template-columns: 1fr; } }
  .sup-main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

  /* Support action cards */
  .sup-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 900px) { .sup-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .sup-cards { grid-template-columns: 1fr; } }
  .sup-card { min-width: 0; }
  .sup-card__ic { width: 40px; height: 40px; border-radius: var(--radius-md, 10px); background: var(--uems-bg-secondary); display: flex; align-items: center; justify-content: center; color: var(--uems-text-secondary); margin-bottom: var(--spacing-16, 16px); }
  .sup-card__title { font-size: var(--font-size-15); font-weight: var(--font-weight-bold); color: var(--uems-text-primary); margin-bottom: var(--spacing-6); }
  .sup-card__desc { font-size: var(--font-size-13); line-height: 1.5; color: var(--uems-text-secondary); margin-bottom: var(--spacing-16, 16px); }

  /* Community & updates */
  .sup-comm__head { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-16); margin-bottom: var(--spacing-12); }
  .sup-comm__title { margin: 0; font-size: var(--font-size-18); font-weight: var(--font-weight-bold); color: var(--uems-text-primary); }
  .sup-comm__tabs { margin-bottom: var(--spacing-4); }
  .sup-topic { padding: var(--spacing-16) 0; border-top: 1px solid var(--uems-border-tertiary); }
  .sup-topic__head { display: flex; align-items: center; gap: var(--spacing-12); margin-bottom: var(--spacing-6); }
  .sup-topic__title { font-size: var(--font-size-14); font-weight: var(--font-weight-semibold); color: var(--uems-text-primary); }
  .sup-topic__excerpt { font-size: var(--font-size-13); line-height: 1.5; color: var(--uems-text-secondary); }
  .sup-comm__foot { display: flex; justify-content: center; padding-top: var(--spacing-16); }

  /* Your installation */
  .sup-install__head { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-16); margin-bottom: var(--spacing-12); }
  .sup-install__title { margin: 0; font-size: var(--font-size-18); font-weight: var(--font-weight-bold); color: var(--uems-text-primary); }
  .sup-install__tabs { margin-bottom: var(--spacing-8); }
  .sup-row { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--spacing-16); padding: var(--spacing-16, 16px) 0; border-top: 1px solid var(--uems-border-tertiary); }
  .sup-row:first-child { border-top: 0; }
  .sup-row__k { flex: 0 0 44%; font-size: var(--font-size-13); color: var(--uems-text-secondary); }
  .sup-row__v { flex: 1; font-size: var(--font-size-13); font-weight: var(--font-weight-semibold); color: var(--uems-text-primary); text-align: end; word-break: break-word; }
  [dir="rtl"] .sup-row__v { unicode-bidi: plaintext; }
</style>

<section id="support-pop" aria-label="Support">
  <div class="sup-wrap">
    <!-- LEFT — action cards + community -->
    <div class="sup-main">
      <div class="sup-cards" id="sup-cards"></div>

      <ds-container class="sup-comm" variant="outline" radius="lg" padding="lg">
        <div class="sup-comm__head">
          <h2 class="sup-comm__title" data-sup="community">Community &amp; updates</h2>
          <ds-button variant="secondary" size="small" prefix-icon="add" data-sup="newtopic">New topic</ds-button>
        </div>
        <ds-tab-bar-horizontal class="sup-comm__tabs" id="sup-comm-tabs" type="underline" active-id="all"></ds-tab-bar-horizontal>
        <div id="sup-topics"></div>
        <div class="sup-comm__foot"><ds-text-link href="#" variant="primary" size="medium" data-sup="browseall">Browse all discussions</ds-text-link></div>
      </ds-container>
    </div>

    <!-- RIGHT — your installation -->
    <ds-container class="sup-install" variant="outline" radius="lg" padding="lg">
      <div class="sup-install__head">
        <h2 class="sup-install__title" data-sup="installation">Your installation</h2>
        <ds-text-link href="#" variant="primary" size="small" data-sup="update">Update</ds-text-link>
      </div>
      <ds-tab-bar-horizontal class="sup-install__tabs" id="sup-install-tabs" type="underline" active-id="product"></ds-tab-bar-horizontal>
      <div id="sup-install-rows"></div>
    </ds-container>
  </div>
</section>

      </ds-container>`).join('');
  }
  function buildTopics(filter) {
    const box = document.getElementById('sup-topics'); if (!box) return;
    const list = (!filter || filter === 'all') ? TOPICS : TOPICS.filter((x) => x.tab === filter);
    box.innerHTML = list.length ? list.map((x) => {
      const tag = TAG[x.type] || TAG.idea;
      return `
      <div class="sup-topic">
        <div class="sup-topic__head">
          <span class="sup-topic__title">${t(x.key + '.title')}</span>

        <div class="sup-topic__excerpt">${t(x.key + '.excerpt')}</div>
      </div>`;
    }).join('') : `<div class="sup-topic" style="color:var(--uems-text-tertiary);border-top:0;">—</div>`;
  }
  function renderInstall(tab) {
    const box = document.getElementById('sup-install-rows'); if (!box) return;
    const rows = INSTALL[tab] || INSTALL.product;
    box.innerHTML = rows.map((r) => `<div class="sup-row"><span class="sup-row__k">${t(r.key)}</span><span class="sup-row__v">${r.value}</span></div>`).join('');

  function applyStrings() {
    const p = document.getElementById('support-pop'); if (!p) return;
    p.querySelectorAll('[data-sup]').forEach((el) => {
      const k = el.getAttribute('data-sup');
      if (MSGS.en['sup.' + k] == null) return;
      const s = t('sup.' + k);
      if (el.tagName === 'DS-BUTTON' || el.tagName === 'DS-TEXT-LINK') { (el.querySelector('.ds-button__label') || el.querySelector('a > span') || el).textContent = s; }
      else el.textContent = s;
    });
    const ct = document.getElementById('sup-comm-tabs');
    if (ct) ct.items = COMM_TABS.map((x) => ({ id: x.id, label: t(x.key), badge: x.badge }));
    const it = document.getElementById('sup-install-tabs');
    if (it) it.items = INSTALL_TABS.map((x) => ({ id: x.id, label: t(x.key) }));
  }
  let _wired = false;
  function build() {
    buildCards();
    applyStrings();
    buildTopics('all');
    renderInstall('product');
    if (!_wired) {
      _wired = true;
      const ct = document.getElementById('sup-comm-tabs');
      ct && ct.addEventListener('ds-tab-change', (e) => buildTopics(e.detail && e.detail.id));
      const it = document.getElementById('sup-install-tabs');
      it && it.addEventListener('ds-tab-change', (e) => renderInstall(e.detail && e.detail.id));
    }
  }
  function show() {
    const sa = shellArea(); if (!sa) return;
    sa.classList.remove('set-open', 'zia-open');
    sa.classList.add('support-open');
    build();
  }
  function hide() { const sa = shellArea(); if (sa) sa.classList.remove('support-open'); }
  function onLang() { const sa = shellArea(); if (sa && sa.classList.contains('support-open')) build(); }
  document.addEventListener('shell:langchange', onLang);
  window.ShellDrawers = window.ShellDrawers || {};
  window.ShellDrawers.support = { show, hide, build, onLang };
})();
</script>

  window.ShellDrawers = window.ShellDrawers || {};
  window.ShellCtx = window.ShellCtx || { get shellArea() { return host; }, get lang() { return lang; }, setActiveIcon() {} };
  const frag = document.getElementById('drawer-fragment').content.cloneNode(true);
  frag.querySelectorAll('style').forEach((s) => document.head.appendChild(s));
  const scripts = [...frag.querySelectorAll('script')]; scripts.forEach((s) => s.remove());
  host.appendChild(frag);
  scripts.forEach((o) => { const s = document.createElement('script'); s.textContent = o.textContent; document.body.appendChild(s); });
  const open = () => window.ShellDrawers[KEY] && window.ShellDrawers[KEY].show();
  requestAnimationFrame(() => requestAnimationFrame(open));
})();
</script>
