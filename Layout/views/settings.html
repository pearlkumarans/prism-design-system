<!DOCTYPE html>
<!--
  Settings drawer — DUAL-MODE file.
  • Open directly in a browser  → the standalone harness (bottom) mounts + auto-opens it.
  • Fetched by Shell.html        → injectDrawer() extracts ONLY <template id="drawer-fragment">
                                   (markup + CSS + registration script); head + harness ignored.
  Paths use ../design-system-library/… and resolve identically in both contexts thanks to <base href="../">.
-->
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="../" />
  <title>Settings — Prism (standalone)</title>
  <link rel="stylesheet" href="../design-system-library/src/styles/index.css" />
  <link rel="stylesheet" href="../design-system-library/src/components/drawer/drawer.css" />
  <script type="module">import '../design-system-library/src/components/index.js';</script>
  <script>
    window.UEMS_ICON_SPRITE = '../design-system-library/src/icons/icons.svg';
    window.UEMS_ILLUSTRATION_SPRITE = '../design-system-library/src/icons/illustrations.svg';
    window.UEMS_LOGO_BASE = '../design-system-library/src/icons/logos';
    (function () { var t = 'light'; try { t = localStorage.getItem('uems-theme') || 'light'; } catch (_) {} document.documentElement.setAttribute('data-theme', t); })();
  </script>
  <style>
    html, body { height: 100%; margin: 0; font-family: var(--font-family-sans); background: var(--uems-bg-base); }
    .sa-host { position: relative; display: flex; flex: 1; min-height: 0; height: 100vh; }
  </style>
</head>
<body>

<template id="drawer-fragment">
<style>
  /* ── Settings page (fills the shell-area; opened by the header gear icon) ── */
  #set-pop { display: none; flex: 1; min-width: 0; flex-direction: column; background: var(--uems-bg-primary); border-radius: 16px; overflow-y: auto; }
  .shell-area.set-open #set-pop { display: flex; }
  .shell-area.set-open > ds-content,
  .shell-area.set-open > ds-sidebar-l1,
  .shell-area.set-open > ds-sidebar-l2 { display: none !important; }
  /* Header = ds-page-header COMPONENT; sticky, with the same TOKEN-based gradient
     the drawers (help / updates) use — theme-aware, no hardcoded colours.
     The gradient must sit on the INNER .ds-page-header (it sets its own bg-base). */
  #set-pop ds-page-header { position: sticky; top: 0; z-index: 1; display: block; margin-bottom: var(--spacing-24); }
  /* padding-block: 0 — the component adds 12px top/bottom; the 72px title-row IS the
     full header height (no extra space around it). */
  #set-pop ds-page-header .ds-page-header { background: linear-gradient(135deg, var(--uems-bg-accent-primary) 0%, var(--uems-bg-primary) 55%, var(--uems-bg-warning-primary) 100%); padding-block: 0; }
  /* Title — 20px SemiBold. */
  #set-pop ds-page-header .ds-page-header__title { font-size: var(--font-size-20, 20px); font-weight: var(--font-weight-semibold); }
  /* Hide the bottom divider — the component's `show-divider="false"` is a no-op
     (its boolAttr only checks attribute PRESENCE, not the value), so kill it here. */
  #set-pop ds-page-header .ds-page-header__divider { display: none; }
  #set-pop ds-page-header .ds-page-header__title-row,
  #set-pop ds-page-header .ds-page-header__divider { padding-inline: var(--spacing-32); }
  /* Vertically centre the title with the search field (component defaults to flex-start). */
  #set-pop ds-page-header .ds-page-header__title-row { align-items: center; height: 72px; box-sizing: border-box; }
  #set-pop .set-search { width: clamp(280px, 42vw, 520px); }
  .set-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--spacing-40, 40px) var(--spacing-32); padding-inline: var(--spacing-32); padding-bottom: var(--spacing-40); align-items: start; }
  @media (max-width: 1280px) { .set-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 760px)  { .set-grid { grid-template-columns: 1fr; } }
  .set-card { display: flex; flex-direction: column; gap: var(--spacing-16); min-width: 0; }
  /* surface (gradient/radius/padding/row) now comes from <ds-container>; this only keeps colour + full-width */
  .set-card__head { align-self: stretch; color: var(--uems-text-secondary); }
  .set-card__head h2 { margin: 0; font-size: var(--font-size-14); font-weight: var(--font-weight-semibold); color: var(--uems-text-primary); }
  .set-card__links { display: flex; flex-wrap: wrap; align-items: center; gap: var(--spacing-2) var(--spacing-4); line-height: 1.5; }
  .set-card__links > ds-text-link::after { content: "|"; color: var(--uems-border-secondary); margin-inline-start: var(--spacing-4); user-select: none; }
  .set-card__links > ds-text-link.is-last::after { content: none; }
  .set-card__more { flex-basis: 100%; margin-top: var(--spacing-4); }
  .set-card__links a.ds-text-link { padding: 4px 8px; margin: -4px 0; border-radius: var(--radius-sm); font-weight: var(--font-weight-regular); line-height: 24px; transition: background-color 120ms var(--ease-standard, ease), color 120ms var(--ease-standard, ease); }
  .set-card__links a.ds-text-link:hover { background: var(--uems-bg-accent-primary); color: var(--uems-text-accent-link) !important; text-decoration: none; }
  .set-grid__empty { grid-column: 1 / -1; padding: var(--spacing-32); text-align: center; color: var(--uems-text-tertiary); font-size: var(--font-size-14); }
</style>

<section class="set-page" id="set-pop" aria-label="Settings">
  <ds-page-header id="set-header" title="Settings" show-breadcrumbs="false" show-overflow="false" show-divider="false">
    <ds-search-field slot="actions" class="set-search" id="set-search" size="medium" placeholder="Search Settings"></ds-search-field>
  </ds-page-header>
  <div class="set-grid" id="set-grid"></div>

  const SECTIONS = [

    grid.innerHTML = SECTIONS.map((s, si) => {
      const title = t(`set.sec.${si}.title`);
      const foot = s.foot ? t(`set.sec.${si}.foot`) : '';
      const links = Array.from({ length: s.links }, (_, i) => t(`set.sec.${si}.link.${i}`));

    wireSettingsSearch(grid);

  function wireSettingsSearch(grid) {
    const searchEl = document.getElementById('set-search');
    if (!searchEl || !grid || searchEl._wired) return;
    searchEl._wired = true;
    let emptyMsg = null;
    function filter(raw) {
      const q = (raw || '').trim().toLowerCase();
      let anyCard = false;
      grid.querySelectorAll('.set-card').forEach((card) => {
        const title = card.querySelector('.set-card__head h2').textContent.toLowerCase();
        const titleMatch = !!q && title.includes(q);
        let visible = false;
        card.querySelectorAll('.set-card__links ds-text-link').forEach((l) => {
          const m = !q || titleMatch || l.textContent.toLowerCase().includes(q);
          l.style.display = m ? '' : 'none';
          if (m) visible = true;
        });
        let lastShown = null;
        card.querySelectorAll('.set-card__links > ds-text-link').forEach((l) => {
          l.classList.remove('is-last');
          if (l.style.display !== 'none') lastShown = l;
        });
        if (lastShown) lastShown.classList.add('is-last');
        const show = !q || visible;
        card.style.display = show ? '' : 'none';
        if (show) anyCard = true;
      });
      if (q && !anyCard) {
        if (!emptyMsg) { emptyMsg = document.createElement('div'); emptyMsg.className = 'set-grid__empty'; grid.appendChild(emptyMsg); }
        emptyMsg.textContent = t('set.noMatch') + ' “' + raw.trim() + '”';
        emptyMsg.style.display = '';
      } else if (emptyMsg) { emptyMsg.style.display = 'none'; }
    }
    searchEl.addEventListener('ds-search-field-input', (e) => filter(e.detail && e.detail.value));
    searchEl.addEventListener('ds-search-field-clear', () => filter(''));
    filter('');
  }
  function show() {
    const sa = shellArea(); if (!sa) return;
    sa.classList.remove('zia-open'); sa.classList.add('set-open');
    buildSettings();
    window.ShellCtx.setActiveIcon('settings');
  }
  function hide() {
    const sa = shellArea(); if (sa) sa.classList.remove('set-open');
    window.ShellCtx.setActiveIcon(null);
  }
  function onLang() {
    const grid = document.getElementById('set-grid');
    const sa = shellArea();
    if (grid) grid.innerHTML = '';
    if (sa && sa.classList.contains('set-open')) buildSettings(); else applyHeaderStrings();
  }
  document.addEventListener('shell:langchange', onLang);
  window.ShellDrawers = window.ShellDrawers || {};
  window.ShellDrawers.settings = { show, hide, build: buildSettings, onLang };
})();

<script>
/* ── STANDALONE HARNESS — runs ONLY when this file is opened directly.
   Shell never executes this (it extracts only #drawer-fragment). ── */
(function () {
  const KEY = 'settings';
  const host = document.createElement('div'); host.className = 'shell-area sa-host'; document.body.appendChild(host);
  let lang = 'en';
  window.ShellDrawers = window.ShellDrawers || {};
  window.ShellCtx = window.ShellCtx || { get shellArea() { return host; }, get lang() { return lang; }, setActiveIcon() {} };
  const frag = document.getElementById('drawer-fragment').content.cloneNode(true);
  frag.querySelectorAll('style').forEach((s) => document.head.appendChild(s));
  const scripts = [...frag.querySelectorAll('script')]; scripts.forEach((s) => s.remove());
  host.appendChild(frag);
  scripts.forEach((o) => { const s = document.createElement('script'); s.textContent = o.textContent; document.body.appendChild(s); });
  const open = () => window.ShellDrawers[KEY] && window.ShellDrawers[KEY].show();
  requestAnimationFrame(() => requestAnimationFrame(open));
})();
</script>
