<!DOCTYPE html>
<!--
  Support PAGE — DUAL-MODE file (lives in Layout/views/, like the drawers).
  • Open directly in a browser  → the standalone harness (bottom) mounts + shows it.
  • Fetched by Shell.html        → injectDrawer() extracts ONLY <template id="drawer-fragment">.
  Unlike the slide-over drawers, this is a full CONTENT page: it fills the
  shell-area (hides L1/L2/ds-content) when the "Support" module is selected.

  Structure (revamp): Get help → Contact us → lower two-column
  (User community discussions + General details w/ upgrade table).
-->
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="../" />
  <title>Support — Prism (standalone)</title>
  <link rel="stylesheet" href="../design-system-library/src/styles/index.css" />
  <link rel="stylesheet" href="../design-system-library/src/components/drawer/drawer.css" />
  <script type="module">import '../design-system-library/src/components/index.js';</script>
  <script>
    window.UEMS_ICON_SPRITE = '../design-system-library/src/icons/icons.svg';
    window.UEMS_ILLUSTRATION_SPRITE = '../design-system-library/src/icons/illustrations.svg';
    window.UEMS_LOGO_BASE = '../design-system-library/src/icons/logos';
    (function () { var t = 'light'; try { t = localStorage.getItem('uems-theme') || 'light'; } catch (_) {} document.documentElement.setAttribute('data-theme', t); })();
  </script>
  <style>
    html, body { height: 100%; margin: 0; font-family: var(--font-family-sans); background: var(--uems-bg-base); }
    .sa-host { position: relative; display: flex; flex: 1; min-height: 0; height: 100vh; }
  </style>
</head>
<body>

<template id="drawer-fragment">
<style>
  /* ── Support page (fills the shell-area; opened by the "Support" module) ── */
  #support-pop { display: none; flex: 1; min-width: 0; flex-direction: column; background: var(--uems-bg-secondary-subtle); border-radius: 16px; overflow-y: auto; }
  .shell-area.support-open #support-pop { display: flex; }
  .shell-area.support-open > ds-content,
  .shell-area.support-open > ds-sidebar-l1,
  .shell-area.support-open > ds-sidebar-l2 { display: none !important; }

  .sup-page { display: flex; flex-direction: column; gap: var(--spacing-32, 32px); padding: var(--spacing-24, 24px); }

  /* Section heading */
  .sup-section__head { margin-bottom: var(--spacing-16, 16px); }
  .sup-section__title { margin: 0; font-size: var(--font-size-18); font-weight: var(--font-weight-bold); color: var(--uems-text-primary); }
  .sup-section__sub { display: block; margin-top: 2px; font-size: var(--font-size-13); color: var(--uems-text-tertiary); }

  /* Shared icon chip */
  .sup-chip { flex: none; border-radius: var(--radius-md, 10px); background: var(--uems-bg-accent-primary-subtle, var(--uems-bg-secondary)); color: var(--uems-icon-accent, var(--uems-text-secondary)); display: flex; align-items: center; justify-content: center; }
  .sup-chip--sm { width: 40px; height: 40px; }
  .sup-chip--lg { width: 48px; height: 48px; }

  /* Whole-card link wrapper (lifts on hover; border comes from the ds-container) */
  .sup-cardlink { display: block; text-decoration: none; color: inherit; border-radius: var(--radius-lg, 12px); transition: box-shadow .15s, transform .15s; }
  .sup-cardlink:hover { text-decoration: none; box-shadow: 0 2px 8px rgba(0,0,0,.06); transform: translateY(-1px); }
  /* ds-container defaults to inline; blockify it inside the card link so it fills
     the anchor (an inline container overflows its line box as a tall white shape). */
  .sup-cardlink > ds-container { display: block; height: 100%; }

  /* Get help — 4-col resource cards */
  .sup-help { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: var(--spacing-16, 16px); }
  @media (max-width: 1080px) { .sup-help { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  @media (max-width: 560px)  { .sup-help { grid-template-columns: 1fr; } }
  .sup-rescard { display: flex; gap: var(--spacing-12, 12px); align-items: flex-start; }
  .sup-rescard__title { font-size: var(--font-size-14); font-weight: var(--font-weight-semibold); color: var(--uems-text-primary); margin: 2px 0 4px; }
  .sup-rescard__desc { font-size: var(--font-size-12); line-height: 1.5; color: var(--uems-text-tertiary); }

  /* Contact us — 2 primary cards + a row of secondary links */
  .sup-contact-primary { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: var(--spacing-16, 16px); margin-bottom: var(--spacing-16, 16px); }
  @media (max-width: 980px) { .sup-contact-primary { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 640px) { .sup-contact-primary { grid-template-columns: 1fr; } }
  .sup-cta { display: flex; align-items: center; gap: var(--spacing-16, 16px); }
  .sup-cta__title { font-size: var(--font-size-14); font-weight: var(--font-weight-bold); color: var(--uems-text-primary); margin: 0 0 4px; }
  .sup-cta__desc { font-size: var(--font-size-13); color: var(--uems-text-tertiary); }
  .sup-cta__badge { margin-inline-start: auto; align-self: flex-start; }

  .sup-links { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: var(--spacing-12, 12px); }
  @media (max-width: 1080px) { .sup-links { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  @media (max-width: 560px)  { .sup-links { grid-template-columns: 1fr; } }
  .sup-link { display: flex; align-items: center; gap: var(--spacing-8, 8px); padding: var(--spacing-12, 12px) var(--spacing-16, 16px); border: 1px solid var(--uems-border-tertiary); border-radius: var(--radius-md, 10px); background: var(--uems-bg-primary); color: var(--uems-text-secondary); font-size: var(--font-size-13); font-weight: var(--font-weight-medium); text-decoration: none; transition: box-shadow .15s, transform .15s; }
  .sup-link:hover { text-decoration: none; box-shadow: 0 2px 8px rgba(0,0,0,.06); transform: translateY(-1px); }
  .sup-link ds-icon { color: var(--uems-text-tertiary); flex: none; }

  /* Lower two-column: community discussions + general details */
  .sup-lower { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); gap: var(--spacing-16, 16px); align-items: stretch; }
  @media (max-width: 1180px) { .sup-lower { grid-template-columns: minmax(0, 1fr); } }
  /* ds-widget caps itself at 580px (dashboard tile); release it and give both
     panels an EQUAL bounded height so they sit parallel and their bodies scroll
     when content overflows (the ds-widget list body already has overflow-y:auto —
     it only engages once the surface height is constrained). */
  .sup-lower > ds-widget { max-width: none; width: 100%; height: 560px; }
  .sup-lower > ds-widget .ds-widget__surface { height: 100%; }
  /* Mobile: stacked and never force horizontal overflow (minmax(0,1fr) track lets
     content shrink). Keep a bounded height so a long list (e.g. Upgrade details)
     scrolls inside the widget instead of stretching the page. */
  @media (max-width: 1180px) { .sup-lower > ds-widget { height: 440px; } }
  /* The widget body has 0 horizontal padding (list widgets self-inset via
     ds-description-list); our custom body content isn't, so inset it 16px to
     line up with the header title + footer link. */
  .sup-lower ds-widget .ds-widget__body { padding-inline: var(--spacing-16, 16px); }
  /* ds-description-list carries its own 16px container padding. Drop only the
     HORIZONTAL padding so its rows line up with the body inset (header title /
     tabs); keep the vertical padding for breathing room below the tab bar. */
  .sup-lower ds-widget .ds-description-list { padding-inline: 0; }

  /* Discussion threads */
  .sup-thread { display: block; padding: var(--spacing-16, 16px) var(--spacing-12, 12px); margin-inline: calc(-1 * var(--spacing-12, 12px)); border-radius: var(--radius-md, 10px); border-top: 1px solid var(--uems-border-tertiary); text-decoration: none; color: inherit; transition: background-color .12s ease; }
  .sup-thread:first-of-type { border-top: 0; }
  .sup-thread:hover { text-decoration: none; background: var(--uems-bg-primary-hover); }
  .sup-thread:hover .sup-thread__title { color: var(--uems-text-info); }
  .sup-thread__head { display: flex; align-items: center; gap: var(--spacing-8, 8px); margin-bottom: 4px; }
  .sup-thread__title { font-size: var(--font-size-14); font-weight: var(--font-weight-semibold); color: var(--uems-text-primary); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sup-thread__excerpt { font-size: var(--font-size-13); line-height: 1.5; color: var(--uems-text-tertiary); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 6px; }
  .sup-thread__meta { font-size: var(--font-size-12); color: var(--uems-text-quaternary); }

  /* General details */
  .sup-gd__tabs { margin-bottom: var(--spacing-8, 8px); flex: 0 0 auto; }
  /* Tabs stay pinned at the top while only the rows below scroll vertically:
     make the body a flex column that clips, and scroll the content region only.
     (The tab bar's own horizontal-scroll behavior is left untouched.) */
  #sup-gd-widget .ds-widget__body { display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
  #sup-gd-widget #sup-gd-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; }

  /* Upgrade details — stacked list */
  .sup-upg__head { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-12, 12px); padding: var(--spacing-8, 8px) 0 var(--spacing-4, 4px); }
  .sup-upg__lead { font-size: var(--font-size-13); line-height: 20px; font-weight: var(--font-weight-medium); color: var(--uems-text-tertiary); }
  .sup-upg__total { font-size: var(--font-size-13); line-height: 20px; color: var(--uems-text-quaternary); }
  .sup-upg__item { padding: var(--spacing-12, 12px) 0; border-top: 1px solid var(--uems-border-tertiary); }
  .sup-upg__head + .sup-upg__item { border-top: 0; }   /* no divider directly under the caption */
  .sup-upg__row1 { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-8, 8px); }
  .sup-upg__meta { margin-top: 2px; font-size: var(--font-size-13); line-height: 20px; color: var(--uems-text-tertiary); }
  .sup-upg__error { margin-top: var(--spacing-8, 8px); font-size: var(--font-size-12); line-height: 1.5; color: var(--uems-text-error); }
  .sup-upg__error ds-text-link { margin-inline-start: var(--spacing-4, 4px); }
</style>

<section id="support-pop" aria-label="Support">

    <!-- GET HELP — self-service resources -->
    <section class="sup-section">

      </div>

        <div id="sup-gd-body"></div>
      </ds-widget>
    </div>

  </div>
</section>

<script>

(function () {
  const KEY = 'support';
  const host = document.createElement('div'); host.className = 'shell-area sa-host'; document.body.appendChild(host);
  let lang = 'en';
  window.ShellDrawers = window.ShellDrawers || {};
  window.ShellCtx = window.ShellCtx || { get shellArea() { return host; }, get lang() { return lang; }, setActiveIcon() {} };
  const frag = document.getElementById('drawer-fragment').content.cloneNode(true);
  frag.querySelectorAll('style').forEach((s) => document.head.appendChild(s));
  const scripts = [...frag.querySelectorAll('script')]; scripts.forEach((s) => s.remove());
  host.appendChild(frag);
  scripts.forEach((o) => { const s = document.createElement('script'); s.textContent = o.textContent; document.body.appendChild(s); });
  const open = () => window.ShellDrawers[KEY] && window.ShellDrawers[KEY].show();
  requestAnimationFrame(() => requestAnimationFrame(open));
})();
</script>
