<!DOCTYPE html>
<!--
  Product Updates — DUAL-MODE drawer (ds-drawer, .ec-drawer in .shell-area).
  Self-contained: date groups + per-category icon/colour/badge. Shell's showUpdates()
  coordinates mutual exclusion, lazy-loads, then calls ShellDrawers.updates.show().
-->
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="../" />
  <title>Product Updates — Prism (standalone)</title>
  <link rel="stylesheet" href="../design-system-library/src/styles/index.css" />
  <link rel="stylesheet" href="../design-system-library/src/components/drawer/drawer.css" />
  <script type="module">import '../design-system-library/src/components/index.js';</script>
  <script>
    window.UEMS_ICON_SPRITE = '../design-system-library/src/icons/icons.svg';
    window.UEMS_ILLUSTRATION_SPRITE = '../design-system-library/src/icons/illustrations.svg';
    window.UEMS_LOGO_BASE = '../design-system-library/src/icons/logos';
    (function () { var t = 'light'; try { t = localStorage.getItem('uems-theme') || 'light'; } catch (_) {} document.documentElement.setAttribute('data-theme', t); })();
  </script>
  <style>
    html, body { height: 100%; margin: 0; font-family: var(--font-family-sans); background: var(--uems-bg-base); }
    .sa-host { position: relative; display: flex; flex: 1; min-height: 0; height: 100vh; overflow: clip; }
    .shell-area ds-drawer.ec-drawer { position: absolute !important; inset: 0 !important; z-index: 30; }
  </style>
</head>
<body>

<template id="drawer-fragment">
<style>
  .pu-ghead { display: flex; align-items: center; gap: 8px; padding: 16px 0 4px; }
  /* Gap between the drawer header and the first day group = 24px. */
  #updates-pop .ds-drawer__body { padding-top: var(--spacing-24); }
  .pu-group:first-child .pu-ghead { padding-top: 0; }
  .pu-date { font-size: var(--font-size-13); font-weight: var(--font-weight-bold); letter-spacing: 0.04em; text-transform: uppercase; color: var(--uems-text-secondary); }
  /* Rows are ds-item-list (lead="box", divider="line"): the tinted tile, the chip
     above the title, the description and the inline "View" link are all the
     component's, so the whole .pu-item/.pu-ic anatomy is gone — including the six
     per-category tile colours, which are now TONES on the data.
     The list draws rules BETWEEN rows; this keeps the one under the date header,
     which is group chrome rather than row anatomy. */
  .pu-group ds-item-list { border-top: 1px solid color-mix(in srgb, var(--uems-border-tertiary) 55%, transparent); }
</style>

<ds-drawer id="updates-pop" class="ec-drawer" title="Product Updates" side="right" size="m" modal="false" show-footer="false">
  <div id="updates-body"></div>
</ds-drawer>

<script>
(function () {
  const lang = () => (window.ShellCtx && window.ShellCtx.lang) || 'en';
  const PU_ICON  = { platform: 'layers', performance: 'zap', feature: 'sparkles', security: 'shield', integration: 'puzzle', fix: 'bug' };
  const PU_TAG   = { platform: 'default', performance: 'success', feature: 'active', security: 'moderate', integration: 'acknowledge', fix: 'important' };
  /* Tile tint per category. These are ds-item-list TONES, not statuses: a release
     note has a category, not a state. `alert` and `brand` exist for exactly the two
     the status vocabulary never had (security, integration). */
  const PU_TONE  = { platform: 'default', performance: 'success', feature: 'info', security: 'alert', integration: 'brand', fix: 'warning' };
  const PU_LABEL = { platform: 'Platform', performance: 'Performance', feature: 'Feature', security: 'Security', integration: 'Integration', fix: 'Fix' };
  const PU_LABEL_AR = { platform: 'النظام الأساسي', performance: 'الأداء', feature: 'ميزة', security: 'الأمان', integration: 'تكامل', fix: 'إصلاح' };
  const MSGS = {
    en: {
      'upd.title': 'Product Updates', 'upd.view': 'View details', 'upd.today': 'Today',
      'upd.grp.0.date': 'Today',
      'upd.grp.0.item.0.title': 'Dark mode is available in Endpoint Central!', 'upd.grp.0.item.0.desc': 'Enable Dark Mode from User Account — theme options are at the bottom of the panel.',
      'upd.grp.0.item.1.title': 'AlmaLinux patching is now available', 'upd.grp.0.item.1.desc': 'Patch management now supports AlmaLinux systems.',
      'upd.grp.1.date': '2 Apr 2026',
      'upd.grp.1.item.0.title': 'Faster remote troubleshooting', 'upd.grp.1.item.0.desc': 'Quicker remote connections with reduced latency.',
      'upd.grp.1.item.1.title': 'ServiceNow integration', 'upd.grp.1.item.1.desc': 'Sync incidents and assets directly with your ServiceNow instance.',
      'upd.grp.2.date': '17 Mar 2026',
      'upd.grp.2.item.0.title': 'Security compliance dashboard', 'upd.grp.2.item.0.desc': 'Track device compliance and security risks from one place.',
      'upd.grp.2.item.1.title': 'Agent reconnect stability fix', 'upd.grp.2.item.1.desc': 'Resolved intermittent agent disconnects on slow networks.',
    },
    ar: {
      'upd.title': 'تحديثات المنتج', 'upd.view': 'عرض التفاصيل', 'upd.today': 'اليوم',
      'upd.grp.0.date': 'اليوم',
      'upd.grp.0.item.0.title': 'الوضع الداكن متاح الآن في Endpoint Central!', 'upd.grp.0.item.0.desc': 'فعّل الوضع الداكن من حساب المستخدم — خيارات السمة في أسفل اللوحة.',
      'upd.grp.0.item.1.title': 'تصحيح AlmaLinux متاح الآن', 'upd.grp.0.item.1.desc': 'إدارة التصحيحات تدعم الآن أنظمة AlmaLinux.',
      'upd.grp.1.date': '2 أبريل 2026',
      'upd.grp.1.item.0.title': 'استكشاف الأخطاء عن بُعد أسرع', 'upd.grp.1.item.0.desc': 'اتصالات عن بُعد أسرع مع زمن استجابة أقل.',
      'upd.grp.1.item.1.title': 'تكامل ServiceNow', 'upd.grp.1.item.1.desc': 'مزامنة الحوادث والأصول مباشرة مع مثيل ServiceNow الخاص بك.',
      'upd.grp.2.date': '17 مارس 2026',
      'upd.grp.2.item.0.title': 'لوحة معلومات الامتثال الأمني', 'upd.grp.2.item.0.desc': 'تتبّع امتثال الأجهزة والمخاطر الأمنية من مكان واحد.',
      'upd.grp.2.item.1.title': 'إصلاح استقرار إعادة اتصال الوكيل', 'upd.grp.2.item.1.desc': 'تم حل انقطاعات الوكيل المتقطعة على الشبكات البطيئة.',
    },
  };
  if (window.ShellCtx && window.ShellCtx.addMessages) window.ShellCtx.addMessages(MSGS);
  const t = (k) => (window.ShellCtx && window.ShellCtx.t) ? window.ShellCtx.t(k) : (MSGS.en[k] != null ? MSGS.en[k] : k);
  const PUPDATES = [
    { key: 'grp.0', version: '13.6.5', items: [
      { key: 'grp.0.item.0', cat: 'feature' },
      { key: 'grp.0.item.1', cat: 'platform' },
    ] },
    { key: 'grp.1', version: '12.8.3', items: [
      { key: 'grp.1.item.0', cat: 'performance' },
      { key: 'grp.1.item.1', cat: 'integration' },
    ] },
    { key: 'grp.2', version: '12.5.2', items: [
      { key: 'grp.2.item.0', cat: 'security' },
      { key: 'grp.2.item.1', cat: 'fix' },
    ] },
  ];
  const panel = () => document.getElementById('updates-pop');
  function renderUpdates() {
    const body = document.getElementById('updates-body'); if (!body) return;
    const ar = lang() === 'ar';
    const p = panel(); if (p) { p.setAttribute('title', t('upd.title')); if (ar) p.setAttribute('rtl', ''); else p.removeAttribute('rtl'); }
    const LBL = ar ? PU_LABEL_AR : PU_LABEL;
    /* ONE ds-item-list PER GROUP, with the date header between them. The component
       renders a flat list by design and has no grouping layer — but a group header
       is a heading, not a row, so it belongs to the page either way. Nothing here
       needs the component to grow one. */
    body.replaceChildren(...PUPDATES.map((g) => {
      const group = document.createElement('div');
      group.className = 'pu-group';

      const head = document.createElement('div');
      head.className = 'pu-ghead';
      const date = document.createElement('span');
      date.className = 'pu-date';
      date.textContent = t('upd.' + g.key + '.date');
      const ver = document.createElement('ds-badge');
      ver.setAttribute('variant', 'subtle');
      ver.setAttribute('state', 'default');
      ver.setAttribute('size', 'small');
      ver.setAttribute('shape', 'rounded');
      ver.setAttribute('label', `v${g.version}`);
      head.append(date, ver);

      const list = document.createElement('ds-item-list');
      list.setAttribute('divider', 'line');
      /* The chip sits ABOVE the title (metaPosition), the tile is tinted by
         CATEGORY rather than by state (tone — these rows have no status), and
         "View" ends the description rather than sitting in the trailing column. */
      list.items = g.items.map((it) => ({
        lead: 'box',
        tone: PU_TONE[it.cat],
        icon: PU_ICON[it.cat],
        metaPosition: 'above',
        badge: { text: LBL[it.cat], state: PU_TAG[it.cat], shape: 'rounded' },
        text: t('upd.' + it.key + '.title'),
        description: t('upd.' + it.key + '.desc'),
        link: { text: t('upd.view'), href: '#' },
      }));

      group.append(head, list);
      return group;
    }));
  }
  document.addEventListener('shell:langchange', () => { const p = panel(); if (p && p.hasAttribute('open')) renderUpdates(); });
  function show() { renderUpdates(); const p = panel(); if (p) p.open(); }
  function hide() { const p = panel(); if (p) p.close(); }
  window.ShellDrawers = window.ShellDrawers || {};
  window.ShellDrawers.updates = { show, hide, render: renderUpdates };
})();
</script>
</template>

<script>
/* ── STANDALONE HARNESS — runs ONLY when opened directly. ── */
(function () {
  const KEY = 'updates';
  const host = document.createElement('div'); host.className = 'shell-area sa-host'; document.body.appendChild(host);
  let lang = 'en';
  window.ShellDrawers = window.ShellDrawers || {};
  window.ShellCtx = window.ShellCtx || { get shellArea() { return host; }, get lang() { return lang; }, setActiveIcon() {} };
  const frag = document.getElementById('drawer-fragment').content.cloneNode(true);
  frag.querySelectorAll('style').forEach((s) => document.head.appendChild(s));
  const scripts = [...frag.querySelectorAll('script')]; scripts.forEach((s) => s.remove());
  host.appendChild(frag);
  scripts.forEach((o) => { const s = document.createElement('script'); s.textContent = o.textContent; document.body.appendChild(s); });
  customElements.whenDefined('ds-drawer').then(() => requestAnimationFrame(() => window.ShellDrawers[KEY] && window.ShellDrawers[KEY].show()));
})();
</script>
</body>
</html>
