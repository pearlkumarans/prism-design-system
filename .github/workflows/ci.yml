name: Design System CI

# Runs the component test suite on pushes and PRs that touch the library, and a
# build+test of the Ember webapp that consumes it.
# Repo root is `prism-design-system/`, so paths are relative to it.
#
# `webapp/**` is in the filter so webapp-only commits get checked at all — before,
# a change like the vendor-assets fix reached main with zero check-runs. The
# webapp job also runs on LIBRARY changes, which is the more valuable half:
# webapp/package.json depends on the library by path
# ("@uems/design-system": "file:../design-system-library"), so a component change
# can break the app's build, and nothing used to catch that.
on:
  push:
    paths:
      - 'design-system-library/**'
      - 'webapp/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'design-system-library/**'
      - 'webapp/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch: {}

# Supersede in-flight runs for the same ref to save CI minutes.
concurrency:
  group: ds-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Component tests (headless Chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design-system-library
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: design-system-library/package-lock.json

      # `npm ci` is reproducible from the lockfile. The fallback covers npm's
      # known optional-dependency bug (a missing platform-specific rollup binary),
      # which a clean reinstall resolves.
      - name: Install dependencies
        run: npm ci || (rm -rf node_modules package-lock.json && npm install)

      # Fail fast on hardcoded colors before spinning up a browser for the tests.
      - name: Token lint (no hardcoded colors)
        run: npm run lint:tokens

      # @web/test-runner launches a headless Chrome; GitHub's ubuntu-latest ships
      # Google Chrome, which the runner auto-detects. The CI env var makes the
      # config add --no-sandbox / --disable-dev-shm-usage (see web-test-runner.config.js).
      - name: Run component tests
        run: npm test

  visual:
    name: Visual regression (styled render)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design-system-library
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: design-system-library/package-lock.json

      - name: Install dependencies
        run: npm ci || (rm -rf node_modules package-lock.json && npm install)

      # Renders every component STYLED (tokens + component CSS) and pixel-diffs it
      # against a committed baseline. Baselines are OS-specific (font rasterisation),
      # so this runner compares against screenshots/Chrome-linux/baseline/**.
      #
      # ENFORCED: all 55 Linux baselines are blessed, so a visual regression now
      # FAILS the build. Renders were byte-identical across two separate runs before
      # blessing and the threshold is 0.15%, so this should not flake.
      #
      # If it does fail: download the visual-regression-linux artifact and compare
      # failed/<name>.png with failed/<name>-diff.png. Intended change? Copy the new
      # render over Chrome-linux/baseline/<name>.png and commit it, and refresh the
      # macOS set locally with `npm run test:visual:update`. The two platform sets
      # must stay name-for-name identical.
      # See design-system-library/test/visual/README.md.
      - name: Visual regression
        id: visual
        run: npm run test:visual

      # v6, not v5: upload-artifact@v5 still targets Node 20, so it would keep the
      # deprecation warning. checkout and setup-node move to Node 24 at v5.
      # failure(), not a bare outcome check: an `if` naming no status function is
      # implicitly ANDed with success(), so now that this job can actually fail, the
      # upload would be skipped on exactly the runs whose diffs you need.
      - name: Upload visual diffs / renders
        if: failure() && steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: visual-regression-linux
          path: design-system-library/screenshots/Chrome-linux/**
          if-no-files-found: warn
          retention-days: 14

  webapp:
    name: Webapp build + tests (Ember)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      # Same fallback as the library job: npm's optional-dependency bug can leave a
      # platform-specific binary missing, and a clean reinstall resolves it.
      - name: Install dependencies
        run: npm ci || (rm -rf node_modules package-lock.json && npm install)

      # `prebuild` runs sync:catalog + vendor:assets first, so this covers the
      # asset-vendoring step as well as the Ember build — which is where today's
      # breakage actually showed up.
      - name: Production build
        run: npm run build

      # testem.js already carries a CI launcher (--headless=new --no-sandbox
      # --disable-dev-shm-usage); ubuntu-latest ships the Chrome it needs.
      - name: Unit tests
        run: npm test
